##
# Named states from lib/captureStates.ts, opened by link in the app felt-opaque.yaml left running (ios.yml).
# iOS asks "Open in Murlan?" before the first link only, and its Open button carries no label: it is
# tapped where run 38058967733 measured it, 148 pt below Cancel, in whichever frame the alert reports.
appId: "${MAESTRO_APP_ID}"
---
- openLink: "murlan://capture?state=lamp-bottom"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn:
          point: "198,530"
          waitToSettleTimeoutMs: 500
          optional: true
      - extendedWaitUntil:
          notVisible: "Cancel"
          timeout: 2000
          optional: true
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn:
          point: "530,222"
          waitToSettleTimeoutMs: 500
          optional: true
- extendedWaitUntil:
    visible:
      id: "game-table"
    timeout: 30000
- assertVisible: "Move the lamp to the next seat"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: lamp-bottom
- openLink: "murlan://capture?state=pile-right"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: pile-right
- openLink: "murlan://capture?state=held"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: held

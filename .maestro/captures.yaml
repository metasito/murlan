##
# Named states from lib/captureStates.ts, opened by link in the app felt-opaque.yaml left running (ios.yml).
# iOS asks "Open in Murlan?" before the first link only, and its Open button carries no label: it is
# tapped by position, in landscape points, where run 38061909920 found it.
appId: "${MAESTRO_APP_ID}"
---
- openLink: "murlan://capture?state=lamp-bottom"
- extendedWaitUntil:
    visible: "Cancel"
    timeout: 5000
    optional: true
- runFlow:
    when:
      visible: "Cancel"
    commands:
      - tapOn:
          point: "530,222"
          retryTapIfNoChange: false
          waitToSettleTimeoutMs: 500
# Not `game-table`: the table felt-opaque.yaml left open already matches it, before the link lands.
- extendedWaitUntil:
    visible: "Move the lamp to the next seat"
    timeout: 60000
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: lamp-bottom
- openLink: "murlan://capture?state=pile-right"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: pile-right
- openLink: "murlan://capture?state=play-right-landed"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: play-right-landed
- openLink: "murlan://capture?state=bomb-landed"
- waitForAnimationToEnd:
    timeout: 3000
# The link's own landing is over by the time openLink settles. The settle cap keeps the shot inside
# FLARE_BRIEF_MS of the rethrow's landing (components/table/moments.tsx).
- tapOn:
    text: "Throw the pile again"
    waitToSettleTimeoutMs: 800
- takeScreenshot: bomb-landed
- openLink: "murlan://capture?state=held"
- waitForAnimationToEnd:
    timeout: 3000
- takeScreenshot: held

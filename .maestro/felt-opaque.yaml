##
# The felt's opaque Metal layer, photographed as the table appears and once it settles. The felt
# mounts in portrait and GameTable's landscape lock resizes it; a device rotation after that cannot
# resize it again, the lock holds. `tools/ci/feltPixels.mjs` reads both (ios.yml).
# The launch path is offline-game.yaml's; its comments say why each step is there.
appId: "${MAESTRO_APP_ID}"
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(it-IT)"
      AppleLocale: "it_IT"
- runFlow: _launch.yaml
- runFlow:
    file: _lobby.yaml
    env:
      FORMAT: "Manche secca.*"
- takeScreenshot: felt-first
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot: felt-settled
- runFlow: captures.yaml

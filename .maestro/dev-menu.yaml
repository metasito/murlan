##
# Dismisses Expo Go's first-connection dev-menu tip, wherever it turns up.
#
# The tip ("this is the developer menu") is rendered *on top of* the real dev
# menu sheet (Reload / Go Home / …), and both layers have to go, in this order
# only: "Continue" dismisses the tip and *reveals* the sheet, then one back
# press closes the sheet. A back press against the tip instead leaves the
# experience altogether and lands on Expo Go's own home screen, where none of
# the app's copy exists and every assertion after it fails against a screen the
# app never rendered. A runner meets this on every run, because it installs
# Expo Go fresh each time.
#
# It is a subflow because *when* it appears is per-platform: Android raises it
# as the connection is made, iOS not until the bundle has finished loading and
# the app has drawn. Callers run it at both points; whichever one it is not
# showing at is a no-op.
appId: "${typeof MAESTRO_EXPO_GO_APP_ID === 'string' ? MAESTRO_EXPO_GO_APP_ID : 'host.exp.exponent'}"
---
- runFlow:
    when:
      visible: "Continue"
    commands:
      - tapOn: "Continue"
- runFlow:
    when:
      visible: "Reload"
    commands:
      - back
      - extendedWaitUntil:
          notVisible: "Reload"
          timeout: 10000

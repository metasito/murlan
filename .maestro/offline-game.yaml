##
# Offline gameplay flow: starts a real offline match vs one AI opponent
# and plays it through to the result screen using the server-validated
# game engine — not a mock. Exercises real turn-taking, the AI, and the
# result screen, none of which the web/native/unit suites can see
# (see docs/TESTING.md).
#
# Strategy: configure a 2-player, single-hand ("Manche secca") match so
# it ends after exactly one hand. Whenever it's legal to pass, this
# flow passes — that is always a legal move except when this seat must
# open the very first round of the hand, which in Murlan requires
# playing the 3 of Spades specifically (see docs/RULES.md). If this
# seat is dealt 3♠ it plays it; otherwise it only ever passes. Passing
# is not "not playing" — it drives real turn cycling through the
# server-authoritative engine and the AI until someone empties their
# hand, which is what actually reaches the result screen. This is a
# deliberate simplification, not full strategic play — see
# docs/TESTING.md for why.
#
# Requires a running Expo dev server reachable from the emulator — see
# smoke.yaml and docs/TESTING.md for the packager URL caveat.
#
# Performance note: every tapOn in the game-table section pins
# `waitToSettleTimeoutMs: 500`. Without it, a first full run took
# ~17 minutes and the app fell out of the JS session partway through —
# Maestro's default "wait for the UI to stop changing" behaviour never
# resolves against this screen's continuous Reanimated glow/pulse
# animations (the active-turn highlight, the selected-card glow), so
# every single tap was blocking for its full internal timeout. Capping
# the settle-wait fixed it. See docs/TESTING.md.
# Driven against a real build (`ios.yml`) no dev server is needed: the app
# carries its own bundle. Driven through Expo Go — a developer here, and
# `maestro.yml` until #627's Android half lands — it needs one the device can
# reach, over `adb reverse tcp:8081 tcp:8081`, which forwards the device's own
# loopback to the host and works on any emulator anywhere. The emulator's
# `10.0.2.2` alias for the host does not: on a GitHub runner a request to it
# never reaches the dev server at all.
#
# MURLAN_PACKAGER_URL cannot be overridden from the command line. `-e` is
# applied *before* the `env:` block, so a key there wins over the flag rather
# than yielding to it — which is why the address has to be one that works
# everywhere. Change it here, or drop the reverse and put a reachable host in.
# The app under test. `ios.yml` builds the real app and passes its own bundle
# identifier in; with nothing passed this is Expo Go's Android package, which is
# what a developer on this machine is driving.
appId: "${typeof MAESTRO_APP_ID === 'string' ? MAESTRO_APP_ID : 'host.exp.exponent'}"
env:
  # `disableOnboarding=1` is expo-dev-menu's own switch (expo/expo#19024): it
  # sets isOnboardingFinished before the app launches, so Expo Go never raises
  # the "this is the developer menu" tip that otherwise covers the screen every
  # run — `clearState` wipes the flag that would have remembered it.
  MURLAN_PACKAGER_URL: exp://127.0.0.1:8081?disableOnboarding=1
---
- launchApp:
    # Each flow has to start from the same place: run second and this one
    # inherits whatever the first left behind - a saved game on the home
    # screen, or Expo Go sitting on its own launcher with the deep link
    # never taken - and asserts against a screen the app never rendered.
    # Which flow runs first is not fixed, so both orders have to work.
    clearState: true
# Only Expo Go has to be reached through a packager. The real app carries its
# own bundle, so `launchApp` above has already put it on screen, and everything
# in here would ask the device to open a scheme nothing handles.
- runFlow:
    when:
      true: ${typeof MAESTRO_APP_ID !== 'string' || MAESTRO_APP_ID.indexOf('host.exp') === 0}
    commands:
      # Cleared, then stopped: Expo Go takes the link as a cold start and opens
      # the project with it. Delivered to the copy `launchApp` just brought to
      # the front, it is ignored and the flow asserts against Expo Go's own home.
      - stopApp
      - openLink: "${MURLAN_PACKAGER_URL}"
      # iOS asks before handing a custom-scheme link to another app, and the
      # link is not followed until it is answered. The simulator runs it-IT, so
      # the button reads "Apri". Android is never asked, and iOS only asks the
      # first time in a session — so this is optional inside the platform it
      # belongs to, rather than awaited.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Apri"
                optional: true
# Waited for and exited on the Skip button, which the header carries on every beat.
# "GUIDA RAPIDA" is the card title of an `info` beat only — a `play` beat titles
# the card after itself and `complete` has its own — so gating on it would skip
# the block on most of the tutorial, and waiting for it to go would be satisfied
# by the tutorial merely advancing a beat. Being untappable on Android does not
# make the button invisible, which is all `visible` asks.
#
# Split by platform because Android has no working tap here at all: no control on
# this screen takes touch — the Skip button no more than the body's own "Inizia"
# — so the tap fires into nothing; #627 has it measured with `adb shell input
# tap` and no Maestro in the loop. Maestro's `back` on iOS is an edge-swipe
# gesture rather than a key press, so it is not a like-for-like substitute to
# hand that platform as well.
#
# The iOS tap targets the button's accessibilityLabel, not its visible "Salta":
# the Text child is `a11yHidden` on purpose, so the label is the only node the
# control exposes. Collapse this to that tap alone when #627 closes.
- runFlow:
    commands:
      # Waited for, not asked about. `clearState` means the tutorial has never
      # been seen, so on a cleared launch it always comes — but it is *pushed
      # over* home rather than rendered instead of it, and home gets there
      # first. A wait on "either screen" was satisfied by home, this block found
      # nothing and skipped itself, and the assertions after it ran against a
      # tutorial that arrived in the meantime (#353).
      #
      # A CI device is slower than a developer's on a cold start, and running
      # out of budget here reads identically to the app never loading at all.
      - extendedWaitUntil:
          visible: "Salta il tutorial"
          timeout: 180000
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Salta il tutorial"
      # Ten seconds was a developer machine dismissing a sheet. A device on a
      # shared runner is slower, and running out there reads as a dead control
      # rather than a slow one.
      - extendedWaitUntil:
          notVisible: "Salta il tutorial"
          timeout: 30000

# --- Lobby: offline vs AI, 2 players, single hand ---
- assertVisible: "Offline"
- tapOn: "Offline"
# The format tiles carry a second line, and Maestro matches the *whole*
# element: iOS exposes this one as "Manche secca: Una sola mano", so the bare
# title matches nothing. The trailing `.*` carries the subtitle and the
# platforms that compose it differently, without pinning today's wording.
- assertVisible: "Manche secca.*"
- tapOn: "Manche secca.*"
- assertVisible: "Inizia Partita"
- tapOn: "Inizia Partita"

# The game table is landscape-locked and the screen physically
# rotates on entry — give it time to settle before looking for
# anything, or a rotation-mid-flight screenshot reads as blank.
- extendedWaitUntil:
    visible:
      id: "game-table"
    # Twenty seconds is a developer machine entering this screen. A CI
    # emulator rotates and mounts the table a good deal slower than that, and
    # running out here reads as the table never arriving.
    timeout: 90000

# --- Opening move, only if this seat was dealt the 3 of Spades ---
# The card by its own name, which is the only thing here that is the same on
# every screen. A fanned hand overlaps each card with the next one drawn on top,
# so the box a card *draws* into is mostly covered — but the box it is *tapped*
# by is not: `hand.tsx` gives every card but the last a pressable exactly one
# slot wide (`hitW={step}`), which is the strip it exposes. That pressable is
# the node carrying the accessibility label, so its centre is inside the strip
# and a tap on it can only reach this card.
#
# Screen percentages were what this did before, four of them, derived on one
# Android emulator against a fixed 2-player landscape layout. Nothing made them
# land on the same card on an iPhone, and the branch only runs when this seat is
# dealt 3♠ — so they would have passed or failed at random rather than reporting
# anything (#353).
# The table appearing is not the hand having arrived. `game-table` mounts while
# the deal is still flying, and a condition evaluated then reads a hand that is
# gone a second later: run 33418358705 gated on "3 di Picche", found it, and
# tapped for six seconds against a hand whose lowest card was the 3 di Quadri —
# the opponent had already led. Same shape as the tutorial race above: wait for
# the state, do not ask whether it has arrived.
#
# The pass button, because it is the only control on this screen that exposes a
# node with a real size: the turn summary and the hand's own count are 1x1
# points, and the play button exposes nothing at all while it is disabled.
# Waiting for a control to exist is weaker than waiting for the deal to land,
# but it is checkable — and the alternative was another guess.
- extendedWaitUntil:
    visible:
      id: "btn-passa"
    timeout: 60000
# Only when this deal actually gave us the opening card. It is a real deal, so
# some will not: the block is skipped then and the hand is passed out below,
# which still drives the table to the result screen.
- runFlow:
    when:
      visible: "3 di Picche"
    commands:
      - tapOn:
          text: "3 di Picche"
          waitToSettleTimeoutMs: 500
      # The button turns on only for a legal selection, so this is what says the
      # tap reached the card it named rather than a neighbour.
      - assertVisible: "Gioca le carte selezionate"
      - tapOn:
          id: "btn-gioca"
          waitToSettleTimeoutMs: 500

# --- Everything else: pass whenever it's legal to. With 2 players a
# pass immediately ends the round in the AI's favour, so this cycles
# real turns through the AI until someone's hand empties. `optional`
# so tapping a disabled/off-turn button is a harmless no-op instead of
# a flow failure. `times` is a hard backstop independent of whatever
# `repeat`'s own visibility polling does.
# One pass per turn the opponent takes, and it has a hand of about twenty — so
# thirty is the hand plus margin, not a number picked to be safely large. Sixty
# was, and every surplus iteration still costs a full screen read on a table
# whose animations never stop, which is where this flow's minutes went.
- repeat:
    times: 30
    commands:
      - tapOn:
          id: "btn-passa"
          optional: true
          waitToSettleTimeoutMs: 500

# --- Result screen ---
- assertVisible:
    id: "btn-home"

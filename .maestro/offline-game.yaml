##
# Offline gameplay flow: starts a real offline match vs one bot opponent
# and plays it through to the end-of-match board using the server-validated
# game engine — not a mock. Exercises real turn-taking, the bot, and the
# board on the felt, none of which the web/native/unit suites can see
# (see docs/agents/checks.md).
#
# Strategy: configure a 2-player, single-round match so
# it ends after exactly one round. Whenever it's legal to pass, this
# flow passes — that is always a legal move except when this seat must
# open the round, which in Murlan requires
# playing the 3 of Spades specifically (see docs/GAME-RULES.md). If this
# seat is dealt 3♠ it plays it; otherwise it only ever passes. Passing
# is not "not playing" — it drives real turn cycling through the
# server-authoritative engine and the bot until someone empties their
# hand, which is what actually ends the match. This is a
# deliberate simplification, not full strategic play.
#
# Performance note: every tapOn that *lands on* the game table pins
# `waitToSettleTimeoutMs: 500` — which includes the last tap of the menu, since
# the wait happens after the tap, against the screen it opened.
# `tests/tooling/gameTableTapSettle.test.ts` holds the line. Without it, a first full run took
# ~17 minutes and the app fell out of the JS session partway through —
# Maestro's default "wait for the UI to stop changing" behaviour never
# resolves against this screen's continuous Reanimated glow/pulse
# animations (the active-turn highlight, the selected-card glow), so
# every single tap was blocking for its full internal timeout. Capping
# the settle-wait fixed it. See docs/agents/checks.md, "Device runs".
#
# The app under test is a release build carrying its own bundle: both device
# jobs, `ios.yml` and `maestro.yml`, build it and pass its identifier in.
appId: "${MAESTRO_APP_ID}"
---
- launchApp:
    # Each flow has to start from the same place: run second and this one
    # inherits whatever the first left behind - a saved game on the home
    # screen - and asserts against a screen the app never rendered.
    # Which flow runs first is not fixed, so both orders have to work.
    clearState: true
    # This flow selects on Italian copy, so it asks the app for Italian rather
    # than depending on the device being in it. Reaching the app as
    # NSUserDefaults launch arguments, the same mechanism an Xcode scheme uses
    # — and the parentheses are load-bearing: AppleLanguages is a list, and the
    # argument domain parses `(it-IT)` as one where a bare `it-IT` would set a
    # string the locale lookup ignores.
    arguments:
      AppleLanguages: "(it-IT)"
      AppleLocale: "it_IT"
      MurlanE2EOpener: "1"
- runFlow: _launch.yaml
- runFlow:
    file: _lobby.yaml
    env:
      FORMAT: "Manche secca.*"

# --- Opening move, only if this seat was dealt the 3 of Spades ---
# The card by its own name, which is the only thing here that is the same on
# every screen. A fanned hand overlaps each card with the next one drawn on top,
# so the box a card *draws* into is mostly covered — but the box it is *tapped*
# by is not: `hand.tsx` gives every card but the last a pressable exactly one
# slot wide (`hitW={step}`), which is the strip it exposes. That pressable is
# the node carrying the accessibility label, so its centre is inside the strip
# and a tap on it can only reach this card.
#
# Screen percentages were what this did before, four of them, derived on one
# Android emulator against a fixed 2-player landscape layout. Nothing made them
# land on the same card on an iPhone, and the branch only runs when this seat is
# dealt 3♠ — so they would have passed or failed at random rather than reporting
# anything (#353).
# The table appearing is not the hand having arrived. `game-table` mounts while
# the deal is still flying, and a condition evaluated then reads a hand that is
# gone a second later: run 33418358705 gated on "3 di Picche", found it, and
# tapped for six seconds against a hand whose lowest card was the 3 di Quadri —
# the opponent had already led. Same shape as the tutorial race above: wait for
# the state, do not ask whether it has arrived.
#
# The pass button, because it is the only control on this screen that exposes a
# node with a real size: the turn summary and the hand's own count are 1x1
# points, and the play button exposes nothing at all while it is disabled.
# Waiting for a control to exist is weaker than waiting for the deal to land,
# but it is checkable — and the alternative was another guess.
- extendedWaitUntil:
    visible:
      id: "btn-passa"
    timeout: 60000
# iOS deals this seat the opener (`lib/e2eOpener.ts`), so the tap on a card below runs on every ios.yml run.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Inizi tu.*"
          timeout: 30000
# Opening is not optional for the seat that has to do it: passing is illegal
# until the first card is down, so a flow that skips this waits out the whole
# round tapping a button that can never enable.
#
# Asked of the app, not of the deal. The banner is the seat's own instruction —
# it appears only when this seat must open — so gating on it is the same
# question the game is answering, rather than a guess about what was dealt.
# Naming a card here is what broke: `3 di Picche` assumed Murlan's four-player
# opener, and two players take a four-player deal (#681), so the 3 of Spades is
# often not in play at all and the lowest card dealt opens instead. Run
# 33428373840 was dealt the 3 of Hearts, skipped this block, and passed thirty
# times into a disabled button.
#
# The card is taken by id, which is neither counted nor translated. Counting was
# what broke: Maestro's `index` sorts matches by position rather than by tree
# order, and the fan's arc puts the outermost card a pixel below its neighbours,
# which is enough to sort it behind all of them — so `index: 0` took the second
# card on every run. Naming it instead is not available either, because the two
# spellings diverge by design: the banner writes `getCardDisplayRank` and
# `getSuitSymbol` ("Inizi tu! Hai il 3♥") where the card's own label writes
# `cardSpokenName` ("3 di Cuori"). `components/table/hand.tsx` marks the one card
# the opening must include, and only while it is still owed.
- runFlow:
    when:
      visible: "Inizi tu.*"
    commands:
      - tapOn:
          id: "card-start"
          waitToSettleTimeoutMs: 500
      # The button turns on only for a legal selection, so this is what says the
      # tap reached the card the banner asked for rather than a neighbour.
      - assertVisible: "Gioca le carte selezionate"
      - tapOn:
          id: "btn-gioca"
          waitToSettleTimeoutMs: 500

# Pass whenever it is legal to. With two players a pass ends the trick in the
# Bot's favour, so this cycles real turns through the bot until a hand empties.
# `optional` keeps a tap on the off-turn button a no-op rather than a failure.
#
# The loop ends on the board's Home button: `btn-passa` stays drawn, disabled, through the table's
# ending, so it cannot mark the round's end. `times` is the ceiling, the hand plus margin.
- repeat:
    times: 30
    while:
      notVisible:
        id: "btn-home"
    commands:
      - tapOn:
          id: "btn-passa"
          optional: true
          waitToSettleTimeoutMs: 500

# --- The board on the felt ---
- extendedWaitUntil:
    visible:
      id: "btn-home"
    timeout: 30000

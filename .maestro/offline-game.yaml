##
# Offline gameplay flow: starts a real offline match vs one AI opponent
# and plays it through to the result screen using the server-validated
# game engine — not a mock. Exercises real turn-taking, the AI, and the
# result screen, none of which the web/native/unit suites can see
# (see docs/TESTING.md).
#
# Strategy: configure a 2-player, single-hand ("Manche secca") match so
# it ends after exactly one hand. Whenever it's legal to pass, this
# flow passes — that is always a legal move except when this seat must
# open the very first round of the hand, which in Murlan requires
# playing the 3 of Spades specifically (see docs/RULES.md). If this
# seat is dealt 3♠ it plays it; otherwise it only ever passes. Passing
# is not "not playing" — it drives real turn cycling through the
# server-authoritative engine and the AI until someone empties their
# hand, which is what actually reaches the result screen. This is a
# deliberate simplification, not full strategic play — see
# docs/TESTING.md for why.
#
# Requires a running Expo dev server reachable from the emulator — see
# smoke.yaml and docs/TESTING.md for the packager URL caveat.
#
# Performance note: every tapOn in the game-table section pins
# `waitToSettleTimeoutMs: 500`. Without it, a first full run took
# ~17 minutes and the app fell out of the JS session partway through —
# Maestro's default "wait for the UI to stop changing" behaviour never
# resolves against this screen's continuous Reanimated glow/pulse
# animations (the active-turn highlight, the selected-card glow), so
# every single tap was blocking for its full internal timeout. Capping
# the settle-wait fixed it. See docs/TESTING.md.
# Requires a running Expo dev server the emulator can reach.
#
# Reached over `adb reverse tcp:8081 tcp:8081`, which forwards the device's own
# loopback to the host and works on any emulator anywhere, including a CI
# runner. `10.0.2.2` — the emulator's alias for the host loopback — was the
# default before, and it is not universal: on a GitHub runner's emulator a
# request to it never reaches the dev server at all.
#
# This value cannot be overridden from the command line. `-e` is applied
# *before* this block, so an `env:` key here wins over the flag rather than
# yielding to it — which is why the address has to be one that works
# everywhere. Change it here, or drop the reverse and put a reachable host in.
# Expo Go's iOS bundle identifier capitalises Exponent; the Android package
# does not, and a simulator answers NotFound to every request made with the
# Android spelling. `ios.yml` passes the iOS one in; everything else, this
# machine included, gets Android's.
appId: "${typeof MAESTRO_EXPO_GO_APP_ID === 'string' ? MAESTRO_EXPO_GO_APP_ID : 'host.exp.exponent'}"
env:
  # `disableOnboarding=1` is expo-dev-menu's own switch (expo/expo#19024): it
  # sets isOnboardingFinished before the app launches, so Expo Go never raises
  # the "this is the developer menu" tip that otherwise covers the screen every
  # run — `clearState` wipes the flag that would have remembered it.
  MURLAN_PACKAGER_URL: exp://127.0.0.1:8081?disableOnboarding=1
---
- launchApp:
    # Each flow has to start from the same place: run second and this one
    # inherits whatever the first left behind - a saved game on the home
    # screen, or Expo Go sitting on its own launcher with the deep link
    # never taken - and asserts against a screen the app never rendered.
    # Which flow runs first is not fixed, so both orders have to work.
    clearState: true
- openLink: "${MURLAN_PACKAGER_URL}"
# iOS asks before handing a custom-scheme link to another app, and the link
# is not followed until it is answered. The simulator runs it-IT, so the
# button reads "Apri". Android is never asked, and iOS only asks the first
# time in a session — so this is optional inside the platform it belongs to,
# rather than awaited.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Apri"
          optional: true
- extendedWaitUntil:
    visible: "IL GIOCO DI CARTE|GUIDA RAPIDA"
    # A minute is what a developer's machine needs. A CI emulator is slower
    # than that on a cold start, and running out of budget here reads
    # identically to the app never loading at all.
    timeout: 180000
- runFlow:
    when:
      visible: "Salta il tutorial"
    commands:
      - tapOn: "Salta il tutorial"
      - extendedWaitUntil:
          notVisible: "GUIDA RAPIDA"
          timeout: 10000

# --- Lobby: offline vs AI, 2 players, single hand ---
- assertVisible: "Offline"
- tapOn: "Offline"
- assertVisible: "Manche secca"
- tapOn: "Manche secca"
- assertVisible: "Inizia Partita"
- tapOn: "Inizia Partita"

# The game table is landscape-locked and the screen physically
# rotates on entry — give it time to settle before looking for
# anything, or a rotation-mid-flight screenshot reads as blank.
- extendedWaitUntil:
    visible:
      id: "game-table"
    # Twenty seconds is a developer machine entering this screen. A CI
    # emulator rotates and mounts the table a good deal slower than that, and
    # running out here reads as the table never arriving.
    timeout: 90000

# --- Opening move, only if this seat was dealt the 3 of Spades ---
# All 3s sort to the front of the hand regardless of shuffle (3 is the
# lowest rank), but which of up to four 3-slots holds 3♠ varies. The
# fanned hand overlaps each card with the next one drawn on top, so a
# *center* tap on a card can land on its right-hand neighbor instead
# (verified with `adb shell uiautomator dump`: reported bounds are
# correct, the touch just lands on the overlapping sibling) — a real
# rendering characteristic worth knowing about, not a Maestro quirk.
# Tapping ~20px into each slot's exposed left sliver avoids it. Slot 0
# starts at 17% of screen width in this fixed 2-player/landscape
# layout, +2.5% per slot. Try up to 4 slots, deselecting a wrong pick
# before the next attempt, stopping as soon as Gioca reports the
# selection is valid.
- runFlow:
    when:
      visible: "3 di Picche"
    commands:
      - runFlow:
          when:
            notVisible: "Gioca le carte selezionate"
          commands:
            - tapOn:
                point: "17%,81%"
                waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            notVisible: "Gioca le carte selezionate"
          commands:
            - tapOn:
                point: "17%,81%"
                waitToSettleTimeoutMs: 500
            - tapOn:
                point: "20%,81%"
                waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            notVisible: "Gioca le carte selezionate"
          commands:
            - tapOn:
                point: "20%,81%"
                waitToSettleTimeoutMs: 500
            - tapOn:
                point: "22%,81%"
                waitToSettleTimeoutMs: 500
      - runFlow:
          when:
            notVisible: "Gioca le carte selezionate"
          commands:
            - tapOn:
                point: "22%,81%"
                waitToSettleTimeoutMs: 500
            - tapOn:
                point: "25%,81%"
                waitToSettleTimeoutMs: 500
      - assertVisible: "Gioca le carte selezionate"
      - tapOn:
          id: "btn-gioca"
          waitToSettleTimeoutMs: 500

# --- Everything else: pass whenever it's legal to. With 2 players a
# pass immediately ends the round in the AI's favour, so this cycles
# real turns through the AI until someone's hand empties. `optional`
# so tapping a disabled/off-turn button is a harmless no-op instead of
# a flow failure. `times` is a hard backstop independent of whatever
# `repeat`'s own visibility polling does.
- repeat:
    times: 60
    commands:
      - tapOn:
          id: "btn-passa"
          optional: true
          waitToSettleTimeoutMs: 500

# --- Result screen ---
- assertVisible:
    id: "btn-home"

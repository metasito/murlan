##
# Smoke flow: launches the app through Expo Go and asserts the home
# screen actually rendered. This is the "is anything on fire" check —
# offline-game.yaml exercises real gameplay.
#
# Requires a running Expo dev server reachable from the emulator. The
# packager URL below must match what `npx expo start --android` printed
# ("Opening exp://<lan-ip>:8081 on <avd-name>") — it is this machine's
# LAN IP, not portable across machines. See docs/TESTING.md.
# Requires a running Expo dev server the emulator can reach.
#
# Reached over `adb reverse tcp:8081 tcp:8081`, which forwards the device's own
# loopback to the host and works on any emulator anywhere, including a CI
# runner. `10.0.2.2` — the emulator's alias for the host loopback — was the
# default before, and it is not universal: on a GitHub runner's emulator a
# request to it never reaches the dev server at all.
#
# This value cannot be overridden from the command line. `-e` is applied
# *before* this block, so an `env:` key here wins over the flag rather than
# yielding to it — which is why the address has to be one that works
# everywhere. Change it here, or drop the reverse and put a reachable host in.
# Expo Go's iOS bundle identifier capitalises Exponent; the Android package
# does not, and a simulator answers NotFound to every request made with the
# Android spelling. `ios.yml` passes the iOS one in; everything else, this
# machine included, gets Android's.
appId: "${typeof MAESTRO_EXPO_GO_APP_ID === 'string' ? MAESTRO_EXPO_GO_APP_ID : 'host.exp.exponent'}"
env:
  # `disableOnboarding=1` is expo-dev-menu's own switch (expo/expo#19024): it
  # sets isOnboardingFinished before the app launches, so Expo Go never raises
  # the "this is the developer menu" tip that otherwise covers the screen every
  # run — `clearState` wipes the flag that would have remembered it.
  MURLAN_PACKAGER_URL: exp://127.0.0.1:8081?disableOnboarding=1
---
- launchApp:
    # Each flow has to start from the same place: run second and this one
    # inherits whatever the first left behind - a saved game on the home
    # screen, or Expo Go sitting on its own launcher with the deep link
    # never taken - and asserts against a screen the app never rendered.
    # Which flow runs first is not fixed, so both orders have to work.
    clearState: true
# Cleared, then stopped: Expo Go takes the link as a cold start and opens the
# project with it. Delivered to the copy `launchApp` just brought to the
# front, it is ignored and the flow asserts against Expo Go's own home.
- stopApp
- openLink: "${MURLAN_PACKAGER_URL}"
# iOS asks before handing a custom-scheme link to another app, and the link
# is not followed until it is answered. The simulator runs it-IT, so the
# button reads "Apri". Android is never asked, and iOS only asks the first
# time in a session — so this is optional inside the platform it belongs to,
# rather than awaited.
- runFlow:
    when:
      platform: iOS
    commands:
      - tapOn:
          text: "Apri"
          optional: true
# Not "Murlan" alone: Expo Go's own native splash screen shows the app
# name under the icon while the JS bundle is still loading, so a loose
# "Murlan" wait is satisfied by Expo Go chrome, not the app. Wait for
# copy that only exists once our JS has actually rendered (home
# subtitle, or the tutorial's welcome card on a first-ever launch).
- extendedWaitUntil:
    visible: "IL GIOCO DI CARTE|GUIDA RAPIDA"
    # A minute is what a developer's machine needs. A CI emulator is slower
    # than that on a cold start, and running out of budget here reads
    # identically to the app never loading at all.
    timeout: 180000
# First cold launch auto-pushes the interactive tutorial
# (app/index.tsx effect on `@murlan_tutorial_seen`), and it has to go before
# anything on the home screen can be asserted.
#
# `back`, not a tap on "Salta il tutorial": no control on this screen takes
# touch on Android, the Skip button no more than the body's own "Inizia" —
# #627 has it measured with `adb shell input tap` and no Maestro in the loop.
# Restore the tap when #627 closes. It is the input a real user gives, and
# this line passes either way, so nothing else will notice it standing in.
- runFlow:
    when:
      visible: "GUIDA RAPIDA"
    commands:
      - back
      - extendedWaitUntil:
          notVisible: "GUIDA RAPIDA"
          timeout: 10000
# `homeMenu` promotes one way to play into the hero and filters it out of the
# tiles, so with `clearState` - never a saved game, never an account - the hero
# is `online` and `home.modeOnline` renders nowhere.
#
# The hero's whole label, not "Gioca online": Maestro matches the *entire*
# element, and iOS exposes this node only as the label with its sublabel
# appended, with no separate text node to match the shorter string against.
- assertVisible: "Offline"
- assertVisible: "Gioca online. Accedi per giocare"
- assertVisible: "Il mio profilo"
# The settings modal is where #389 crashed: Fabric converts accessibilityValue
# to int while mounting the host view, and the music slider's default volume is
# a fraction — so the screen died on open, on device, against a green CI.
# Opening it is the only way to exercise that mount for real.
#
# Asserted on the music slider, because the slider is what #389 killed: it is
# the node whose accessibilityValue Fabric converts to int. A title would mount
# with the crash still in the tree below it.
#
# `"Volume"` alone never matched anything — Maestro matches the *whole* element,
# and the tree holds the slider's label with its value appended
# ("Volume della musica di sottofondo, 50%" on Android). The trailing `.*`
# carries that suffix and the platforms that omit it, without pinning a volume.
- tapOn: "Impostazioni"
- assertVisible: "Volume della musica di sottofondo.*"
- tapOn: "Chiudi impostazioni"
- assertVisible: "Offline"

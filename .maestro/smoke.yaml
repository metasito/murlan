##
# Smoke flow: launches the app and asserts the home screen actually rendered.
# This is the "is anything on fire" check — offline-game.yaml exercises real
# gameplay.
#
# Driven against a real build (`ios.yml`) nothing below is needed: the app
# carries its own bundle. Driven through Expo Go — a developer here, and
# `maestro.yml` until #627's Android half lands — it needs a dev server the
# device can reach, over `adb reverse tcp:8081 tcp:8081`, which forwards the
# device's own loopback to the host and works on any emulator anywhere. The
# emulator's `10.0.2.2` alias for the host does not: on a GitHub runner a
# request to it never reaches the dev server at all.
#
# MURLAN_PACKAGER_URL cannot be overridden from the command line. `-e` is
# applied *before* the `env:` block, so a key there wins over the flag rather
# than yielding to it — which is why the address has to be one that works
# everywhere. Change it here, or drop the reverse and put a reachable host in.
# The app under test. `ios.yml` builds the real app and passes its own bundle
# identifier in; with nothing passed this is Expo Go's Android package, which is
# what a developer on this machine is driving.
appId: "${typeof MAESTRO_APP_ID === 'string' ? MAESTRO_APP_ID : 'host.exp.exponent'}"
env:
  # `disableOnboarding=1` is expo-dev-menu's own switch (expo/expo#19024): it
  # sets isOnboardingFinished before the app launches, so Expo Go never raises
  # the "this is the developer menu" tip that otherwise covers the screen every
  # run — `clearState` wipes the flag that would have remembered it.
  MURLAN_PACKAGER_URL: exp://127.0.0.1:8081?disableOnboarding=1
---
- launchApp:
    # Each flow has to start from the same place: run second and this one
    # inherits whatever the first left behind - a saved game on the home
    # screen, or Expo Go sitting on its own launcher with the deep link
    # never taken - and asserts against a screen the app never rendered.
    # Which flow runs first is not fixed, so both orders have to work.
    clearState: true
# Only Expo Go has to be reached through a packager. The real app carries its
# own bundle, so `launchApp` above has already put it on screen, and everything
# in here would ask the device to open a scheme nothing handles.
- runFlow:
    when:
      true: ${typeof MAESTRO_APP_ID !== 'string' || MAESTRO_APP_ID.indexOf('host.exp') === 0}
    commands:
      # Cleared, then stopped: Expo Go takes the link as a cold start and opens
      # the project with it. Delivered to the copy `launchApp` just brought to
      # the front, it is ignored and the flow asserts against Expo Go's own home.
      - stopApp
      - openLink: "${MURLAN_PACKAGER_URL}"
      # iOS asks before handing a custom-scheme link to another app, and the
      # link is not followed until it is answered. The simulator runs it-IT, so
      # the button reads "Apri". Android is never asked, and iOS only asks the
      # first time in a session — so this is optional inside the platform it
      # belongs to, rather than awaited.
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn:
                text: "Apri"
                optional: true
# Waited for and exited on the Skip button, which the header carries on every beat.
# "GUIDA RAPIDA" is the card title of an `info` beat only — a `play` beat titles
# the card after itself and `complete` has its own — so gating on it would skip
# the block on most of the tutorial, and waiting for it to go would be satisfied
# by the tutorial merely advancing a beat. Being untappable on Android does not
# make the button invisible, which is all `visible` asks.
#
# Split by platform because Android has no working tap here at all: no control on
# this screen takes touch — the Skip button no more than the body's own "Inizia"
# — so the tap fires into nothing; #627 has it measured with `adb shell input
# tap` and no Maestro in the loop. Maestro's `back` on iOS is an edge-swipe
# gesture rather than a key press, so it is not a like-for-like substitute to
# hand that platform as well.
#
# The iOS tap targets the button's accessibilityLabel, not its visible "Salta":
# the Text child is `a11yHidden` on purpose, so the label is the only node the
# control exposes. Collapse this to that tap alone when #627 closes.
- runFlow:
    commands:
      # Waited for, not asked about. `clearState` means the tutorial has never
      # been seen, so on a cleared launch it always comes — but it is *pushed
      # over* home rather than rendered instead of it, and home gets there
      # first. A wait on "either screen" was satisfied by home, this block found
      # nothing and skipped itself, and the assertions after it ran against a
      # tutorial that arrived in the meantime (#353).
      #
      # A CI device is slower than a developer's on a cold start, and running
      # out of budget here reads identically to the app never loading at all.
      - extendedWaitUntil:
          visible: "Salta il tutorial"
          timeout: 180000
      - runFlow:
          when:
            platform: Android
          commands:
            - back
      - runFlow:
          when:
            platform: iOS
          commands:
            - tapOn: "Salta il tutorial"
      # Ten seconds was a developer machine dismissing a sheet. A device on a
      # shared runner is slower, and running out there reads as a dead control
      # rather than a slow one.
      - extendedWaitUntil:
          notVisible: "Salta il tutorial"
          timeout: 30000
# `homeMenu` promotes one way to play into the hero and filters it out of the
# tiles, so with `clearState` - never a saved game, never an account - the hero
# is `online` and `home.modeOnline` renders nowhere.
#
# The hero's whole label, not "Gioca online": Maestro matches the *entire*
# element, and iOS exposes this node only as the label with its sublabel
# appended, with no separate text node to match the shorter string against.
- assertVisible: "Offline"
- assertVisible: "Gioca online. Accedi per giocare"
- assertVisible: "Il mio profilo"
# The settings modal is where #389 crashed: Fabric converts accessibilityValue
# to int while mounting the host view, and the music slider's default volume is
# a fraction — so the screen died on open, on device, against a green CI.
# Opening it is the only way to exercise that mount for real.
#
# Asserted on the music slider, because the slider is what #389 killed: it is
# the node whose accessibilityValue Fabric converts to int. A title would mount
# with the crash still in the tree below it.
#
# `"Volume"` alone never matched anything — Maestro matches the *whole* element,
# and the tree holds the slider's label with its value appended
# ("Volume della musica di sottofondo, 50%" on Android). The trailing `.*`
# carries that suffix and the platforms that omit it, without pinning a volume.
- tapOn: "Impostazioni"
- assertVisible: "Volume della musica di sottofondo.*"
- tapOn: "Chiudi impostazioni"
- assertVisible: "Offline"

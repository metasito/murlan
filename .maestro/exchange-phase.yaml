##
# Exchange-phase flow: plays the first round of a real offline match
# (match format, not the single-round one) until it ends on the table, which deals
# the second round itself, and drives the exchange the engine runs on
# that deal — see #55 and docs/GAME-RULES.md §10.
#
# Strategy: same "pass whenever legal" play as offline-game.yaml for the
# first round. The match format is the lobby's own default match length
# (`app/lobby.tsx`'s `matchLength` state starts at `"match"`), so this only
# adds the format tile's own name over offline-game.yaml's flow — not a
# second play strategy. One round is enough: `dealFrom` (context/GameContext.tsx,
# called by both `startNextRound` and `startNewMatch`) builds `exchangePhase`
# synchronously with the deal.
#
# The ceremony's own overlay (`<ExchangeLegs>`, testID `exchange-announce`)
# is what ends round 1's pass loop below: the table deals round 2 on its own
# clock, so no command marks the moment it fires.
# `context/GameContext.tsx`'s `E2E_EXCHANGE_HOLD` is the authority on how
# long that hold lasts and why; not repeated here. What the exchange
# *decides* is asserted by the unit tests, which can see it — this flow only
# proves the overlay itself paints on a real device.
#
# This flow does not play the second round out: a dealt round with `btn-passa`
# live is what proves the match moved on rather than ending, and that is the
# whole claim. Costing this flow only one round over offline-game.yaml's own
# budget is deliberate — #823 is open on
# wall-clock already too slow to gate a PR.
#
# See offline-game.yaml for the performance note on `waitToSettleTimeoutMs`
# and the reasoning behind every wait below; it is not repeated here.
appId: "${MAESTRO_APP_ID}"
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(it-IT)"
      AppleLocale: "it_IT"
      MurlanE2EOpener: "1"
- runFlow: _launch.yaml
- runFlow:
    file: _lobby.yaml
    env:
      FORMAT: "Partita.*"

# --- Round 1: opening move, always on iOS, and on Android only if this seat was dealt the forced opener ---
- extendedWaitUntil:
    visible:
      id: "btn-passa"
    timeout: 60000
# iOS deals this seat the opener (`lib/e2eOpener.ts`), so the tap on a card below runs on every ios.yml run.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Inizi tu.*"
          timeout: 30000
- runFlow:
    when:
      visible: "Inizi tu.*"
    commands:
      - tapOn:
          id: "card-start"
          waitToSettleTimeoutMs: 500
      - assertVisible: "Gioca le carte selezionate"
      - tapOn:
          id: "btn-gioca"
          waitToSettleTimeoutMs: 500

# --- Round 1: pass whenever legal, until the table deals round 2 and its exchange shows ---
# `btn-passa` stays drawn, disabled, through the table's ending, so it cannot mark the round's end.
- repeat:
    times: 45
    while:
      notVisible:
        id: "exchange-announce"
    commands:
      - tapOn:
          id: "btn-passa"
          optional: true
          waitToSettleTimeoutMs: 500

# --- Round 2: a "Match" is not over after one round, so the table deals the next one itself ---
- extendedWaitUntil:
    visible:
      id: "exchange-announce"
    timeout: 20000
# This build holds the overlay until it is tapped (`E2E_EXCHANGE_HOLD`). It takes taps only once the
# winner has given; a tap before that falls through to the empty felt at the overlay's centre.
- repeat:
    times: 30
    while:
      visible:
        id: "exchange-announce"
    commands:
      - tapOn:
          id: "exchange-announce"
          optional: true
          waitToSettleTimeoutMs: 500
- extendedWaitUntil:
    notVisible:
      id: "exchange-announce"
    timeout: 30000

# --- Confirm the match moved on rather than ending: a fresh, playable round ---
- extendedWaitUntil:
    visible:
      id: "btn-passa"
    timeout: 60000
- assertVisible:
    id: "hand-row"

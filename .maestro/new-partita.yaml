##
# Nuova partita flow: plays a real offline "Manche secca" (single-hand) match to
# its end and confirms "Nuova partita" actually starts a new match — see
# #55 and docs/GAME-RULES.md. `MatchLength = "single"` means "one manche and
# done" (lib/game/gameEngine.ts), so a single hand is a genuine match ending, not
# a shortcut around one: it is the cheapest length that reaches the state
# this flow is about, and it is exactly the format offline-game.yaml already
# uses, so this adds almost nothing to that flow's own cost — #823 is open
# on wall-clock already too slow to gate a PR, and a 7-hand "Partita" would
# have cost several extra minutes for no more evidence.
#
# Maestro has no import mechanism, so the launch/tutorial/lobby boilerplate
# below is duplicated from offline-game.yaml on purpose, the way smoke.yaml
# and offline-game.yaml already duplicate it against each other.
#
# "Same seats": `startNewMatch` (context/GameContext.tsx) deals a fresh hand
# from `savedPlayerConfigs` — the seats already on the table — rather than
# returning to the lobby, so there is no player-setup screen to re-drive and
# nothing to assert about the seats beyond the table mounting again with a
# playable hand.
#
# See offline-game.yaml for the performance note on `waitToSettleTimeoutMs`
# and the reasoning behind every wait below; it is not repeated here.
appId: "${MAESTRO_APP_ID}"
---
- launchApp:
    clearState: true
    arguments:
      AppleLanguages: "(it-IT)"
      AppleLocale: "it_IT"
      MurlanE2EOpener: "1"
- runFlow:
    commands:
      - extendedWaitUntil:
          visible: "Salta il tutorial"
          timeout: 180000
      - tapOn: "Salta il tutorial"
      - extendedWaitUntil:
          notVisible: "Salta il tutorial"
          timeout: 30000

# --- Lobby: offline vs AI, 2 players, single hand ---
- assertVisible: "Offline"
- tapOn: "Offline"
- assertVisible: "Manche secca.*"
- tapOn: "Manche secca.*"
- assertVisible: "Inizia Partita"
- tapOn:
    text: "Inizia Partita"
    waitToSettleTimeoutMs: 500

- runFlow:
    when:
      platform: iOS
    commands:
      - setOrientation: LANDSCAPE_LEFT

- extendedWaitUntil:
    visible:
      id: "game-table"
    timeout: 90000

# --- Opening move, always on iOS, and on Android only if this seat was dealt the forced opener ---
- extendedWaitUntil:
    visible:
      id: "btn-passa"
    timeout: 60000
# iOS deals this seat the opener (`lib/e2eOpener.ts`), so the tap on a card below runs on every ios.yml run.
- runFlow:
    when:
      platform: iOS
    commands:
      - extendedWaitUntil:
          visible: "Inizi tu.*"
          timeout: 30000
- runFlow:
    when:
      visible: "Inizi tu.*"
    commands:
      - tapOn:
          id: "card-start"
          waitToSettleTimeoutMs: 500
      - assertVisible: "Gioca le carte selezionate"
      - tapOn:
          id: "btn-gioca"
          waitToSettleTimeoutMs: 500

# --- Pass whenever legal, until the hand empties and the board ends the partita on the table ---
- repeat:
    times: 30
    while:
      visible:
        id: "btn-passa"
    commands:
      - tapOn:
          id: "btn-passa"
          optional: true
          waitToSettleTimeoutMs: 500

# --- The board on the felt: a single-hand match is over as soon as the hand is ---
- extendedWaitUntil:
    visible:
      id: "btn-nuova-partita"
    timeout: 30000
- tapOn:
    id: "btn-nuova-partita"
    waitToSettleTimeoutMs: 500

# --- Confirm a new match actually started: a fresh, playable table ---
- extendedWaitUntil:
    visible:
      id: "game-table"
    timeout: 90000
- extendedWaitUntil:
    visible:
      id: "btn-passa"
    timeout: 60000

<!DOCTYPE html>
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta httpEquiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no, viewport-fit=cover" />
    <title>%WEB_TITLE%</title>
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
    <!-- The six weights the app draws with. `@expo-google-fonts/*` ships TTF
         only and all six of it is 2.1 MB, against 99 KB for these subsets, so
         the web build loads them here instead of through `useFonts` — see
         scripts/build-fonts.mjs and lib/fonts.web.ts. `swap` paints text in
         the fallback face immediately and replaces it when the subset lands. -->
    <style id="murlan-fonts">
      @font-face {
        font-family: "Rajdhani_500Medium";
        src: url("/fonts/Rajdhani_500Medium.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Rajdhani_600SemiBold";
        src: url("/fonts/Rajdhani_600SemiBold.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Rajdhani_700Bold";
        src: url("/fonts/Rajdhani_700Bold.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Inter_400Regular";
        src: url("/fonts/Inter_400Regular.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Inter_500Medium";
        src: url("/fonts/Inter_500Medium.woff2") format("woff2");
        font-display: swap;
      }
      @font-face {
        font-family: "Inter_600SemiBold";
        src: url("/fonts/Inter_600SemiBold.woff2") format("woff2");
        font-display: swap;
      }
    </style>
    <!-- A bare @font-face is fetched only when text first paints in it, so
         each screen that introduces a face paints once in the fallback and
         reflows. `useFonts` asked for all of them at app start, which is what
         this restores — no gate and no blocking, so PERF-02 step 2 stands. -->
    <script>
      ["Rajdhani_500Medium","Rajdhani_600SemiBold","Rajdhani_700Bold","Inter_400Regular","Inter_500Medium","Inter_600SemiBold"].forEach(function (family) {
        document.fonts.load('1em "' + family + '"');
      });
    </script>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript>
      You need to enable JavaScript to run this app.
    </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>

# The render spike (rest-architecture PR 0): dispatch it on the spike branch, which registers the bench scenario.
name: Render spike

on:
  workflow_dispatch:
    inputs:
      scenario:
        description: Bench scenario the branch registers; each of its `shot` rows is a screenshot in the record
        default: spike
        required: true
      platform:
        description: Which platform to run
        type: choice
        options: [both, android, ios]
        default: both
      timeout_seconds:
        description: Seconds to wait for the scenario to end
        default: "600"
        required: true

concurrency:
  group: render-spike-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  EXPO_PUBLIC_DIAGNOSTICS: "1"
  SCENARIO: ${{ inputs.scenario }}
  WAIT_SECONDS: ${{ inputs.timeout_seconds }}

jobs:
  android:
    if: inputs.platform != 'ios'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/diagnostics-android
        with:
          out-dir: ${{ runner.temp }}/spike
          record: android.ndjson
      - name: Run the spike on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-boot-anim -gpu swangle_indirect -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            timeout 300 adb wait-for-device
            i=0; until adb shell "getprop init.svc.bootanim | grep -q stopped && cmd package list packages > /dev/null 2>&1"; do i=$((i+1)); [ $i -lt 150 ] || { echo "::error::The framework never began serving."; exit 1; }; sleep 2; done
            adb shell settings put global hide_error_dialogs 1
            timeout 300 adb install -r "$APP_APK"
            adb shell "am start -W -a android.intent.action.VIEW -d 'murlan://bench?host=10.0.2.2&scenario=$SCENARIO&capture=0' $APP_ID"
            i=0; until grep -q '"k":"run".*"phase":"start"' "$RUNNER_TEMP/spike/android.ndjson" 2>/dev/null; do i=$((i+1)); [ $i -lt 150 ] || { echo "::error::The spike never started."; exit 1; }; sleep 2; done
            adb shell dumpsys meminfo "$APP_ID" > "$RUNNER_TEMP/spike/meminfo-early.txt" 2>&1 || true
            adb shell dumpsys gfxinfo "$APP_ID" reset > /dev/null 2>&1 || true
            sh .github/scripts/bench-shots.sh "$RUNNER_TEMP/spike/android.ndjson" android
            grep -q "\"name\":\"$SCENARIO\",\"phase\":\"end\"" "$RUNNER_TEMP/spike/android.ndjson" || { echo "::error::Scenario $SCENARIO never ran."; exit 1; }
            adb shell dumpsys meminfo "$APP_ID" > "$RUNNER_TEMP/spike/meminfo-end.txt" 2>&1 || true
            adb shell dumpsys gfxinfo "$APP_ID" > "$RUNNER_TEMP/spike/gfxinfo.txt" 2>&1 || true
            adb shell dumpsys SurfaceFlinger --latency > "$RUNNER_TEMP/spike/surfaceflinger-latency.txt" 2>&1 || true
      - name: Upload the spike record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-spike-android
          path: ${{ runner.temp }}/spike/

  ios:
    if: inputs.platform != 'android'
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: ./.github/actions/diagnostics-ios
        with:
          out-dir: ${{ runner.temp }}/spike
          record: ios.ndjson
      - name: Run the scenario by its deep link, taking its screenshots and sampling the app's memory
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          printf 'appId: ${MAESTRO_APP_ID}\n---\n- openLink: "murlan://bench?host=127.0.0.1&scenario=%s&capture=0"\n- tapOn:\n    text: "Open"\n    optional: true\n' "$SCENARIO" > "$RUNNER_TEMP/spike.yaml"
          maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" "$RUNNER_TEMP/spike.yaml" &
          maestro=$!
          while sleep 2; do
            pid=$(pgrep -x "$APP_EXE" | head -1)
            echo "$(date -u +%H:%M:%S) pid=${pid:-none} rss_kb=$( [ -n "$pid" ] && ps -o rss= -p "$pid" | tr -d ' ')" >> "$RUNNER_TEMP/spike/host-rss.txt"
          done &
          sampler=$!
          # The watcher runs beside Maestro, not after it: Maestro can return a minute after the link starts the scenario.
          shots=0
          sh .github/scripts/bench-shots.sh "$RUNNER_TEMP/spike/ios.ndjson" ios || shots=$?
          kill "$sampler"
          wait "$maestro" || { echo "::error::Maestro could not open the bench."; exit 1; }
          [ "$shots" = 0 ] || exit "$shots"
          grep -q "\"name\":\"$SCENARIO\",\"phase\":\"end\"" "$RUNNER_TEMP/spike/ios.ndjson" || { echo "::error::Scenario $SCENARIO never ran."; exit 1; }
      - name: Collect crash reports
        if: always()
        run: |
          cp "$HOME/Library/Logs/DiagnosticReports/"*"$APP_EXE"* "$RUNNER_TEMP/spike/" 2>/dev/null || true
          xcrun simctl spawn "$SIMULATOR_UDID" log show --last 20m --style compact --predicate "process == \"$APP_EXE\" OR eventMessage CONTAINS \"$APP_ID\"" > "$RUNNER_TEMP/spike/sim-app.log" 2>&1 || true
      - name: Upload the spike record
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: render-spike-ios
          path: ${{ runner.temp }}/spike/

# RULES.md 53. workflow_run runs main's copy of this file and of the judge, so a pull request's
# ci.yml cannot drop or replace what judges its run. Nothing from the head is checked out or run:
# its commit is fetched as git objects and read as text, and the token's one write is the check
# (tests/tooling/verdictCheck.test.ts holds this shape).
name: Test verdict

on:
  workflow_run:
    workflows: [CI]
    types: [completed]

permissions:
  actions: read
  checks: write
  contents: read
  issues: read

concurrency:
  group: test-verdict-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  judge:
    name: Judge the CI run
    if: github.event.workflow_run.event == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Post the verdict on the pull request's head
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/verdict-check.mjs

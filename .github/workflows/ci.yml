name: CI

# A branch push and its pull request are the same commit. Running on every push
# ran the whole suite twice for every PR; `push` is now limited to main so each
# commit is checked exactly once.
on:
  push:
    branches: [main]
  pull_request:

# Superseding a pull request's own push saves runner time; superseding `main`'s
# run destroys the only evidence that merged code was ever tested — the docs
# commit that follows a merge cancels it and then skips every real step.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  verify:
    name: Typecheck, test, lint
    runs-on: ubuntu-latest

    # Without a database the integration suites skip themselves (by design, so
    # `npm test` works for a contributor with no Postgres). That is exactly the
    # wrong behaviour in CI: the socket-layer tests are the ones guarding
    # impersonation, hand secrecy, the exchange bypass and the seat-vacancy
    # deadlock, and a silent skip would let any of those regress unnoticed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        # The job must not start testing before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      # Required by server/index.ts's fail-fast env check. Test-only value.
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4
        with:
          # The scope check below diffs against the base commit.
          fetch-depth: 0

      # Prose cannot break the game, so a commit that only touches docs skips
      # the ~3 minutes of install, test and build below. Deliberately an
      # allowlist: anything not recognised as prose runs the full suite, so a
      # new directory fails safe. `.github/workflows/` is NOT prose — a change
      # to this file must exercise this file.
      - name: Does this change touch the app?
        id: scope
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit — running everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$changed"
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|audit/|\.claude/)|\.md$' <<< "$changed"; then
            echo "Documentation only — skipping the app checks."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      # Node 22+ is required: tests run via `node --test` against .ts files
      # directly, relying on Node's native TypeScript type-stripping
      # (stable since Node 22.6, no ts-node/tsx/vitest needed). Node 24 is
      # the current LTS-track release and what the project is developed
      # against, so pin to it to keep local and CI runs identical.
      - uses: actions/setup-node@v4
        if: steps.scope.outputs.app == 'true'
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.scope.outputs.app == 'true'
        run: npm ci

      - name: Typecheck
        if: steps.scope.outputs.app == 'true'
        run: npm run typecheck

      - name: Test
        if: steps.scope.outputs.app == 'true'
        shell: bash
        run: |
          set -o pipefail
          npm test | tee test-output.txt

      # A skipped integration suite still exits 0, so without this a removed or
      # broken Postgres service would turn the socket-layer tests into a no-op
      # and CI would stay green. Fail loudly instead.
      - name: Assert the integration suites actually ran
        if: steps.scope.outputs.app == 'true'
        run: |
          if grep -q "DATABASE_URL not set" test-output.txt; then
            echo "::error::Integration suites skipped — the Postgres service is not reachable."
            echo "These cover socket auth, hand secrecy, the exchange bypass and seat vacancy."
            exit 1
          fi
          echo "Integration suites ran against Postgres."

      - name: Native tests
        if: steps.scope.outputs.app == 'true'
        run: npm run test:native

      - name: Lint
        if: steps.scope.outputs.app == 'true'
        run: npm run lint

      - name: Build the web and server bundles
        if: steps.scope.outputs.app == 'true'
        run: npm run expo:web:build && npm run server:build

      - name: Build the static Expo Go deployment
        if: steps.scope.outputs.app == 'true'
        env:
          EXPO_PUBLIC_DOMAIN: example.invalid
        run: npm run expo:static:build

      # The bundle esbuild produces is otherwise first executed by a Replit deploy.
      # /health answers only once the pool has reached Postgres.
      - name: The built server boots and reaches the database
        if: steps.scope.outputs.app == 'true'
        shell: bash
        env:
          PORT: "5050"
          NODE_ENV: production
        run: |
          test -f dist/index.html
          test -f server_dist/index.js
          node server_dist/index.js &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" -o health.json; then break; fi
            sleep 1
          done
          kill "$server_pid" || true
          cat health.json
          grep -q '"db":"connected"' health.json

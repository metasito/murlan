name: CI

# A branch push and its pull request are the same commit. Running on every push
# ran the whole suite twice for every PR; `push` is now limited to main so each
# commit is checked exactly once.
on:
  push:
    branches: [main]
  pull_request:
  # A branch with no open PR yet has no other way to get a real run —
  # `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:

# Superseding a pull request's own push saves runner time; superseding `main`'s
# run destroys the only evidence that merged code was ever tested — the docs
# commit that follows a merge cancels it and then skips every real step.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 22+ is required: tests run via `node --test` against .ts files
  # directly, relying on Node's native TypeScript type-stripping (stable since
  # Node 22.6, no ts-node/tsx/vitest needed). Node 24 is the current LTS-track
  # release and what the project is developed against, so pin to it to keep
  # local and CI runs identical. The `build` job is deliberately not on this —
  # it runs production's Node, for the reason given there.
  NODE_VERSION: "24"

jobs:
  # See #277: a "docs-only" change can still carry a secret, which is why this
  # job runs independently of `scope` below. Docker rather than the official
  # gitleaks-action — that action scans only new commits and carries its own
  # EULA.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      # Run via `docker run` rather than the `docker://` action syntax: the
      # container runs as root against a checkout owned by the runner user,
      # and git's dubious-ownership check can refuse the repo for that
      # mismatch alone. `GIT_CONFIG_COUNT`/`_KEY_0`/`_VALUE_0` reach git
      # directly as env vars, unlike the action form which gives us no way to
      # land a `safe.directory` entry inside the container's git config.
      # gitleaks logs every line — including the summary "N commits scanned."
      # — to stderr, not stdout; `2>&1` folds it into the pipe before `tee`,
      # or the floor below reads an empty file on every clean run.
      - name: gitleaks
        shell: bash
        run: |
          set -o pipefail
          docker run --rm \
            -v "${{ github.workspace }}:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact -v --no-color \
          2>&1 | tee gitleaks-output.txt

      # Proves the detector's trigger, not just its floor: a scratch repo with
      # a planted fake credential, scanned the same way as the real one. If
      # this doesn't fail, the scan isn't actually looking at content (the
      # stdout/stderr split above is exactly the kind of defect this catches
      # that the commit-count floor below cannot).
      - name: Self-test — gitleaks fires on a planted secret
        shell: bash
        run: |
          set -o pipefail
          scratch=$(mktemp -d)
          git -C "$scratch" init -q
          git -C "$scratch" config user.email "ci@example.invalid"
          git -C "$scratch" config user.name "CI"
          echo 'AWS_KEY = "AKIAZ3MLQV7XKPWNRTUD"' > "$scratch/planted.txt"
          git -C "$scratch" add planted.txt
          git -C "$scratch" commit -q -m "planted secret"
          set +e
          docker run --rm \
            -v "$scratch:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            zricethezav/gitleaks:v8.30.1 \
            detect --source=/repo --redact -v --no-color \
          2>&1 | tee gitleaks-selftest.txt
          status=${PIPESTATUS[0]}
          set -e
          if [ "$status" -eq 0 ]; then
            echo "::error::gitleaks exited 0 on a repo with a planted secret — the detector's trigger is broken."
            cat gitleaks-selftest.txt
            exit 1
          fi
          echo "Confirmed: gitleaks exits nonzero (status $status) on a planted secret."

      # A checkout git refuses (dubious ownership, a missing .git, a failed
      # clone), or one that's shallow because `fetch-depth: 0` above was ever
      # dropped, still scans a low-but-nonzero commit count and exits 0 — a
      # scan indistinguishable from a real pass over full history unless
      # checked against the runner's own count, not just `> 0`.
      - name: The scan actually inspected commit history
        run: |
          scanned=$(grep -oE '[0-9]+ commits scanned\.' gitleaks-output.txt | grep -oE '^[0-9]+' || true)
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::checkout is shallow — fetch-depth: 0 was dropped, so gitleaks cannot see full history."
            exit 1
          fi
          expected=$(git rev-list --count HEAD)
          if [ -z "$scanned" ] || [ "$scanned" -ne "$expected" ]; then
            echo "::error::gitleaks scanned ${scanned:-no} of $expected commits — the scan did not cover full history."
            cat gitleaks-output.txt
            exit 1
          fi
          echo "Confirmed: $scanned of $expected commits scanned (full history)."

  # Two reasons the suite below can be skipped, both settled here: the commit is
  # prose, or this exact tree already went green on the pull request it came
  # from. Its own job because three jobs need the answer and each would otherwise
  # re-clone the full history to work it out.
  scope:
    name: Does this change need the suite?
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # Which pull request a main commit came from, and whether its head passed.
      pull-requests: read
      actions: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          # The check diffs against the base commit.
          fetch-depth: 0
      # Deliberately an allowlist: anything not recognised as prose runs the
      # full suite, so a new directory fails safe. `.github/workflows/` is NOT
      # prose — a change to this file must exercise this file.
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merging a pull request runs the whole suite a second time on a tree
          # CI has already passed. Skipping needs all four of these to hold —
          # a push, from a pull request, whose head has the identical tree, and
          # whose head has a green run of this workflow. Any of them failing to
          # answer leaves the suite running, which is the direction to fail in.
          if [ "${{ github.event_name }}" = "push" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[0] // empty | "\(.number) \(.head.sha)"' 2>/dev/null || true)
            num=${pr%% *}
            head=${pr##* }
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&status=success"
            if [ -n "$num" ] && [ -n "$head" ] \
              && git fetch --no-tags --depth=1 origin "refs/pull/$num/head:refs/ci/pr" 2>/dev/null \
              && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/ci/pr^{tree}')" ] \
              && [ "$(gh api "$runs" --jq '.total_count' 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "Identical tree to #$num at $head, which this workflow already passed."
              echo "app=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No green pull-request run covers this tree — running everything."
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit — running everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$changed"
          if [ -n "$changed" ] && ! grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$changed"; then
            echo "Documentation only — skipping the app checks."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

  verify:
    name: Typecheck, tests, lint
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest

    # Without a database the integration suites skip themselves (by design, so
    # `npm test` works for a contributor with no Postgres). That is exactly the
    # wrong behaviour in CI: the socket-layer tests are the ones guarding
    # impersonation, hand secrecy, the exchange bypass and the seat-vacancy
    # deadlock, and a silent skip would let any of those regress unnoticed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        # The job must not start testing before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      # Required by server/index.ts's fail-fast env check. Test-only value.
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test | tee test-output.txt

      # A skipped integration suite still exits 0, so without this a removed or
      # broken Postgres service would turn the socket-layer tests into a no-op
      # and CI would stay green. Fail loudly instead.
      - name: Assert the integration suites actually ran
        run: |
          if grep -q "DATABASE_URL not set" test-output.txt; then
            echo "::error::Integration suites skipped — the Postgres service is not reachable."
            echo "These cover socket auth, hand secrecy, the exchange bypass and seat vacancy."
            exit 1
          fi
          echo "Integration suites ran against Postgres."

      # React Native's own renderer, with Platform.OS set to ios and android —
      # the one thing the Playwright suite structurally cannot do. It needs no
      # database and nothing else this job has not already installed, so it
      # rides here rather than starting a second runner to repeat `npm ci`.
      # Runs even when the step above went red: parallel jobs used to show a
      # failure in each on the same run, and folding must not cost a round trip
      # to learn the second one.
      - name: Native tests
        if: ${{ !cancelled() }}
        run: npm run test:native

      - name: Lint
        if: ${{ !cancelled() }}
        run: npm run lint

  browser:
    name: Browser tests
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    # The longest job by a wide margin, and so the run's critical path. It
    # builds its own bundle and its own disposable Postgres
    # (scripts/e2e-server.mjs) rather than reusing another job's, which is what
    # lets it start at the same moment as everything else instead of waiting.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci

      # No `--with-deps`: every package it asks for is already the newest
      # version on this image, and it spends an 11.4 MB apt index fetch to say
      # so. Playwright re-checks the libraries at browser launch anyway, so a
      # runner image that drops one turns the first test red, not silently green.
      - name: Install Playwright's browser
        run: npx playwright install chromium

      # The only layer that exercises react-native-web's side of every
      # Platform.OS branch, and the only one that measures a laid-out box —
      # tap targets, and whether the table renders off the side of the screen.
      # 40 tests in 8.4 minutes on a shared runner, the bundle build it does
      # first included (run 32304169964). 20 minutes is that with room for a
      # slow one rather than a budget anything today comes near.
      - name: Browser tests
        timeout-minutes: 20
        run: npm run test:e2e

      # Uploaded on success too, not just on failure: a green run with no
      # report is a run that skipped the suite, and `if-no-files-found: error`
      # is what turns that into a red step rather than a warning nobody reads.
      # The path is the config file's own directory — `outputFolder` in
      # tests/e2e/playwright.config.ts resolves relative to that, not to the
      # working directory the run was launched from.
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: error
          retention-days: 7

      # The HTML reporter copies every attachment into playwright-report/data/
      # under its own SHA-1, so for a run that reaches the end this duplicates
      # the step above. It is here for the run that does not: the timeout above,
      # or a crash, kills the process before the reporter writes anything, and
      # `outputDir` is then the only place the traces and videos exist. Missing
      # is not an error — a failure in the build or webServer leaves nothing,
      # and the step above is what asserts the suite ran at all.
      - name: Keep the raw Playwright output when the suite goes red
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  build:
    name: Build and boot
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest

    # The boot check reaches a real database, the same way a deploy does.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4
      # This job boots the real artefact against a real database, which is the
      # production path — so it runs production's Node, not the repo's. The
      # other two jobs check dev tooling and 24 is right for them.
      # `esbuild --target=node22` lowers syntax and knows nothing about APIs, so
      # a Node-24-only builtin compiles at exit 0, passes a Node 24 job, and
      # throws on Replit. Running the deploy runtime is what catches that.
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      # 22 above is Replit's, not a preference. If production's runtime moves
      # and this does not, the job stops exercising production — silently, and
      # green.
      - name: This job's Node is the one production runs
        shell: bash
        run: |
          replit=$(grep -oE 'nodejs-[0-9]+' .replit | head -1 | cut -d- -f2)
          actual=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$replit" != "$actual" ]; then
            echo "::error::.replit deploys on Node $replit; this job runs Node $actual."
            exit 1
          fi
          echo "Both on Node $actual."

      - run: npm ci

      - name: Build the web and server bundles
        run: npm run expo:web:build && npm run server:build

      # Reuses the bundle the step above just built — #95 chose a visual
      # direction on this ceiling and nothing enforced it.
      - name: The web bundle is within its size budget
        run: npm run bundle:budget

      - name: Build the static Expo Go deployment
        env:
          EXPO_PUBLIC_DOMAIN: example.invalid
        run: npm run expo:static:build

      # The bundle esbuild produces is otherwise first executed by a Replit
      # deploy. /health answers only once the pool has reached Postgres.
      - name: The built server boots and reaches the database
        shell: bash
        env:
          PORT: "5050"
          NODE_ENV: production
        run: |
          test -f dist/index.html
          test -f server_dist/index.mjs
          node server_dist/index.mjs &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" -o health.json; then break; fi
            sleep 1
          done
          kill "$server_pid" || true
          cat health.json
          grep -q '"db":"connected"' health.json

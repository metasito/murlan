name: CI

# A branch push and its pull request are the same commit. Running on every push
# ran the whole suite twice for every PR; `push` is now limited to main so each
# commit is checked exactly once.
on:
  push:
    branches: [main]
  pull_request:
  # A branch with no open PR yet has no other way to get a real run —
  # `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:
    inputs:
      native:
        description: Also compile for Android and iOS
        type: boolean
        default: false
  # Weekly runs the two device compiles (`android-build`, `ios-build`) and commits the
  # timings; a change to native dependencies and `-f native=true` above run the compiles
  # too. Daily runs the whole suite on main, which a merge skips when its pull request
  # already passed that tree.
  schedule:
    - cron: "17 4 * * 1"
    - cron: "17 2 * * 0,2-6"

permissions:
  contents: read

# Superseding a pull request's own push saves runner time; superseding `main`'s
# run destroys the only evidence that merged code was ever tested — the docs
# commit that follows a merge cancels it and then skips every real step.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node's version is `.node-version`; why tests run on `.ts` directly is docs/agents/checks.md, "Node's TypeScript loader".
  # Single source of truth for the secret-scan image: the scan step and the
  # self-test must run the exact same binary, or a version bump to one and not
  # the other leaves the self-test attesting to a scanner that isn't the one
  # guarding the repo.
  GITLEAKS_IMAGE: "ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f"

jobs:
  # Two reasons the suite below can be skipped, both settled here: the commit is
  # prose, or this exact tree already went green on the pull request it came
  # from. Its own job because three jobs need the answer and each would otherwise
  # re-clone the full history to work it out.
  scope:
    name: Does this change need the suite?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Which pull request a main commit came from, and whether its head passed.
      pull-requests: read
      actions: read
    outputs:
      jobs: ${{ steps.scope.outputs.jobs }}
      native: ${{ steps.scope.outputs.native }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      timings: ${{ steps.plan.outputs.timings }}
      split-problems: ${{ steps.plan.outputs.split-problems }}
      verify-timings: ${{ steps.verify-plan.outputs.verify-timings }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The check diffs against the base commit.
          fetch-depth: 0
      # The decision is `tools/ci/scope.mjs`'s; this step only skips a tree CI already passed and
      # runs everything without a base.
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merging a pull request runs the whole suite a second time on a tree
          # CI has already passed. Skipping needs all four of these to hold —
          # a push, from a pull request, whose head has the identical tree, and
          # whose head has a green run of this workflow. Any of them failing to
          # answer leaves the suite running, which is the direction to fail in.
          if [ "${{ github.event_name }}" = "push" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[0] // empty | "\(.number) \(.head.sha)"' 2>/dev/null || true)
            num=${pr%% *}
            head=${pr##* }
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&status=success"
            if [ -n "$num" ] && [ -n "$head" ] \
              && git fetch --no-tags --depth=1 origin "refs/pull/$num/head:refs/ci/pr" 2>/dev/null \
              && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/ci/pr^{tree}')" ] \
              && [ "$(gh api "$runs" --jq '.total_count' 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "Identical tree to #$num at $head, which this workflow already passed."
              node tools/ci/scope.mjs --none | tee -a "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No green pull-request run covers this tree — running everything."
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit — running everything."
            node tools/ci/scope.mjs | tee -a "$GITHUB_OUTPUT"
            exit 0
          fi
          node tools/ci/scope.mjs "$base" | tee -a "$GITHUB_OUTPUT"

      # Every shard must split the suite from the same numbers, so they are settled once, here.
      # Only a run whose every browser shard passed uploads `e2e-timings` (browser-report), so
      # none of these is a red run's.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
          RUNS: 5
        run: |
          # Newest first, across every branch: a burst of pull requests can push main's runs off one page.
          artifacts='{"artifacts":[]}'
          for page in 1 2 3 4 5; do
            got=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-timings&per_page=100&page=$page" || echo '{"artifacts":[]}')
            artifacts=$(jq -s '{artifacts: (.[0].artifacts + .[1].artifacts)}' <(echo "$artifacts") <(echo "$got"))
            [ "$(jq '.artifacts | length' <<< "$got")" -lt 100 ] && break
            [ "$(jq '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main")] | length' <<< "$artifacts")" -ge "$RUNS" ] && break
          done
          branches=(main)
          [ "$BRANCH" != main ] && branches+=("$BRANCH")
          layers=("" "")
          for i in "${!branches[@]}"; do
            branch=${branches[$i]}
            # Main's price is a median; a branch's is its latest run, so a spec it made heavier costs that on the next run.
            runs=$RUNS; [ "$branch" != main ] && runs=1
            group=()
            ids=$(jq -r --arg b "$branch" --argjson RUNS "$runs" '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == $b
              and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | .[-$RUNS:] | .[].id' <<< "$artifacts")
            for id in $ids; do
              { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$id.zip" \
                && unzip -p "$RUNNER_TEMP/$id.zip" timings.json > "$RUNNER_TEMP/timings-$id.json" \
                || : > "$RUNNER_TEMP/timings-$id.json"; } &
            done
            wait
            for id in $ids; do
              [ -s "$RUNNER_TEMP/timings-$id.json" ] && group+=("$RUNNER_TEMP/timings-$id.json")
            done
            if [ ${#group[@]} -gt 0 ]; then
              layers[$i]=$(IFS=,; echo "${group[*]}")
              echo "Timings for $branch: the median of ${#group[@]} green runs."
            else
              echo "::warning::No green run of $branch has left e2e-timings; its specs keep the older numbers."
            fi
          done
          node tools/ci/e2e-shard.mjs plan "${layers[0]}" "${layers[1]}"

      # verify's split: each file at its median over main's latest runs, one line of artifact ids a run.
      # A file no run measured is placed as a typical one, so a missing layer costs balance, never a file.
      - id: verify-plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUNS: 5
        run: |
          runs=$(for shard in 0 1 2 3; do
              gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=test-results-verify-$shard-1&per_page=100" || echo '{"artifacts":[]}'
            done | jq -rs --argjson RUNS "$RUNS" '[.[].artifacts[] | select((.expired | not) and .workflow_run.head_branch == "main"
              and .workflow_run.head_repository_id == .workflow_run.repository_id)] | group_by(.workflow_run.id)
              | sort_by(.[0].created_at) | .[-$RUNS:] | .[] | map(.id | tostring) | join(" ")')
          layers=()
          while read -r ids; do
            [ -n "$ids" ] || continue
            for id in $ids; do
              mkdir -p "$RUNNER_TEMP/verify-timings/$id"
              { gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/verify-timings/$id.zip" \
                && unzip -q -o "$RUNNER_TEMP/verify-timings/$id.zip" '*.timings.json' -d "$RUNNER_TEMP/verify-timings/$id"; } || true &
            done
            wait
            layers+=("$(for id in $ids; do printf '%s,' "$RUNNER_TEMP"/verify-timings/"$id"/*.timings.json; done)")
          done <<< "$runs"
          node tools/ci/verify-shard.mjs plan "${layers[@]}"

  # Runs unconditionally rather than depending on `scope`: `scope` exempts
  # doc-only changes (docs/, .claude/, *.md), but a secret can land in exactly
  # those paths — #277 found one under `.claude/` — so gating this job on
  # `scope` would let it through unscanned.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Full history checked out
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::checkout is shallow — a full-history scan needs fetch-depth: 0."
            exit 1
          fi

      # The pinned image, not the official gitleaks-action: that action scans
      # only the commits a push adds, and main's push and schedule read main's
      # whole history. A pull request answers for its own commits, never for
      # another branch's. Runs through the shared script (see there) rather than
      # a docker command written out here, so the self-test below exercises the
      # identical invocation.
      - name: gitleaks
        shell: bash
        env:
          SCAN_RANGE: ${{ github.event_name == 'pull_request' && format('{0}..{1}', github.event.pull_request.base.sha, github.event.pull_request.head.sha) || 'HEAD' }}
        run: bash .github/scripts/gitleaks-scan.sh "$PWD" gitleaks-output.txt "$SCAN_RANGE"

      # gitleaks logs "N commits scanned" to stderr, not stdout — the step
      # above must fold both into gitleaks-output.txt or this reads an empty
      # file on every run.
      - name: The scan actually inspected commit history
        run: |
          scanned=$(grep -oE '[0-9]+ commits scanned' gitleaks-output.txt | grep -oE '^[0-9]+' || true)
          if [ -z "$scanned" ] || [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks reported scanning ${scanned:-no} commits — the scan inspected nothing."
            exit 1
          fi

      # A scanner nobody has seen fail is a scanner nobody knows is running.
      # The planted credential is assembled at runtime so no committed line
      # ever matches the rule it exists to prove fires — including in the
      # history of this very step. It carries no key/api/token/secret keyword,
      # so generic-api-key cannot substitute for the rule under test; its
      # charset is restricted to aws-access-token's own `[A-Z2-7]` (no
      # 0/1/8/9), which the regex requires character-for-character, and drawn
      # without repeats so its Shannon entropy always clears the rule's
      # threshold — an unfiltered A-Z0-9 draw fails both, unpredictably.
      - name: Self-test — a planted credential still fires the gate
        shell: bash
        run: |
          scratch=$(mktemp -d)
          git -C "$scratch" init -q
          git -C "$scratch" config user.email "ci@murlan.invalid"
          git -C "$scratch" config user.name "CI"
          cp .gitleaks.toml "$scratch/.gitleaks.toml"
          suffix=$(head -c 8192 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7' | fold -w1 | awk '!seen[$0]++' | head -16 | tr -d '\n')
          printf 'AKIA%s\n' "$suffix" > "$scratch/planted.txt"
          git -C "$scratch" add -A
          git -C "$scratch" commit -q -m "planted"

          # bash runs this script with -e, and the leak-found exit below is
          # the expected outcome, not a script error — `|| status=$?` reads
          # it without that exit code aborting the step before it is checked.
          bash .github/scripts/gitleaks-scan.sh "$scratch" gitleaks-selftest.txt HEAD || status=$?
          status=${status:-0}
          rm -rf "$scratch"

          if [ "$status" -ne 1 ]; then
            echo "::error::planting a credential should make gitleaks exit 1 (leak found); got $status."
            exit 1
          fi
          if ! grep -q "leaks found: 1" gitleaks-selftest.txt; then
            echo "::error::gitleaks exited 1 but did not report the planted finding."
            exit 1
          fi
          if ! grep -qE 'RuleID:[[:space:]]+aws-access-token' gitleaks-selftest.txt; then
            echo "::error::the planted credential fired a different rule than aws-access-token — the self-test no longer proves what it claims."
            exit 1
          fi

  # The three checks that need the Postgres service, and only those: jest and
  # eslint are their own jobs so this one's ~150s of tests stops standing in
  # front of their ~90s. Nothing here is gated on them, and nothing there is
  # gated on this, so one run still reports every failure rather than stopping
  # at the first — which is what the folded job's `if: !cancelled()` bought.
  verify:
    name: Typecheck and tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['verify']
    # Pinned: the restore test installs postgresql-client-16 from the distro, and ubuntu-latest moved to 26.04, which does not package it.
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    strategy:
      # CI gate's verdict needs every shard's results to hold the listing together.
      fail-fast: false
      matrix:
        shard: [1, 2, 3]

    # Without a database the integration suites skip themselves (by design, so
    # `npm test` works for a contributor with no Postgres). That is exactly the
    # wrong behaviour in CI: the socket-layer tests are the ones guarding
    # impersonation, hand secrecy, the exchange bypass and the seat-vacancy
    # deadlock, and a silent skip would let any of those regress unnoticed.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        # The job must not start testing before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: mirror.gcr.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      REDIS_URL: redis://localhost:6379/0
      # Required by server/index.ts's fail-fast env check. Test-only value.
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # protocolVersion and storedShapeVersions compare their fixtures with main's (tests/helpers/appendOnly.ts).
      - name: Fetch main
        run: git fetch --depth=1 origin +refs/heads/main:refs/remotes/origin/main
      - uses: ./.github/actions/install

      # tests/server/backupDb.test.ts restores a real dump — needs the same client
      # tools scripts/backup-db.mjs itself depends on, matched to the service
      # container's major version so the dump a pg_dump writes is one its own
      # psql can read back.
      # The packages the image lacks, kept between runs: `apt-get update` alone once held this step 205 s.
      # A kept set that no longer installs on the image is fetched again.
      - id: pg-debs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pg-debs
          key: postgresql-client-16-debs-${{ runner.os }}-24.04
      - name: Install postgresql-client
        run: |
          debs="$RUNNER_TEMP/pg-debs"
          if ! { ls "$debs"/*.deb > /dev/null 2>&1 && sudo apt-get install -y --no-install-recommends "$debs"/*.deb; }; then
            mkdir -p "$debs/partial"
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends -o Dir::Cache::archives="$debs" postgresql-client-16
            # apt's root-only lock would fail the cache's save.
            sudo rm -rf "$debs/lock" "$debs/partial"
          fi

      # A skipped integration suite still exits 0; CI gate's verdict over these results is what
      # turns a missing Postgres, Redis, postgresql-client-16 or pwsh red (RULES.md 53).
      - name: Test
        env:
          MURLAN_TEST_RESULTS: ${{ runner.temp }}/test-results
          TIMINGS: ${{ needs.scope.outputs.verify-timings }}
        run: |
          printf '%s' "$TIMINGS" > "$RUNNER_TEMP/verify-timings.json"
          node tools/ci/verify-shard.mjs run ${{ matrix.shard }} ${{ strategy.job-total }} "$RUNNER_TEMP/verify-timings.json"
      - name: Keep the runner's own results for CI gate
        if: ${{ !cancelled() }}
        id: up1
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-verify-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test-results-verify-${{ matrix.shard }}-${{ github.run_attempt }} again after a failed attempt
        if: ${{ !cancelled() && steps.up1.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: test-results-verify-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7

  # React Native's own renderer, with Platform.OS set to ios and android — the
  # one thing the Playwright suite structurally cannot do. It rode in `verify`
  # to avoid repeating `npm ci`, back when that job was not the run's longest.
  # It is now: `npm ci` costs ~20s against the ~66s this spends, and paying it
  # twice in parallel is cheaper in wall clock than either waiting for the
  # other.
  native:
    name: Native tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['native']
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      # babel-jest keys a transform by the file and the babel config, never by the presets' and plugins'
      # own code (the React Compiler, worklets), so this key must cover everything that changes that code,
      # and no restore-keys: a cache built under another dependency set would serve its old compiler output.
      # A cold cache spends ~30 s per worker re-transforming the table's module graph.
      - id: jest-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jest-cache
          key: native-jest-${{ matrix.shard }}-${{ hashFiles('package-lock.json', 'patches/**', 'babel.config.js', 'jest.config.js') }}
      - run: npm run test:native -- --shard=${{ matrix.shard }}/${{ strategy.job-total }} --cacheDirectory="$RUNNER_TEMP/jest-cache"
        env:
          MURLAN_TEST_RESULTS: ${{ runner.temp }}/test-results
      - name: Upload test-results-native-${{ matrix.shard }}-${{ github.run_attempt }}
        if: ${{ !cancelled() }}
        id: up2
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-native-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test-results-native-${{ matrix.shard }}-${{ github.run_attempt }} again after a failed attempt
        if: ${{ !cancelled() && steps.up2.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: test-results-native-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      # Read by the loop's land gate (tools/loop/ciVerdict.ts): a step's warning annotations stop at ten.
      - name: Upload over-budget-native-${{ matrix.shard }}
        id: up3
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: over-budget-native-${{ matrix.shard }}
          path: ${{ runner.temp }}/over-budget.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload over-budget-native-${{ matrix.shard }} again after a failed attempt
        if: ${{ !cancelled() && steps.up3.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: over-budget-native-${{ matrix.shard }}
          path: ${{ runner.temp }}/over-budget.json
          if-no-files-found: error
          retention-days: 30
      - if: ${{ !cancelled() && steps.jest-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/jest-cache
          key: ${{ steps.jest-cache.outputs.cache-primary-key }}

  # The ticket loop's own suite. It needs no Postgres, no browser and no native
  # project: it drives `git` and a stubbed `gh` against scratch checkouts, which
  # is why it is 40 seconds rather than the game's several minutes. `git config`
  # because several of its tests commit into a repository they create, and the
  # runner has no identity of its own.
  harness:
    name: Loop harness
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['harness']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      - name: Identify the runner to git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # Typechecked and linted here as well as in the game's jobs, because on a
      # loop-only change those do not run: `scope` sets app=false for a diff
      # confined to tools/loop/, and an untypechecked supervisor is exactly the
      # thing this split would otherwise have made cheaper to break.
      - run: npm run typecheck
      - run: npx eslint tools/loop
      # deleteBranchOnMerge.test.ts reads the repository's settings through gh, and skips without it.
      - run: npm run loop:test
        env:
          GH_TOKEN: ${{ github.token }}
          MURLAN_TEST_RESULTS: ${{ runner.temp }}/test-results
      - name: Upload test-results-harness-0-${{ github.run_attempt }}
        if: ${{ !cancelled() }}
        id: up4
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-harness-0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test-results-harness-0-${{ github.run_attempt }} again after a failed attempt
        if: ${{ !cancelled() && steps.up4.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: test-results-harness-0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7

  # Linux skips the loop tests that only win32 can run, so this is the one place they are heard from.
  harness-windows:
    name: Loop harness on Windows
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['harness-windows']
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Identify the runner to git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
          git --version
      # A test skipped on Linux and here too is heard nowhere, which CI gate's verdict turns red.
      - name: The Win32-only loop tests
        shell: bash
        env:
          MURLAN_TEST_RESULTS: ${{ runner.temp }}/test-results
        run: |
          files=$(grep -lE 'skip: .*(win32|onWindows)' tools/loop/tests/*.test.ts)
          [ -n "$files" ] || { echo "::error::No loop test skips off win32 — the selection pattern is stale."; exit 1; }
          node scripts/nodeTest.mjs --test --test-timeout=120000 --test-force-exit --test-reporter=spec --test-reporter-destination=stdout --test-reporter=./tools/ci/results-node-reporter.mjs --test-reporter-destination=stderr $files
      - name: Upload test-results-harness-windows-0-${{ github.run_attempt }}
        if: ${{ !cancelled() }}
        id: up5
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-harness-windows-0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test-results-harness-windows-0-${{ github.run_attempt }} again after a failed attempt
        if: ${{ !cancelled() && steps.up5.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: test-results-harness-windows-0-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7

  lint:
    name: Lint
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['lint']
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/install
      # Here, not beside the tests: that job is the run's slowest without them.
      - name: Typecheck
        run: npm run typecheck
      # noUncheckedIndexedAccess, scoped to the areas already proven clean.
      - name: Typecheck — noUncheckedIndexedAccess ratchet
        run: npm run typecheck:strict
      - run: npm run lint
      - name: Audit
        run: node tools/ci/audit-gate.mjs ${{ github.event_name == 'pull_request' && format('--base {0}', github.event.pull_request.base.sha) || '' }}

  # Nothing else in this workflow compiles the app for a device. `build` makes
  # the web bundle and the server bundle, neither of which touches Gradle or Xcode, so a plugin or dependency that breaks the
  # native project lands green and is found on someone's phone (#209 was
  # iOS-only). These two jobs answer "does the native project still build",
  # which is not the same as "does it render" — the device loops (#442) own
  # that, and a compile would not have caught #209.
  #
  # `android/` and `ios/` are gitignored: this project is CNG, so both jobs
  # generate the native project from app.json before compiling it.
  #
  # They run weekly, on a change to the app's libraries or native config
  # (`tools/ci/nativeScope.mjs`), and on request (`gh workflow run ci.yml --ref
  # <branch> -f native=true`). They take 9–29 minutes, so the owner kept them off
  # every other pull request and gave them their own budget (docs/agents/RULES.md 46).
  android-build:
    name: Android compiles
    needs: scope
    if: ${{ !cancelled() && (github.event.schedule == '17 4 * * 1' || inputs.native || needs.scope.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      # --no-install: `npm ci` above already installed, and letting prebuild run
      # its own install would resolve outside the lockfile.
      - name: Generate the native project, on the NDK React Native pins
        run: |
          npx expo prebuild --platform android --no-install
          bash tools/ci/pin-ndk.sh
      - name: The audio library's downloads are off
        run: |
          grep -qx "disableAudioapiFFmpeg=true" android/gradle.properties
          grep -qx "disableAudioapiStaticExternalLibs=true" android/gradle.properties
      # After prebuild, not before: android/ is gitignored and generated by it,
      # so cache:gradle has nothing to key on (**/*.gradle*) any earlier.
      # Expo SDK 54 ships AGP 8, which refuses anything below JDK 17.
      - uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          # The runner's tool cache already holds Temurin 17; caching the JDK only adds a save and a restore.
          cache-jdk: false
      - name: Compile a release, JS bundled
        working-directory: android
        run: ./gradlew assembleRelease -PreactNativeArchitectures=x86_64 -x lintVitalRelease --no-daemon
      - name: The release carries both libraries, no FFmpeg, no background service, no cleartext
        run: |
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          [ -n "$apk" ] || { echo "::error::assembleRelease produced no APK."; exit 1; }
          unzip -l "$apk" > "$RUNNER_TEMP/apk.txt"
          unzip -q -o "$apk" "assets/index.android.bundle" -d "$RUNNER_TEMP/apk"
          [ -f "$RUNNER_TEMP/apk/assets/index.android.bundle" ] || { echo "::error::The release APK embeds no JS bundle."; exit 1; }
          node scripts/e2eBuildMark.mjs --absent "$RUNNER_TEMP/apk" --mark diagnostics
          node scripts/e2eBuildMark.mjs --absent "$RUNNER_TEMP/apk"
          grep -q "lib/x86_64/libreact-native-audio-api.so" "$RUNNER_TEMP/apk.txt"
          grep -q "lib/x86_64/libturbo-haptics.so" "$RUNNER_TEMP/apk.txt"
          if grep -q "libav" "$RUNNER_TEMP/apk.txt"; then echo "::error::FFmpeg shipped in the APK."; exit 1; fi
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          "$aapt" dump xmltree --file AndroidManifest.xml "$apk" > "$RUNNER_TEMP/manifest.txt"
          grep -q "android.permission.VIBRATE" "$RUNNER_TEMP/manifest.txt"
          if grep -qE "FOREGROUND_SERVICE|CentralizedForegroundService|usesCleartextTraffic" "$RUNNER_TEMP/manifest.txt"; then
            echo "::error::The merged manifest carries a foreground service or cleartext traffic."; exit 1
          fi
          lib=node_modules/react-native-audio-api
          test -d "$lib/android/src/main"
          test -d "$lib/common/cpp/audioapi/external/include_ffmpeg"
          if find "$lib/android/src/main" "$lib/common/cpp/audioapi/external" \( -name "*.xcframework" -o -name "*.so" -o -name "*.a" \) | grep -q .; then
            echo "::error::A prebuilt binary was downloaded."; exit 1
          fi
          list=$(find android node_modules/expo/android -name ExpoModulesPackageList.kt 2>/dev/null | head -1)
          [ -n "$list" ] || { echo "::error::No ExpoModulesPackageList.kt was generated."; exit 1; }
          grep -q "MurlanDiagnosticsModule" "$list"
          if grep -qE "expo\.modules\.(audio|haptics)\." "$list"; then echo "::error::expo-audio or expo-haptics is still registered."; exit 1; fi

  ios-build:
    name: iOS compiles
    needs: scope
    if: ${{ !cancelled() && (github.event.schedule == '17 4 * * 1' || inputs.native || needs.scope.outputs.native == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 45
    env:
      CCACHE_DIR: /Users/runner/Library/Caches/ccache
      CCACHE_MAXSIZE: 3G
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Install ccache
        env:
          HOMEBREW_NO_AUTO_UPDATE: "1"
          HOMEBREW_NO_INSTALL_CLEANUP: "1"
        run: brew install ccache
      # Keyed per run because a cache is never rewritten once its key exists: a key that named only
      # the dependencies kept the first run's contents for good, an empty cache included.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /Users/runner/Library/Caches/ccache
          key: ${{ runner.os }}-${{ runner.arch }}-ccache-${{ hashFiles('package-lock.json', 'patches/**') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-ccache-${{ hashFiles('package-lock.json', 'patches/**') }}-
            ${{ runner.os }}-${{ runner.arch }}-ccache-
      - name: Each Skia Metal layer follows its own opaque
        run: |
          lib=node_modules/@shopify/react-native-skia/apple
          window=$lib/MetalWindowContext.mm
          [ -f "$window" ] || { echo "::error::$window is missing: the Skia patch's target moved."; exit 1; }
          found=0
          grep -qF "_layer.opaque = false;" "$window" || found=$?
          [ "$found" -ne 0 ] || { echo "::error::The Skia patch did not apply: MetalWindowContext still forces every layer transparent."; exit 1; }
          [ "$found" -eq 1 ] || { echo "::error::Could not read $window (grep exit $found)."; exit 1; }
          grep -qF "_impl->getLayer().opaque = _opaque;" "$lib/SkiaUIView.mm" ||
            { echo "::error::The Skia patch's mount edit is missing: a new layer keeps CAMetalLayer's default."; exit 1; }
          grep -qF "_impl->getLayer().opaque = opaque;" "$lib/SkiaUIView.mm" ||
            { echo "::error::The Skia patch's setOpaque: edit is missing: the prop never reaches the live layer."; exit 1; }
          node --test tests/tooling/skiaOpaquePatch.test.ts
      # --no-install skips CocoaPods as well as npm, so the pods are installed
      # explicitly rather than left out.
      - run: npx expo prebuild --platform ios --no-install
      - name: The audio library's downloads are off
        run: |
          grep -qF "ENV['DISABLE_AUDIOAPI_FFMPEG'] = '1'" ios/Podfile
          grep -qF "ENV['DISABLE_AUDIOAPI_STATIC_EXTERNAL_LIBS'] = '1'" ios/Podfile
      # Keyed on package-lock.json, not Podfile.lock: the latter is only written
      # by `pod install` below, so hashing it here would always see a cache miss
      # (first run) or, worse, a stale hit that never invalidates.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - run: pod install --project-directory=ios
      - name: Both libraries resolved at their pins
        run: |
          grep -qF "RNAudioAPI (0.13.6)" ios/Podfile.lock
          grep -qF "TurboHaptics (1.2.0)" ios/Podfile.lock
      - name: The diagnostics module is registered
        run: |
          provider=$(find ios/Pods -name ExpoModulesProvider.swift | head -1)
          [ -n "$provider" ] || { echo "::error::No ExpoModulesProvider.swift was generated."; exit 1; }
          grep -q "MurlanDiagnosticsModule" "$provider"
          grep -q "MurlanAudioSessionModule" "$provider"
          if grep -qE "ExpoAudio|ExpoHaptics" ios/Podfile.lock "$provider"; then echo "::error::expo-audio or expo-haptics is still linked."; exit 1; fi
      # The workspace and scheme are named from app.json rather than fixed here,
      # so renaming the app does not silently stop compiling anything.
      - name: Compile
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building scheme $scheme"
          # React Native's USE_CCACHE wrappers find ccache through $CCACHE_BINARY, which never reaches
          # Xcode's compile tasks, so they ran plain clang; these name every path outright.
          wrap="$RUNNER_TEMP/ccache-bin"
          mkdir -p "$wrap"
          for tool in clang clang++; do
            printf '#!/bin/sh\nexport CCACHE_DIR=%s CCACHE_MAXSIZE=%s CCACHE_CONFIGPATH=%s\nexec %s %s "$@"\n' \
              "$CCACHE_DIR" "$CCACHE_MAXSIZE" "$PWD/node_modules/react-native/scripts/xcode/ccache.conf" \
              "$(command -v ccache)" "$(xcrun -f "$tool")" > "$wrap/$tool"
            chmod +x "$wrap/$tool"
          done
          ccache --zero-stats
          # `-sdk iphonesimulator` alone resolves to "Any iOS Simulator Device", which builds arm64
          # and x86_64 whatever ONLY_ACTIVE_ARCH says.
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=YES \
            ARCHS=arm64 \
            CC="$wrap/clang" \
            CXX="$wrap/clang++" \
            LD="$wrap/clang" \
            LDPLUSPLUS="$wrap/clang++" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          ccache --show-stats
          ccache --print-stats | grep -qE '^(direct|preprocessed)_cache_(hit|miss)\s+[1-9]' ||
            echo "::warning::ccache saw no compile: the next run starts cold again."
      - name: The release declares no background audio, and nothing was downloaded
        run: |
          app=$(ls -d "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/"*.app | head -1)
          [ -n "$app" ] || { echo "::error::xcodebuild produced no .app."; exit 1; }
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist"
          if /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app/Info.plist" 2>/dev/null | grep -qw audio; then
            echo "::error::UIBackgroundModes carries audio."; exit 1
          fi
          [ "$(/usr/libexec/PlistBuddy -c 'Print :CADisableMinimumFrameDurationOnPhone' "$app/Info.plist")" = true ] ||
            { echo "::error::Info.plist lacks CADisableMinimumFrameDurationOnPhone: iOS caps the app at 60 Hz."; exit 1; }
          [ -f "$app/main.jsbundle" ] || { echo "::error::The Release .app embeds no main.jsbundle."; exit 1; }
          node scripts/e2eBuildMark.mjs --absent "$app" --mark diagnostics
          node scripts/e2eBuildMark.mjs --absent "$app"
          if /usr/libexec/PlistBuddy -c 'Print :NSMicrophoneUsageDescription' "$app/Info.plist" >/dev/null 2>&1; then
            echo "::error::A production build asks for the microphone."; exit 1
          fi
          lib=node_modules/react-native-audio-api
          test -d "$lib/android/src/main"
          test -d "$lib/common/cpp/audioapi/external/include_ffmpeg"
          if find "$lib/android/src/main" "$lib/common/cpp/audioapi/external" \( -name "*.xcframework" -o -name "*.so" -o -name "*.a" \) | grep -q .; then
            echo "::error::A prebuilt binary was downloaded."; exit 1
          fi

  browser:
    name: Browser tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['browser']
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each shard builds its own bundle and its own disposable Postgres
    # (scripts/e2e-server.mjs) rather than reusing another job's, which is what
    # lets them all start at the same moment as everything else instead of
    # waiting. That costs the same 85s of setup on every shard — measured on
    # run 33063120496: 33s for `npm ci` and the browser, 31s for the Expo
    # export, the rest booting. Hoisting the export into a job the shards wait
    # on adds its own ~20s of setup ahead of every shard to save 31s inside
    # shards already running in parallel, so it loses on wall clock.
    strategy:
      # One shard's red must not cancel the others: the report the merge job
      # builds is only whole if every shard uploaded, and a suite that stops at
      # the first failing shard hides what the rest would have found.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: The split the scope job settled
        env:
          TIMINGS: ${{ needs.scope.outputs.timings }}
        run: printf '%s' "$TIMINGS" > tests/e2e/timings.json
      # Keyed on the dependencies alone, so it is written once and never grows: node_modules is
      # most of the bundle's 2078 modules, and metro.config.js keys each entry on its inputs.
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metro-cache
          key: metro-${{ hashFiles('package-lock.json', 'patches/**', 'metro.config.js', 'babel.config.js') }}

      # No `--with-deps`: every package it asks for is already the newest
      # version on this image, and it spends an 11.4 MB apt index fetch to say
      # so. Playwright re-checks the libraries at browser launch anyway, so a
      # runner image that drops one turns the first test red, not silently green.
      #
      # Keyed on the installed version, not package.json's range: the browser
      # build is pinned per Playwright release. The install still runs on a hit
      # and finds nothing to do, so a partial restore cannot go unnoticed.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ steps.pw.outputs.version }}
      # Headless runs launch chromium-headless-shell, never the full browser, which is most of the cache.
      - name: Install Playwright's browser
        run: npx playwright install --only-shell chromium

      # Postgres and Valkey for scripts/e2e-server.mjs, from the cache GitHub holds rather than from
      # the registry mirror once per shard. On a cold key every shard of the run pulls them, as
      # before, and each tries to save the entry; a key already written is kept. `docker save` of a
      # `name:tag@sha256:…` ref keeps no tag, so the images are saved and run under the plain tags
      # dev-stack.mjs's cacheName gives them, and a restore that does not leave them is pulled.
      - name: Docker images the e2e stack runs
        id: stack
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/dev-stack-images.tar
          key: dev-stack-images-${{ hashFiles('scripts/dev-stack.mjs', 'scripts/dockerEngine.mjs') }}
      - name: Load the cached Docker images, or pull them when the load does not leave them
        if: steps.stack.outputs.cache-hit == 'true'
        run: |
          if docker load -i "$RUNNER_TEMP/dev-stack-images.tar" && node scripts/dev-stack.mjs held; then exit 0; fi
          echo "::warning::the cached Docker images did not restore; pulling them"
          node scripts/dev-stack.mjs pull
      - name: Pull the Docker images and keep them
        if: steps.stack.outputs.cache-hit != 'true'
        run: |
          node scripts/dev-stack.mjs pull
          node scripts/dev-stack.mjs held
          node scripts/dev-stack.mjs cached | xargs docker save -o "$RUNNER_TEMP/dev-stack-images.tar"

      # The only layer that exercises react-native-web's side of every
      # Platform.OS branch, and the only one that measures a laid-out box —
      # tap targets, and whether the table renders off the side of the screen.
      #
      # Named spec files rather than `--shard`: Playwright's own splits by test
      # count, and this suite's tests run from under a second to ninety-four
      # (tools/ci/e2e-shard.mjs). 20 minutes was a ceiling for the unsharded
      # suite and is left alone: it is a hang detector, not a budget.
      - name: Browser tests
        timeout-minutes: 20
        run: npm run test:e2e -- $(node tools/ci/e2e-shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }})
        env:
          MURLAN_TEST_RESULTS: ${{ runner.temp }}/test-results
      - name: Upload test-results-browser-${{ matrix.shard }}-${{ github.run_attempt }}
        if: ${{ !cancelled() }}
        id: up6
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      - name: Upload test-results-browser-${{ matrix.shard }}-${{ github.run_attempt }} again after a failed attempt
        if: ${{ !cancelled() && steps.up6.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: test-results-browser-${{ matrix.shard }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/test-results/
          if-no-files-found: error
          retention-days: 7
      # Read by the loop's land gate (tools/loop/ciVerdict.ts): a step's warning annotations stop at ten.
      - name: Upload over-budget-browser-${{ matrix.shard }}
        id: up7
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: over-budget-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/over-budget.json
          if-no-files-found: error
          retention-days: 30
      - name: Upload over-budget-browser-${{ matrix.shard }} again after a failed attempt
        if: ${{ !cancelled() && steps.up7.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: over-budget-browser-${{ matrix.shard }}
          path: ${{ runner.temp }}/over-budget.json
          if-no-files-found: error
          retention-days: 30

      # Uploaded on success too, not just on failure: a green shard with no
      # blob is a shard that skipped the suite, and `if-no-files-found: error`
      # is what turns that into a red step rather than a warning nobody reads.
      # The path is the config file's own directory — the blob reporter writes
      # relative to that, not to the working directory the run was launched
      # from.
      - name: Keep this shard's report
        if: ${{ !cancelled() }}
        id: up8
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/e2e/blob-report/
          if-no-files-found: error
          retention-days: 1
      - name: Upload blob-report-${{ matrix.shard }} again after a failed attempt
        if: ${{ !cancelled() && steps.up8.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: blob-report-${{ matrix.shard }}
          path: tests/e2e/blob-report/
          if-no-files-found: error
          retention-days: 1

      # The HTML reporter copies every attachment into playwright-report/data/
      # under its own SHA-1, so for a run that reaches the end this duplicates
      # the step above. It is here for the run that does not: the timeout above,
      # or a crash, kills the process before the reporter writes anything, and
      # `outputDir` is then the only place the traces and videos exist. Missing
      # is not an error — a failure in the build or webServer leaves nothing,
      # and the step above is what asserts the suite ran at all.
      - name: Keep the raw Playwright output when the suite goes red
        if: failure()
        id: up9
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload playwright-test-results-${{ matrix.shard }} again after a failed attempt
        if: ${{ !cancelled() && steps.up9.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: playwright-test-results-${{ matrix.shard }}
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Each shard produces a partial report; this is what puts the one report
  # the run publishes back together. It carries the floor the browser job used
  # to: a run that reaches the end and publishes no report is a run that tested
  # nothing, and `if-no-files-found: error` is what says so.
  browser-report:
    name: Browser test report
    needs: [scope, browser]
    # Not `success()`: a red shard is exactly when the report is worth reading.
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For the `git push` below. A token is scoped per job, not per step, so this
    # job's pull request runs carry a write token they never reach a use for —
    # the only step that commits is gated on the weekly cron.
    permissions:
      contents: write
      actions: read
    env:
      COMMIT_TIMINGS: ${{ github.event.schedule == '17 4 * * 1' && needs.browser.result == 'success' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      # Short of the weekly commit, this job's scripts import only `node:` modules; the one package
      # they run is Playwright's CLI, pinned to the lockfile's version because a blob report is read
      # by the version that wrote it.
      - name: Playwright's CLI
        run: echo "PW=@playwright/test@$(node -p "require('./package-lock.json').packages['node_modules/@playwright/test'].version")" >> "$GITHUB_ENV"
      - id: pw-cli
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/pw
          key: playwright-cli-${{ env.PW }}
      - if: steps.pw-cli.outputs.cache-hit != 'true'
        run: npm install --no-save --no-audit --no-fund --prefix "$RUNNER_TEMP/pw" "$PW"

      # Not actions/download-artifact: in run 37781391514 it finished all 17 downloads in 11 s, then held the step 175 s more.
      - name: Collect every shard's report
        env:
          GH_TOKEN: ${{ github.token }}
        # Storage answers a burst with `503 Egress is over the account limit` (run 37784854605).
        run: |
          for wait in 5 10 20 0; do
            rm -rf "$RUNNER_TEMP/blobs"
            gh run download "$GITHUB_RUN_ID" --pattern 'blob-report-*' --dir "$RUNNER_TEMP/blobs" && break
            [ "$wait" -gt 0 ] || exit 1
            sleep "$wait"
          done
          mkdir -p all-blob-reports
          mv "$RUNNER_TEMP"/blobs/*/* all-blob-reports/

      # A shard that died before writing its blob leaves a gap that the merged
      # report cannot show, so the count is checked against the matrix rather
      # than inferred from whatever arrived.
      - name: Every shard reported
        run: |
          found=$(find all-blob-reports -name '*.zip' | wc -l)
          if [ "$found" -ne "${{ needs.scope.outputs.shard-count }}" ]; then
            echo "::error::$found of ${{ needs.scope.outputs.shard-count }} shard reports arrived — the merged report is missing every absent shard's specs."
            exit 1
          fi

      # JSON as well as HTML: the per-spec durations `tools/ci/e2e-timings.mjs` needs are otherwise
      # computed by this job and discarded with the runner (#841).
      - name: Merge into one report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: $RUNNER_TEMP/pw/node_modules/.bin/playwright merge-reports --reporter html,json ./all-blob-reports

      # The report is screenshots, videos and trace zips, which deflate barely shrinks.
      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        id: up10
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0
      - name: Upload playwright-report again after a failed attempt
        if: ${{ !cancelled() && steps.up10.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

      # Over the numbers this run split by, so a spec this run could not price keeps the latest
      # measurement rather than the committed one.
      - name: Regenerate tests/e2e/timings.json
        env:
          TIMINGS: ${{ needs.scope.outputs.timings }}
        run: |
          printf '%s' "$TIMINGS" > tests/e2e/timings.json
          node tools/ci/e2e-timings.mjs merged-report.json

      # What the next run on this branch, or on any branch after main, splits by (scope's plan),
      # so balance follows the suite without a commit per merge. A red shard is not a measurement.
      - name: Keep the timings for the next run
        if: ${{ needs.browser.result == 'success' }}
        id: up11
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: e2e-timings
          path: tests/e2e/timings.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload e2e-timings again after a failed attempt
        if: ${{ !cancelled() && steps.up11.outcome == 'failure' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          overwrite: true
          name: e2e-timings
          path: tests/e2e/timings.json
          if-no-files-found: error
          retention-days: 90

      # Judged by scope's plan, which alone holds the layers apart (tools/ci/e2e-shard.mjs splitProblems);
      # failed here rather than there so the suite still runs and reports.
      - name: The split was measured, even and within the target
        if: ${{ !cancelled() }}
        env:
          PROBLEMS: ${{ needs.scope.outputs.split-problems }}
        run: node tools/ci/e2e-shard.mjs check "$PROBLEMS"

      # The commit's gate, e2eShardSplit.test.ts, imports `yaml` and lists the suite with the
      # lockfile's Playwright: the one step here that needs node_modules.
      - name: Dependencies for the timings commit
        if: env.COMMIT_TIMINGS == 'true'
        uses: ./.github/actions/install

      # On the weekly schedule only, never per-merge. `main` has no branch
      # protection blocking a direct push, and a push authored with the default
      # GITHUB_TOKEN does not trigger a new workflow run, so this cannot loop.
      #
      # A red run is not a measurement: `merge-reports` exits 0 for a report
      # full of failures, and a test that fails at its timeout prices its spec
      # at the timeout while one that fails on its first assertion prices it at
      # seconds. Either number is indistinguishable from a real duration once
      # committed, and lands as the lopsided split `tests/tooling/e2eShardSplit.test.ts`
      # reds the next pull request over — which is the defect this job exists
      # to end.
      #
      # Regenerating on every green main push moved `main` under every open
      # pull request, which cost each one a branch update and a full extra run
      # — and moved the tree out from under `scope`'s skip, so the next main
      # push ran the whole suite and regenerated again. Nine such commits on
      # 2026-09-11. A spec merged in between is priced once a green main run
      # has measured it; a merge that skips the browser shards measures nothing,
      # and until main's next one the spec is a guess on every pull request.
      - name: Commit the regenerated timings, if main's copy is stale
        if: env.COMMIT_TIMINGS == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `main` moves while the browser shards run: the concurrency group
          # serializes this workflow's runs, not the merges that queue behind
          # them, so a second merge landing during this run leaves the push
          # non-fast-forward. Re-derive against the new tip rather than rebase
          # — both sides rewrote the whole file.
          for attempt in 1 2 3; do
            node tools/ci/clamp-timings.mjs
            if git diff --quiet -- tests/e2e/timings.json; then
              echo "tests/e2e/timings.json already matches this run's measurements."
              exit 0
            fi
            if ! node --test tests/tooling/e2eShardSplit.test.ts; then
              echo "::error::The measured timings fail tests/tooling/e2eShardSplit.test.ts; committing them would red main and every pull request."
              exit 1
            fi
            git commit -q -m "Regenerate tests/e2e/timings.json from measured durations" -- tests/e2e/timings.json
            if git push; then exit 0; fi
            git fetch --force origin main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            node tools/ci/e2e-timings.mjs merged-report.json
          done
          echo "::error::main moved under each of three attempts to commit the regenerated timings."
          exit 1

  build:
    name: Build and boot
    needs: scope
    if: fromJSON(needs.scope.outputs.jobs)['build']
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The boot check reaches a real database, the same way a deploy does.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      valkey:
        image: mirror.gcr.io/valkey/valkey:9.1.3-alpine@sha256:bf09d58e96d6b4524a15396b65b242bbe18beebbcc15a04d8ee75ddac62fae0b
        ports:
          - 6379:6379
        options: >-
          --health-cmd "valkey-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      REDIS_URL: redis://localhost:6379/0
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # This job boots the real artefact against a real database, so its Node must be
      # production's: `esbuild --target` lowers syntax and knows nothing about APIs.
      # `.node-version` is production's (tests/server/deployRuntime.test.ts).
      - uses: ./.github/actions/install

      - name: Build the web and server bundles
        run: npm run expo:web:build && npm run server:build

      # Reuses the bundle the step above just built — #95 chose a visual
      # direction on this ceiling and nothing enforced it.
      - name: The web bundle is within its size budget
        run: npm run bundle:budget

      # lib/e2eConfig.ts's build mark survives only in a bundle built with a test-only flag.
      - name: The production web bundle carries no test-only flag
        run: node scripts/e2eBuildMark.mjs --absent dist

      - name: The production web bundle carries no diagnostics recorder
        run: node scripts/e2eBuildMark.mjs --absent dist --mark diagnostics

      - name: A diagnostics build carries the recorder
        env:
          EXPO_PUBLIC_DIAGNOSTICS: "1"
        run: npx expo export --platform web --output-dir dist-diag && node scripts/e2eBuildMark.mjs --present dist-diag --mark diagnostics

      # The bundle esbuild produces is otherwise first executed by a production
      # deploy. /health answers only once the server has booted, and its body
      # says whether Postgres answers it.
      - name: The built server boots and reaches the database
        shell: bash
        env:
          PORT: "5050"
          NODE_ENV: production
          PUBLIC_HOST: example.invalid
          METRICS_TOKEN: ci-metrics-token-not-used-in-production
          DATABASE_URL: ${{ env.DATABASE_URL }}?sslmode=disable
        run: |
          test -f dist/index.html
          test -f server_dist/index.mjs
          node server_dist/index.mjs &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" -o health.json && grep -q '"db":"connected"' health.json && grep -q '"redis":"connected"' health.json; then break; fi
            sleep 1
          done
          curl -fsS "http://127.0.0.1:$PORT/health/live" -o live.json || true
          curl -fsS -H "Authorization: Bearer $METRICS_TOKEN" "http://127.0.0.1:$PORT/metrics" -o metrics.txt || true
          kill "$server_pid" || true
          cat health.json live.json
          grep -q '"db":"connected"' health.json
          grep -q '"redis":"connected"' health.json
          grep -q '"status":"ok"' live.json
          grep -q '^pg_connection_headroom ' metrics.txt

  # RULES.md 46's land gate, in CI where no session can argue it away: a pull request that adds or
  # changes a test file over its time budget does not pass `CI gate`.
  timing-budget:
    name: Timing budget
    needs: [native, browser]
    if: ${{ !cancelled() && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            tools/ci
            scripts/lib
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      # Which step fails is the verdict's: this one is infrastructure (exit 2), the next a finding.
      # The name is budget-gate.mjs's UNREAD_STEP (tests/tooling/ciGate.test.ts).
      - name: The run's over-budget lists were read
        id: budget
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          code=0
          node tools/ci/budget-gate.mjs || code=$?
          echo "code=$code" >> "$GITHUB_OUTPUT"
          [ "$code" != 2 ]
      - name: No test file this pull request touches ran over its budget
        env:
          CODE: ${{ steps.budget.outputs.code }}
        run: '[ "$CODE" = 0 ]'

  # The one required check. `always()`: a required check that is skipped reports success, so this
  # runs whatever its needs concluded, and it needs every other job (tests/tooling/ciGate.test.ts).
  ci-gate:
    name: CI gate
    needs: [scope, secrets, verify, native, harness, harness-windows, lint, android-build, ios-build, browser, browser-report, build, timing-budget]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          sparse-checkout: |
            tools/ci
            scripts/lib
            tests/e2e/tiers.mjs
          sparse-checkout-cone-mode: false
      - name: Every job passed or was skipped by scope
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: node tools/ci/gate.mjs
      # The base branch's judge, so a pull request that leaves this workflow alone cannot loosen the
      # verdict on itself; one that edits this step can (docs/agents/suites.md § A flake is fixed,
      # Limits). A base without the judge is red (tests/tooling/testVerdict.test.ts).
      - name: Every test that ran passed, once, and none was skipped unheard
        if: ${{ !cancelled() }}
        env:
          NEEDS: ${{ toJSON(needs) }}
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          case "$EVENT $REF" in
            "pull_request "*) base=HEAD^1 ;;
            "push refs/heads/main") base=HEAD ;;
            *) git fetch --no-tags --depth=1 origin main && base=$(git rev-parse FETCH_HEAD) ;;
          esac
          mkdir -p "$RUNNER_TEMP/judge"
          if ! git cat-file -e "$base:tools/ci/test-verdict.mjs" 2>/dev/null; then
            echo "::error::the base has no tools/ci/test-verdict.mjs, so nothing may judge this run"
            exit 1
          fi
          git archive "$base" tools/ci scripts/lib tests/e2e/tiers.mjs | tar -x -C "$RUNNER_TEMP/judge"
          BASE=$base node "$RUNNER_TEMP/judge/tools/ci/test-verdict.mjs"

name: CI

# A branch push and its pull request are the same commit. Running on every push
# ran the whole suite twice for every PR; `push` is now limited to main so each
# commit is checked exactly once.
on:
  push:
    branches: [main]
  pull_request:
  # A branch with no open PR yet has no other way to get a real run —
  # `gh workflow run ci.yml --ref <branch>`.
  workflow_dispatch:
    inputs:
      native:
        description: Also compile for Android and iOS
        type: boolean
        default: false
  # Runs the two device compiles (`android-build`, `ios-build`) weekly; a change
  # to native dependencies and `-f native=true` above run them too.
  schedule:
    - cron: "17 4 * * 1"

permissions:
  contents: read

# Superseding a pull request's own push saves runner time; superseding `main`'s
# run destroys the only evidence that merged code was ever tested — the docs
# commit that follows a merge cancels it and then skips every real step.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Node 22+ is required: tests run via `node --test` against .ts files directly
  # (docs/agents/checks.md, "Node's TypeScript loader"), stable since Node 22.6,
  # so no ts-node/tsx/vitest is needed. Node 24 is the current LTS-track
  # release and what the project is developed against, so pin to it to keep
  # local and CI runs identical. The `build` job is deliberately not on this —
  # it runs production's Node, for the reason given there.
  NODE_VERSION: "24"
  # Single source of truth for the secret-scan image: the scan step and the
  # self-test must run the exact same binary, or a version bump to one and not
  # the other leaves the self-test attesting to a scanner that isn't the one
  # guarding the repo.
  GITLEAKS_IMAGE: "zricethezav/gitleaks:v8.30.1"

jobs:
  # Two reasons the suite below can be skipped, both settled here: the commit is
  # prose, or this exact tree already went green on the pull request it came
  # from. Its own job because three jobs need the answer and each would otherwise
  # re-clone the full history to work it out.
  scope:
    name: Does this change need the suite?
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      # Which pull request a main commit came from, and whether its head passed.
      pull-requests: read
      actions: read
    outputs:
      app: ${{ steps.scope.outputs.app }}
      harness: ${{ steps.scope.outputs.harness }}
      native: ${{ steps.scope.outputs.native }}
      shards: ${{ steps.plan.outputs.shards }}
      shard-count: ${{ steps.plan.outputs.shard-count }}
      timings: ${{ steps.plan.outputs.timings }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # The check diffs against the base commit.
          fetch-depth: 0
      # Deliberately an allowlist: anything not recognised as prose runs the
      # full suite, so a new directory fails safe. `.github/workflows/` is NOT
      # prose — a change to this file must exercise this file.
      - id: scope
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Merging a pull request runs the whole suite a second time on a tree
          # CI has already passed. Skipping needs all four of these to hold —
          # a push, from a pull request, whose head has the identical tree, and
          # whose head has a green run of this workflow. Any of them failing to
          # answer leaves the suite running, which is the direction to fail in.
          if [ "${{ github.event_name }}" = "push" ]; then
            pr=$(gh api "repos/$GITHUB_REPOSITORY/commits/$GITHUB_SHA/pulls" \
              --jq '.[0] // empty | "\(.number) \(.head.sha)"' 2>/dev/null || true)
            num=${pr%% *}
            head=${pr##* }
            runs="repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$head&status=success"
            if [ -n "$num" ] && [ -n "$head" ] \
              && git fetch --no-tags --depth=1 origin "refs/pull/$num/head:refs/ci/pr" 2>/dev/null \
              && [ "$(git rev-parse 'HEAD^{tree}')" = "$(git rev-parse 'refs/ci/pr^{tree}')" ] \
              && [ "$(gh api "$runs" --jq '.total_count' 2>/dev/null || echo 0)" -gt 0 ]; then
              echo "Identical tree to #$num at $head, which this workflow already passed."
              echo "app=false" >> "$GITHUB_OUTPUT"
              echo "harness=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "No green pull-request run covers this tree — running everything."
          fi
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            echo "No usable base commit — running everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
            echo "harness=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed=$(git diff --name-only "$base" HEAD)
          echo "Changed files:"; echo "$changed"
          echo "native=$(node tools/ci/nativeScope.mjs "$base")" >> "$GITHUB_OUTPUT"
          # Prose the suite asserts *on* is not prose to this filter.
          # `tests/tooling/rulesAreSingleSourced.test.ts` reads RULES.md, CLAUDE.md, the
          # command files and docs/agents/ — so a change to exactly those paths
          # is the one change that must run it, and the allowlist below would
          # skip it. The failure would surface later, on whichever unrelated
          # code change ran the suite next.
          # The loop is a second product in this repository (docs/agents/checks.md). A change confined
          # to `tools/loop/` runs its suite *instead of* the game's, which is the whole point of the
          # split; the two are not exclusive, and a queue.md edit is read by both and runs both.
          # The rest of the list is what its suite asserts on beyond its own code: the protocol
          # files, `.claude/settings.json`'s hook paths, package.json's script names, and this
          # workflow, whose job names `check-steps.mjs` pins each delegated step to. Both lists are
          # derived by `tests/tooling/ciScope.test.ts`, which reds on a path they miss.
          if grep -qE '^(tools/loop/|scripts/lib/(checkoutRoot|entry)\.mjs$|tools/ci/preflightMemory\.mjs$|tests/helpers/importShellGuard\.ts$|docs/agents/|\.claude/|CLAUDE\.md$|package\.json$|\.github/workflows/ci\.yml$)' <<< "$changed"; then
            echo "harness=true" >> "$GITHUB_OUTPUT"
          else
            echo "harness=false" >> "$GITHUB_OUTPUT"
          fi
          if grep -qE '^(docs/agents/|docs/(PRIVACY|GAME-RULES|WEB-PERF|ARCHITECTURE|BRIEF)\.md$|\.claude/commands/|CLAUDE\.md$)' <<< "$changed"; then
            echo "Documentation the suite asserts on — running everything."
            echo "app=true" >> "$GITHUB_OUTPUT"
          elif [ -n "$changed" ] && ! grep -qvE '^(docs/|\.claude/)|\.md$' <<< "$changed"; then
            echo "Documentation only — skipping the app checks."
            echo "app=false" >> "$GITHUB_OUTPUT"
          # Deliberately the loop's *tests* and not the loop: `tools/ci/e2ePort.mjs` imports
          # `tools/loop/reap.mjs` and `scripts/contextSurface.mjs` imports `tools/loop/loop-derive.mjs`,
          # so a change to the loop's source can stop the browser suite booting. A directory can
          # answer "can this reach the game?" only where the answer is no by construction, and a
          # test file is the one place it is: nothing imports one.
          elif [ -n "$changed" ] && ! grep -qvE '^tools/loop/tests/' <<< "$changed"; then
            echo "The loop's own tests only — nothing imports a test, so the game cannot see this."
            echo "app=false" >> "$GITHUB_OUTPUT"
          else
            echo "app=true" >> "$GITHUB_OUTPUT"
          fi

      # Every shard must split the suite from the same numbers, so they are settled once, here.
      # Only a run whose every browser shard passed uploads `e2e-timings` (browser-report), so
      # none of these is a red run's.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
      - id: plan
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.head_ref || github.ref_name }}
        run: |
          artifacts=$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=e2e-timings&per_page=100" || echo '{"artifacts":[]}')
          branches=(main)
          [ "$BRANCH" != main ] && branches+=("$BRANCH")
          for branch in "${branches[@]}"; do
            id=$(jq -r --arg b "$branch" '[.artifacts[] | select((.expired | not) and .workflow_run.head_branch == $b
              and .workflow_run.head_repository_id == .workflow_run.repository_id)] | sort_by(.created_at) | last | .id // empty' <<< "$artifacts")
            if [ -n "$id" ] && gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$id/zip" > "$RUNNER_TEMP/$id.zip" \
              && unzip -p "$RUNNER_TEMP/$id.zip" timings.json > "$RUNNER_TEMP/timings-$id.json"; then
              layers+=("$RUNNER_TEMP/timings-$id.json")
              echo "Timings for $branch: artifact $id."
            else
              echo "::warning::No green run of $branch has left e2e-timings; its specs keep the older numbers."
            fi
          done
          node tools/ci/e2e-shard.mjs plan "${layers[@]}"

  # Runs unconditionally rather than depending on `scope`: `scope` exempts
  # doc-only changes (docs/, .claude/, *.md), but a secret can land in exactly
  # those paths — #277 found one under `.claude/` — so gating this job on
  # `scope` would let it through unscanned.
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0

      - name: Full history checked out
        run: |
          if [ "$(git rev-parse --is-shallow-repository)" = "true" ]; then
            echo "::error::checkout is shallow — a full-history scan needs fetch-depth: 0."
            exit 1
          fi

      # The pinned image, not the official gitleaks-action: that action scans
      # only the commits a push or PR adds, and this needs the whole history
      # every run. Runs through the shared script (see there) rather than a
      # docker command written out here, so the self-test below exercises the
      # identical invocation.
      - name: gitleaks
        shell: bash
        run: bash .github/scripts/gitleaks-scan.sh "$PWD" gitleaks-output.txt

      # gitleaks logs "N commits scanned" to stderr, not stdout — the step
      # above must fold both into gitleaks-output.txt or this reads an empty
      # file on every run.
      - name: The scan actually inspected commit history
        run: |
          scanned=$(grep -oE '[0-9]+ commits scanned' gitleaks-output.txt | grep -oE '^[0-9]+' || true)
          if [ -z "$scanned" ] || [ "$scanned" -eq 0 ]; then
            echo "::error::gitleaks reported scanning ${scanned:-no} commits — the scan inspected nothing."
            exit 1
          fi

      # A scanner nobody has seen fail is a scanner nobody knows is running.
      # The planted credential is assembled at runtime so no committed line
      # ever matches the rule it exists to prove fires — including in the
      # history of this very step. It carries no key/api/token/secret keyword,
      # so generic-api-key cannot substitute for the rule under test; its
      # charset is restricted to aws-access-token's own `[A-Z2-7]` (no
      # 0/1/8/9), which the regex requires character-for-character, and drawn
      # without repeats so its Shannon entropy always clears the rule's
      # threshold — an unfiltered A-Z0-9 draw fails both, unpredictably.
      - name: Self-test — a planted credential still fires the gate
        shell: bash
        run: |
          scratch=$(mktemp -d)
          git -C "$scratch" init -q
          git -C "$scratch" config user.email "ci@murlan.invalid"
          git -C "$scratch" config user.name "CI"
          cp .gitleaks.toml "$scratch/.gitleaks.toml"
          suffix=$(head -c 8192 /dev/urandom | LC_ALL=C tr -dc 'A-Z2-7' | fold -w1 | awk '!seen[$0]++' | head -16 | tr -d '\n')
          printf 'AKIA%s\n' "$suffix" > "$scratch/planted.txt"
          git -C "$scratch" add -A
          git -C "$scratch" commit -q -m "planted"

          # bash runs this script with -e, and the leak-found exit below is
          # the expected outcome, not a script error — `|| status=$?` reads
          # it without that exit code aborting the step before it is checked.
          bash .github/scripts/gitleaks-scan.sh "$scratch" gitleaks-selftest.txt || status=$?
          status=${status:-0}
          rm -rf "$scratch"

          if [ "$status" -ne 1 ]; then
            echo "::error::planting a credential should make gitleaks exit 1 (leak found); got $status."
            exit 1
          fi
          if ! grep -q "leaks found: 1" gitleaks-selftest.txt; then
            echo "::error::gitleaks exited 1 but did not report the planted finding."
            exit 1
          fi
          if ! grep -qE 'RuleID:[[:space:]]+aws-access-token' gitleaks-selftest.txt; then
            echo "::error::the planted credential fired a different rule than aws-access-token — the self-test no longer proves what it claims."
            exit 1
          fi

  # The three checks that need the Postgres service, and only those: jest and
  # eslint are their own jobs so this one's ~150s of tests stops standing in
  # front of their ~90s. Nothing here is gated on them, and nothing there is
  # gated on this, so one run still reports every failure rather than stopping
  # at the first — which is what the folded job's `if: !cancelled()` bought.
  verify:
    name: Typecheck and tests
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20

    # Without a database the integration suites skip themselves (by design, so
    # `npm test` works for a contributor with no Postgres). That is exactly the
    # wrong behaviour in CI: the socket-layer tests are the ones guarding
    # impersonation, hand secrecy, the exchange bypass and the seat-vacancy
    # deadlock, and a silent skip would let any of those regress unnoticed.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        # The job must not start testing before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      # Required by server/index.ts's fail-fast env check. Test-only value.
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      # tests/server/backupDb.test.ts restores a real dump — needs the same client
      # tools scripts/backup-db.mjs itself depends on, matched to the service
      # container's major version so the dump a pg_dump writes is one its own
      # psql can read back.
      - name: Install postgresql-client
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends postgresql-client-16

      - name: Typecheck
        run: npm run typecheck

      # noUncheckedIndexedAccess, scoped to the areas already proven clean —
      # rides this job rather than a new one, which would bill its own
      # runner minute for one more `tsc` invocation.
      - name: Typecheck — noUncheckedIndexedAccess ratchet
        run: npm run typecheck:strict

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          npm test 2>&1 | tee test-output.txt

      # A skipped integration suite still exits 0, so without this a removed or
      # broken Postgres service would turn the socket-layer tests into a no-op
      # and CI would stay green. Fail loudly instead.
      - name: Assert the integration suites actually ran
        run: |
          if grep -q "DATABASE_URL not set" test-output.txt; then
            echo "::error::Integration suites skipped — the Postgres service is not reachable."
            echo "These cover socket auth, hand secrecy, the exchange bypass and seat vacancy."
            exit 1
          fi
          if grep -qE "pg_dump not on PATH|psql not on PATH|client majors must match" test-output.txt; then
            echo "::error::The backup restore test skipped — postgresql-client-16 is missing, or is not the major the service container runs."
            echo "This is the only test proving a dump actually restores; see the 'Install postgresql-client' step above."
            exit 1
          fi
          # A narrowed glob loads no integration file and prints no skip, so the files that ran are counted.
          expected=$(ls tests/integration/*.test.ts | wc -l)
          ran=$(grep -oE "^test files run in tests/integration: [0-9]+" test-output.txt | grep -oE "[0-9]+$" || echo 0)
          if [ "$expected" -lt 40 ]; then
            echo "::error::Only $expected integration files found on disk — the suite moved, and this count no longer sees it."
            exit 1
          fi
          if [ "$ran" -lt "$expected" ]; then
            echo "::error::npm test ran $ran of the $expected files in tests/integration."
            exit 1
          fi
          echo "Integration suites ran against Postgres: $ran files."

  # React Native's own renderer, with Platform.OS set to ios and android — the
  # one thing the Playwright suite structurally cannot do. It rode in `verify`
  # to avoid repeating `npm ci`, back when that job was not the run's longest.
  # It is now: `npm ci` costs ~20s against the ~66s this spends, and paying it
  # twice in parallel is cheaper in wall clock than either waiting for the
  # other.
  native:
    name: Native tests
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run test:native

  # The ticket loop's own suite. It needs no Postgres, no browser and no native
  # project: it drives `git` and a stubbed `gh` against scratch checkouts, which
  # is why it is 40 seconds rather than the game's several minutes. `git config`
  # because several of its tests commit into a repository they create, and the
  # runner has no identity of its own.
  harness:
    name: Loop harness
    needs: scope
    if: needs.scope.outputs.harness == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check:comments diffs each changed file against the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Identify the runner to git
        run: |
          git config --global user.email "ci@example.com"
          git config --global user.name "CI"
      # Typechecked and linted here as well as in the game's jobs, because on a
      # loop-only change those do not run: `scope` sets app=false for a diff
      # confined to tools/loop/, and an untypechecked supervisor is exactly the
      # thing this split would otherwise have made cheaper to break.
      - run: npm run typecheck
      - run: npx eslint tools/loop
      - run: npm run loop:test
      # Rides here as well as on `lint` for the same reason as the two above: the comment budget is
      # a step of a job that a loop-tests-only change does not run.
      - run: npm run check:comments

  lint:
    name: Lint
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # check:comments diffs each changed file against the merge base.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      # Rides this job rather than a new one: it is a second-long file read, and
      # billing a runner minute for it is the whole reason it used to be local —
      # where it ran in whatever tree agent:check happened to be in, and so
      # gated nothing.
      - run: npm run check:comments

  # Nothing else in this workflow compiles the app for a device. `build` makes
  # the web bundle and the server bundle, neither of which touches Gradle or Xcode, so a plugin or dependency that breaks the
  # native project lands green and is found on someone's phone (#209 was
  # iOS-only). These two jobs answer "does the native project still build",
  # which is not the same as "does it render" — the device loops (#442) own
  # that, and a compile would not have caught #209.
  #
  # `android/` and `ios/` are gitignored: this project is CNG, so both jobs
  # generate the native project from app.json before compiling it.
  #
  # They run weekly, on a change to the app's libraries or native config
  # (`tools/ci/nativeScope.mjs`), and on request (`gh workflow run ci.yml --ref
  # <branch> -f native=true`). That is about 15 minutes each, against 5 for the
  # rest, so the owner kept them off every other pull request.
  android-build:
    name: Android compiles
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.native || needs.scope.outputs.native == 'true') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # --no-install: `npm ci` above already installed, and letting prebuild run
      # its own install would resolve outside the lockfile.
      - run: npx expo prebuild --platform android --no-install
      # After prebuild, not before: android/ is gitignored and generated by it,
      # so cache:gradle has nothing to key on (**/*.gradle*) any earlier.
      # Expo SDK 54 ships AGP 8, which refuses anything below JDK 17.
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
      - name: Compile
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

  ios-build:
    name: iOS compiles
    needs: scope
    if: ${{ !cancelled() && (github.event_name == 'schedule' || inputs.native || needs.scope.outputs.native == 'true') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      # --no-install skips CocoaPods as well as npm, so the pods are installed
      # explicitly rather than left out.
      - run: npx expo prebuild --platform ios --no-install
      # Keyed on package-lock.json, not Podfile.lock: the latter is only written
      # by `pod install` below, so hashing it here would always see a cache miss
      # (first run) or, worse, a stale hit that never invalidates.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ios/Pods
          key: ${{ runner.os }}-pods-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-pods-
      - run: pod install --project-directory=ios
      # The workspace and scheme are named from app.json rather than fixed here,
      # so renaming the app does not silently stop compiling anything.
      - name: Compile
        run: |
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building scheme $scheme"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            CODE_SIGNING_ALLOWED=NO \
            build

  browser:
    name: Browser tests ${{ matrix.shard }}/${{ strategy.job-total }}
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Each shard builds its own bundle and its own disposable Postgres
    # (scripts/e2e-server.mjs) rather than reusing another job's, which is what
    # lets them all start at the same moment as everything else instead of
    # waiting. That costs the same 85s of setup on every shard — measured on
    # run 33063120496: 33s for `npm ci` and the browser, 31s for the Expo
    # export, the rest booting. Hoisting the export into a job the shards wait
    # on adds its own ~20s of setup ahead of every shard to save 31s inside
    # shards already running in parallel, so it loses on wall clock.
    strategy:
      # One shard's red must not cancel the others: the report the merge job
      # builds is only whole if every shard uploaded, and a suite that stops at
      # the first failing shard hides what the rest would have found.
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.scope.outputs.shards) }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: The split the scope job settled
        env:
          TIMINGS: ${{ needs.scope.outputs.timings }}
        run: printf '%s' "$TIMINGS" > tests/e2e/timings.json
      # Keyed on the dependencies alone, so it is written once and never grows: node_modules is
      # most of the bundle's 2078 modules, and metro.config.js keys each entry on its inputs.
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: /tmp/metro-cache
          key: metro-${{ hashFiles('package-lock.json', 'patches/**', 'metro.config.js', 'babel.config.js') }}

      # No `--with-deps`: every package it asks for is already the newest
      # version on this image, and it spends an 11.4 MB apt index fetch to say
      # so. Playwright re-checks the libraries at browser launch anyway, so a
      # runner image that drops one turns the first test red, not silently green.
      #
      # Keyed on the installed version, not package.json's range: the browser
      # build is pinned per Playwright release. The install still runs on a hit
      # and finds nothing to do, so a partial restore cannot go unnoticed.
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.pw.outputs.version }}
      - name: Install Playwright's browser
        run: npx playwright install chromium

      # The only layer that exercises react-native-web's side of every
      # Platform.OS branch, and the only one that measures a laid-out box —
      # tap targets, and whether the table renders off the side of the screen.
      #
      # Named spec files rather than `--shard`: Playwright's own splits by test
      # count, and this suite's tests run from under a second to ninety-four
      # (tools/ci/e2e-shard.mjs). 20 minutes was a ceiling for the unsharded
      # suite and is left alone: it is a hang detector, not a budget.
      - name: Browser tests
        timeout-minutes: 20
        run: npm run test:e2e -- $(node tools/ci/e2e-shard.mjs ${{ matrix.shard }} ${{ strategy.job-total }})

      # Uploaded on success too, not just on failure: a green shard with no
      # blob is a shard that skipped the suite, and `if-no-files-found: error`
      # is what turns that into a red step rather than a warning nobody reads.
      # The path is the config file's own directory — the blob reporter writes
      # relative to that, not to the working directory the run was launched
      # from.
      - name: Keep this shard's report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: blob-report-${{ matrix.shard }}
          path: tests/e2e/blob-report/
          if-no-files-found: error
          retention-days: 1

      # The HTML reporter copies every attachment into playwright-report/data/
      # under its own SHA-1, so for a run that reaches the end this duplicates
      # the step above. It is here for the run that does not: the timeout above,
      # or a crash, kills the process before the reporter writes anything, and
      # `outputDir` is then the only place the traces and videos exist. Missing
      # is not an error — a failure in the build or webServer leaves nothing,
      # and the step above is what asserts the suite ran at all.
      - name: Keep the raw Playwright output when the suite goes red
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-test-results-${{ matrix.shard }}
          path: tests/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

  # Each shard produces a partial report; this is what puts the one report
  # the run publishes back together. It carries the floor the browser job used
  # to: a run that reaches the end and publishes no report is a run that tested
  # nothing, and `if-no-files-found: error` is what says so.
  browser-report:
    name: Browser test report
    needs: [scope, browser]
    # Not `success()`: a red shard is exactly when the report is worth reading.
    if: ${{ !cancelled() && needs.browser.result != 'skipped' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # For the `git push` below. A token is scoped per job, not per step, so this
    # job's pull request runs carry a write token they never reach a use for —
    # the only step that commits is gated on `push`.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Collect every shard's report
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: all-blob-reports
          pattern: blob-report-*
          merge-multiple: true

      # A shard that died before writing its blob leaves a gap that the merged
      # report cannot show, so the count is checked against the matrix rather
      # than inferred from whatever arrived.
      - name: Every shard reported
        run: |
          found=$(find all-blob-reports -name '*.zip' | wc -l)
          if [ "$found" -ne "${{ needs.scope.outputs.shard-count }}" ]; then
            echo "::error::$found of ${{ needs.scope.outputs.shard-count }} shard reports arrived — the merged report is missing every absent shard's specs."
            exit 1
          fi

      # JSON as well as HTML: the per-spec durations `tools/ci/e2e-timings.mjs` needs are otherwise
      # computed by this job and discarded with the runner (#841).
      - name: Merge into one report
        env:
          PLAYWRIGHT_JSON_OUTPUT_NAME: merged-report.json
        run: npx playwright merge-reports --reporter html,json ./all-blob-reports

      - name: Keep the Playwright report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: error
          retention-days: 7

      - name: Build the mockup side-by-side page
        if: ${{ !cancelled() }}
        run: node scripts/mockupParityPage.mjs playwright-report mockup-parity

      - name: Keep the mockup side-by-side page
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mockup-parity
          path: mockup-parity/
          if-no-files-found: error
          retention-days: 30

      - name: Name the tests that passed only on a retry
        run: node tools/ci/e2e-flaky.mjs merged-report.json

      # Over the numbers this run split by, so a spec this run could not price keeps the latest
      # measurement rather than the committed one.
      - name: Regenerate tests/e2e/timings.json
        env:
          TIMINGS: ${{ needs.scope.outputs.timings }}
        run: |
          printf '%s' "$TIMINGS" > tests/e2e/timings.json
          node tools/ci/e2e-timings.mjs merged-report.json

      # What the next run on this branch, or on any branch after main, splits by (scope's plan),
      # so balance follows the suite without a commit per merge. A red shard is not a measurement.
      - name: Keep the timings for the next run
        if: ${{ needs.browser.result == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-timings
          path: tests/e2e/timings.json
          if-no-files-found: error
          retention-days: 90

      # On the weekly schedule only, never per-merge. `main` has no branch
      # protection blocking a direct push, and a push authored with the default
      # GITHUB_TOKEN does not trigger a new workflow run, so this cannot loop.
      #
      # A red run is not a measurement: `merge-reports` exits 0 for a report
      # full of failures, and a test that fails at its timeout prices its spec
      # at the timeout while one that fails on its first assertion prices it at
      # seconds. Either number is indistinguishable from a real duration once
      # committed, and lands as the lopsided split `tests/tooling/e2eShardSplit.test.ts`
      # reds the next pull request over — which is the defect this job exists
      # to end.
      #
      # Regenerating on every green main push moved `main` under every open
      # pull request, which cost each one a branch update and a full extra run
      # — and moved the tree out from under `scope`'s skip, so the next main
      # push ran the whole suite and regenerated again. Nine such commits on
      # 2026-09-11. `tests/tooling/e2eShardSplit.test.ts` tolerates 10% unmeasured
      # specs, about five new specs at the current count, so a week is well
      # inside the floor; if it ever trips it says so by name and a
      # `workflow_dispatch` regenerates.
      - name: Commit the regenerated timings, if main's copy is stale
        if: ${{ github.event_name == 'schedule' && needs.browser.result == 'success' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # `main` moves while the browser shards run: the concurrency group
          # serializes this workflow's runs, not the merges that queue behind
          # them, so a second merge landing during this run leaves the push
          # non-fast-forward. Re-derive against the new tip rather than rebase
          # — both sides rewrote the whole file.
          for attempt in 1 2 3; do
            if git diff --quiet -- tests/e2e/timings.json; then
              echo "tests/e2e/timings.json already matches this run's measurements."
              exit 0
            fi
            git commit -q -m "Regenerate tests/e2e/timings.json from measured durations" -- tests/e2e/timings.json
            if git push; then exit 0; fi
            git fetch --force origin main:refs/remotes/origin/main
            git reset --hard refs/remotes/origin/main
            node tools/ci/e2e-timings.mjs merged-report.json
          done
          echo "::error::main moved under each of three attempts to commit the regenerated timings."
          exit 1

  build:
    name: Build and boot
    needs: scope
    if: needs.scope.outputs.app == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The boot check reaches a real database, the same way a deploy does.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      SESSION_SECRET: ci-test-secret-not-used-in-production

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      # This job boots the real artefact against a real database, which is the
      # production path — so it runs production's Node, not the repo's. The
      # other two jobs check dev tooling and 24 is right for them.
      # `esbuild --target=node22` lowers syntax and knows nothing about APIs, so
      # a Node-24-only builtin compiles at exit 0, passes a Node 24 job, and
      # throws in production. Running the deploy runtime is what catches that.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"
          cache: npm

      # 22 above is production's (deploy/runtime.json), not a preference. If
      # production's runtime moves and this does not, the job stops exercising
      # production — silently, and green.
      - name: This job's Node is the one production runs
        shell: bash
        run: |
          manifest=$(node -p 'require("./deploy/runtime.json").node')
          actual=$(node -p 'process.versions.node.split(".")[0]')
          if [ "$manifest" != "$actual" ]; then
            echo "::error::deploy/runtime.json deploys on Node $manifest; this job runs Node $actual."
            exit 1
          fi
          echo "Both on Node $actual."

      - run: npm ci

      - name: Build the web and server bundles
        run: npm run expo:web:build && npm run server:build

      # Reuses the bundle the step above just built — #95 chose a visual
      # direction on this ceiling and nothing enforced it.
      - name: The web bundle is within its size budget
        run: npm run bundle:budget

      # lib/e2eBuildMark.ts survives only in a bundle built with a test-only flag.
      - name: The production web bundle carries no test-only flag
        run: node scripts/e2eBuildMark.mjs --absent dist

      # The bundle esbuild produces is otherwise first executed by a production
      # deploy. /health answers only once the pool has reached Postgres.
      - name: The built server boots and reaches the database
        shell: bash
        env:
          PORT: "5050"
          NODE_ENV: production
          PUBLIC_HOST: example.invalid
          DATABASE_URL: ${{ env.DATABASE_URL }}?sslmode=disable
        run: |
          test -f dist/index.html
          test -f server_dist/index.mjs
          node server_dist/index.mjs &
          server_pid=$!
          for _ in $(seq 1 30); do
            if curl -fsS "http://127.0.0.1:$PORT/health" -o health.json; then break; fi
            sleep 1
          done
          kill "$server_pid" || true
          cat health.json
          grep -q '"db":"connected"' health.json

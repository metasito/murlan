# CodeQL's security and correctness queries over the TypeScript, so the audit's
# tool layer (tools/audit/staticLayer.mjs) has alerts to hand its investigators.
# Off the pull_request path except for edits to this file: rule 46's five-minute
# CI budget has no room for it, and main is what the audit reads.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/codeql.yml]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2

# CodeQL's security and correctness queries over the TypeScript, so the audit's
# tool layer (tools/audit/staticLayer.mjs) has alerts to hand its investigators.
# Off the pull_request path except for edits to this file: rule 46's five-minute
# CI budget has no room for it, and main is what the audit reads.
name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    paths: [.github/workflows/codeql.yml]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: github/codeql-action/init@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          languages: javascript-typescript
          build-mode: none
          queries: security-and-quality
      - uses: github/codeql-action/analyze@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1

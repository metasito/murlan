name: iOS native build cache

# A branch reads its own cache and main's, never a sibling's: saved here, on main, one native build
# serves every branch's `ios.yml` run. Drives no device, so it is not a device run.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-app-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  save:
    name: Save the native iOS build for this fingerprint
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build and save the app, unless the cache has it
        id: native
        uses: ./.github/actions/ios-app
        with:
          lookup-only: "true"

      # What makes the app ios.yml restores trustworthy: its rebundling, into the same stand-in .app,
      # reproduces Xcode's own bundle byte for byte.
      - name: The rebundled JS is the bundle Xcode built
        if: steps.native.outputs.cache-hit != 'true'
        env:
          EXPO_PUBLIC_E2E_FAST: "1"
        run: |
          products="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator"
          mkdir -p "$products/js.app"
          tools/ci/rebundle-ios-app.sh "$products/js.app"
          cmp "$RUNNER_TEMP/xcode.jsbundle" "$products/js.app/main.jsbundle"
          node scripts/e2eBuildMark.mjs --present "$products/js.app"

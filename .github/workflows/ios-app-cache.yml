name: iOS native build cache

# A branch reads its own cache and main's, never a sibling's: saved here, on main, one native build
# serves every branch's `ios.yml` run. Drives no device, so it is not a device run.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ios-app-cache-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  save:
    name: Save the native iOS build for this fingerprint
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: ./.github/actions/install

      - name: Build and save the app, unless the cache has it
        uses: ./.github/actions/ios-app
        with:
          lookup-only: "true"


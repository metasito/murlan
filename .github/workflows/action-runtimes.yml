# The PR suite judges action runtimes offline, from tests/fixtures/actionRuntimes.json. This asks
# GitHub whether that record is still true, off the PR path so a network blip cannot red a PR.
name: Action runtimes

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: The recorded action runtimes match GitHub
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .node-version
          package-manager-cache: false
      - run: node scripts/refresh-action-runtimes.mjs --check

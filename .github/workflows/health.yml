# Disabled in GitHub until Murlan is live: before launch there is no production to probe
# (owner, 2026-09-25). Re-enabling it is #1303.
#
# Production's /health, asked on a schedule. Red when PROD_URL is unset too:
# a probe with nowhere to point is not a passing probe.
name: Production health

on:
  schedule:
    - cron: "41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    name: Probe /health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Probe
        env:
          PROD_URL: ${{ vars.PROD_URL }}
        run: node scripts/probe-health.mjs

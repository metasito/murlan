name: iOS device build (sideload)

# An unsigned Debug .ipa with the dev client, which `npm run ios:device` signs with a free Apple ID
# and installs (#1316). JS comes from Metro, so only a change to the native inputs needs a new build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Every class `tools/ci/nativeScope.mjs` counts as native, pinned by `tests/tooling/nativeScope.test.ts`.
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app.config.*
      - eas.json
      - modules/**
      - plugins/**
      - patches/**
      - assets/images/**
      - .github/workflows/ios-device.yml
      - .github/actions/ios-app/**

concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the unsigned dev-client .ipa
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install

      - name: Build the app, or restore it
        id: native
        uses: ./.github/actions/ios-app
        with:
          sdk: device
          configuration: Debug

      - name: Package the .ipa
        env:
          APP: ${{ steps.native.outputs.app }}
          FINGERPRINT: ${{ steps.native.outputs.fingerprint }}
        run: |
          out="$RUNNER_TEMP/ipa"
          mkdir -p "$out/Payload"
          cp -R "$APP" "$out/Payload/"
          (cd "$out" && zip -qry murlan-dev.ipa Payload && rm -rf Payload)
          echo "$FINGERPRINT" > "$out/fingerprint.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: murlan-ios-dev
          path: ${{ runner.temp }}/ipa/
          if-no-files-found: error
          retention-days: 90

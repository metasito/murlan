name: iOS device build (sideload)

# An unsigned Debug .ipa with the dev client, which `npm run ios:device` signs with a free Apple ID
# and installs (#1316). JS comes from Metro, so only a change to the native inputs needs a new build.
on:
  workflow_dispatch:
  push:
    branches: [main]
    # Every class `tools/ci/nativeScope.mjs` counts as native, pinned by `tests/tooling/nativeScope.test.ts`.
    paths:
      - package.json
      - package-lock.json
      - app.json
      - app.config.*
      - eas.json
      - modules/**
      - plugins/**
      - patches/**
      - assets/images/**
      - .github/workflows/ios-device.yml

concurrency:
  group: ios-device-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the unsigned dev-client .ipa
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: ./.github/actions/install

      - name: Fingerprint the native build
        id: native
        run: |
          hash=$(npx --no-install fingerprint fingerprint:generate --platform ios \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).hash")
          xcode=$(xcodebuild -version | shasum | cut -c1-12)
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "key=ios-device-${{ runner.arch }}-$xcode-${{ hashFiles('.github/workflows/ios-device.yml') }}-$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        id: cached
        with:
          path: ${{ runner.temp }}/ios-device-app
          key: ${{ steps.native.outputs.key }}

      - name: Build the app
        if: steps.cached.outputs.cache-hit != 'true'
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          workspace=""
          for candidate in ios/*.xcworkspace; do
            [ -d "$candidate" ] && { workspace="$candidate"; break; }
          done
          [ -n "$workspace" ] || { echo "::error::expo prebuild produced no ios/*.xcworkspace."; exit 1; }
          scheme=$(basename "$workspace" .xcworkspace)
          # Plain http to the PC's LAN address: Metro on 8081 and the game server on 5000.
          plutil -replace NSAppTransportSecurity.NSAllowsLocalNetworking -bool YES "ios/$scheme/Info.plist"
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Debug \
            -sdk iphoneos \
            -destination generic/platform=iOS \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          app=""
          for candidate in "$RUNNER_TEMP/DerivedData/Build/Products/Debug-iphoneos/"*.app; do
            [ -d "$candidate" ] && { app="$candidate"; break; }
          done
          [ -n "$app" ] || { echo "::error::xcodebuild produced no .app."; exit 1; }
          mkdir -p "$RUNNER_TEMP/ios-device-app"
          cp -R "$app" "$RUNNER_TEMP/ios-device-app/"

      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ios-device-app
          key: ${{ steps.native.outputs.key }}

      - name: Package the .ipa
        run: |
          out="$RUNNER_TEMP/ipa"
          mkdir -p "$out/Payload"
          cp -R "$RUNNER_TEMP"/ios-device-app/*.app "$out/Payload/"
          (cd "$out" && zip -qry murlan-dev.ipa Payload && rm -rf Payload)
          echo "${{ steps.native.outputs.hash }}" > "$out/fingerprint.txt"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: murlan-ios-dev
          path: ${{ runner.temp }}/ipa/
          if-no-files-found: error
          retention-days: 90

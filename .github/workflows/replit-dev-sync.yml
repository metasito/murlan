name: Sync Replit dev preview

on:
  push:
    branches: [main]

concurrency:
  group: replit-dev-sync
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  notify:
    name: Trigger Replit dev workflow
    runs-on: ubuntu-latest
    steps:
      - name: Send signed main push to Replit
        id: send
        env:
          HOOK_URL: ${{ vars.REPLIT_DEV_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.REPLIT_DEV_HOOK_SECRET }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOOK_URL" || { echo "::error::REPLIT_DEV_HOOK_URL is not configured"; exit 1; }
          test -n "$HOOK_SECRET" || { echo "::error::REPLIT_DEV_HOOK_SECRET is not configured"; exit 1; }

          payload=$(jq -nc \
            --arg ref "$REF" \
            --arg after "$SHA" \
            --arg full_name "$REPOSITORY" \
            '{ref: $ref, after: $after, repository: {full_name: $full_name}}')
          digest=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | awk '{print $2}')

          curl --fail-with-body --silent --show-error \
            --request POST "$HOOK_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=$digest" \
            --data-binary "$payload"

      # A push-triggered job nobody reviews is invisible when it turns red —
      # nothing blocks a PR on it and no one has a reason to check the
      # Actions tab. Surface a failure as an open, hard-to-miss GitHub issue
      # instead, and close it automatically the next time a sync succeeds.
      - name: Surface a failing sync as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        shell: bash
        run: |
          set -euo pipefail
          title="Dev preview sync is failing"
          body=$(printf 'The last push to main (%s) could not reach the Replit dev preview.\n\nRun: %s\n\nThe preview is serving stale code until this is fixed. See the workflow logs above for the specific error (commonly a missing REPLIT_DEV_HOOK_URL / REPLIT_DEV_HOOK_SECRET).' "$SHA" "$RUN_URL")
          existing=$(gh issue list --repo "$REPO" --search "in:title \"$title\"" --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Close the failing-sync issue now that it recovered
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="Dev preview sync is failing"
          existing=$(gh issue list --repo "$REPO" --search "in:title \"$title\"" --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Recovered: the push at $SHA reached the dev preview successfully."
            gh issue close "$existing" --repo "$REPO"
          fi

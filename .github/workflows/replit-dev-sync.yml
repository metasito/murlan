name: Sync Replit dev preview

on:
  push:
    branches: [main]
  # Lets a sync be re-run by hand after the preview comes back up, without
  # waiting for a new push to main.
  workflow_dispatch:

concurrency:
  group: replit-dev-sync
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  notify:
    name: Trigger Replit dev workflow
    runs-on: ubuntu-latest
    steps:
      - name: Send signed main push to Replit
        id: send
        env:
          HOOK_URL: ${{ vars.REPLIT_DEV_HOOK_URL }}
          HOOK_SECRET: ${{ secrets.REPLIT_DEV_HOOK_SECRET }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$HOOK_URL" || { echo "::error::REPLIT_DEV_HOOK_URL is not configured"; exit 1; }
          test -n "$HOOK_SECRET" || { echo "::error::REPLIT_DEV_HOOK_SECRET is not configured"; exit 1; }

          payload=$(jq -nc \
            --arg ref "$REF" \
            --arg after "$SHA" \
            --arg full_name "$REPOSITORY" \
            '{ref: $ref, after: $after, repository: {full_name: $full_name}}')
          digest=$(printf '%s' "$payload" | openssl dgst -sha256 -hmac "$HOOK_SECRET" -hex | awk '{print $2}')

          # The preview puts its reason in the response body, and the step that
          # reports a failure runs on another machine and cannot read the
          # preview's log — so the body has to be kept rather than printed on
          # the way out. curl's own diagnostics go to the log only: they name
          # the hook host, which is a repository variable and so unmasked, and
          # this ends up in a public issue.
          #
          # The preview restarts itself moments after a successful sync (that
          # is the whole point), and a push that lands while it is mid-restart
          # finds nothing listening for a second or two — Replit's edge turns
          # that into a 502 "couldn't reach this app" page. That is not the
          # preview rejecting the push, it is the previous sync still taking
          # effect, so it is worth a few retries before it counts as a failure.
          set +e
          reply=$(curl --fail-with-body --silent --show-error \
            --retry 6 --retry-delay 5 --retry-all-errors --max-time 20 \
            --request POST "$HOOK_URL" \
            --header 'Content-Type: application/json' \
            --header 'X-GitHub-Event: push' \
            --header "X-Hub-Signature-256: sha256=$digest" \
            --data-binary "$payload" 2>/tmp/curl.err)
          code=$?
          set -e
          echo "$reply"
          cat /tmp/curl.err >&2 || true
          # A delimiter the server could also emit would end the value early
          # and let the rest be read as further outputs (CVE-2022-35954).
          delim="EOF_$(openssl rand -hex 16)"
          {
            echo "reply<<$delim"
            echo "$reply"
            echo "$delim"
          } >> "$GITHUB_OUTPUT"
          exit $code

      # A push-triggered job nobody reviews is invisible when it turns red —
      # nothing blocks a PR on it and no one has a reason to check the
      # Actions tab. Surface a failure as an open, hard-to-miss GitHub issue
      # instead, and close it automatically the next time a sync succeeds.
      - name: Surface a failing sync as an issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          REPLY: ${{ steps.send.outputs.reply }}
        shell: bash
        run: |
          set -euo pipefail
          # A dev preview has no wake-on-request: with the workspace closed it
          # is stopped, and Replit's edge answers this placeholder page. The
          # push after it is started again syncs anyway, so there is nothing
          # for an issue to ask anyone to do.
          case "${REPLY:-}" in
            *'Run this app to see the results here.'*)
              echo "::notice::The Replit preview is not running; there is nothing to sync."
              exit 0
              ;;
          esac
          title="Dev preview sync is failing"
          # No reply means the request never got as far as the preview — the
          # configuration guards above exit before curl runs. Saying what the
          # preview said would be worse than useless there.
          if [ -n "${REPLY:-}" ]; then
            said=$(printf 'What the preview said:\n\n```\n%s\n```\n' "$REPLY")
          else
            said='The request never reached the preview, so there is nothing it said. Check the run log — a missing REPLIT_DEV_HOOK_URL or REPLIT_DEV_HOOK_SECRET stops this before the request is made, and a transport failure is reported there too.'
          fi
          body=$(printf 'The last push to main (%s) could not reach the Replit dev preview.\n\n%s\nRun: %s\n\nThe preview is serving stale code until this is fixed.' "$SHA" "$said" "$RUN_URL")
          existing=$(gh issue list --repo "$REPO" --search "in:title \"$title\"" --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "$body"
          else
            gh issue create --repo "$REPO" --title "$title" --body "$body"
          fi

      - name: Close the failing-sync issue now that it recovered
        if: success()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          title="Dev preview sync is failing"
          existing=$(gh issue list --repo "$REPO" --search "in:title \"$title\"" --state open --json number --jq '.[0].number' || true)
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --repo "$REPO" --body "Recovered: the push at $SHA reached the dev preview successfully."
            gh issue close "$existing" --repo "$REPO"
          fi

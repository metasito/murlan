# RULES.md 52 and 53. pull_request_target runs main's copy of this file and of the scripts, so a pull
# request cannot loosen what judges it. Nothing from the head is checked out, installed or run: it is
# fetched as git objects and only read (tests/tooling/targetFreeze.test.ts holds this shape).
name: Target freeze

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, edited]

permissions:
  contents: read
  issues: read

concurrency:
  group: target-freeze-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  freeze:
    name: Target freeze
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          package-manager-cache: false
          node-version-file: .node-version
      - name: Target freeze
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          git fetch --no-tags origin "+$HEAD_SHA:refs/freeze/head"
          [ "$(git rev-parse refs/freeze/head)" = "$HEAD_SHA" ] || { echo "::error::the fetched head is not $HEAD_SHA."; exit 1; }
          node tools/ci/target-freeze.mjs HEAD refs/freeze/head
      - name: Every flake ticket is open and labelled, and the quarantine list did not grow
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: node tools/ci/flake-tickets.mjs HEAD refs/freeze/head

name: iOS UI (Maestro)

# A ticket whose work needs a device run dispatches it on its own branch (`tools/loop/guard-bash.mjs`);
# twice a week main runs it, so branches restore main's native-build cache, which GitHub evicts
# after 7 days unread. Never on `push` or `pull_request` (owner, 2026-09-24).
#
# `macos-latest` is free on this repo's standard runners (the repo went
# public in #277), ships Xcode and iOS simulators preinstalled, and an iOS
# Simulator is a process on the host rather than a virtualised device — no
# KVM step, no emulator boot poll, none of #186's "Timeout waiting for
# emulator to boot". That is the whole reason this job exists alongside
# `maestro.yml` instead of just fixing the Android one.
on:
  workflow_dispatch:
    inputs:
      force-upload-debug:
        description: "Upload maestro-debug-ios even on a passing run, for #823's per-step command windows (no logcat, so analyze-maestro-run.mjs can't read it)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1,4"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  ios:
    name: Drive the app on a real iOS simulator
    runs-on: macos-latest
    # Generous on purpose, and the same as maestro.yml's: this job compiles the
    # app before it drives it, and then runs smoke.yaml, offline-game.yaml,
    # exchange-phase.yaml and rematch-prompt.yaml — offline-game alone is a
    # full hand, 16 minutes on a developer machine. A measured run of just
    # smoke + offline-game is 23; exchange-phase and rematch-prompt add
    # another ~8.5 (run 33899179508: 3m36s + 4m55s). Hitting the cap
    # cancels the job, and a cancelled job skips every `if: failure()` step
    # below, so an overrun costs the artefacts that would say what happened.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      # `macos-latest` ships a fixed set of pre-created simulators rather
      # than a fresh AVD per run, so the device to drive has to be found
      # rather than declared. Which one, and why, is in
      # `tools/ci/pick-simulator.mjs`, where it can be run and tested.
      #
      # Booted first and waited on only before the install: a first boot on a fresh runner
      # spends 1.5-8 minutes in data migration, and the Maestro driver launched into a device
      # still settling from it is what timed out.
      - name: Find and boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node tools/ci/pick-simulator.mjs)
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Every other device down, so exactly one simulator is booted while
          # the flows run. Maestro resolves an iOS target through the simulator
          # runtime rather than by UDID alone, and run 33418358705's log has
          # `xcodebuild: WARNING: Using the first of multiple matching
          # destinations` listing this one UDID twice, once as arm64 and once
          # as x86_64, followed by ~300 refused connections to the driver's
          # port. Maestro's own docs name ambiguous simulator targeting as a
          # cause of exactly that. `--device` below says which device; this
          # says there is nothing else running to be ambiguous with.
          xcrun simctl shutdown all 2>/dev/null || true
          # `shutdown` returns while a device can still be "Shutting Down", and `boot` in that
          # state fails outright rather than queueing.
          for _ in $(seq 1 30); do
            xcrun simctl list devices | grep -q "(Booted)\|(Shutting Down)" || break
            sleep 2
          done
          xcrun simctl boot "$udid"

      - name: Install dependencies
        run: npm ci

      # The dist-tag named for the installed SDK is the fingerprint version that reads that SDK's config.
      - name: Fingerprint the native build
        id: native
        run: |
          sdk=$(node -p "require('expo/package.json').version.split('.')[0]")
          hash=$(npx --yes "@expo/fingerprint@sdk-$sdk" fingerprint:generate --platform ios \
            | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8')).hash")
          xcode=$(xcodebuild -version | shasum | cut -c1-12)
          echo "key=ios-app-${{ runner.arch }}-$xcode-${{ hashFiles('.github/workflows/ios.yml') }}-$hash" >> "$GITHUB_OUTPUT"

      - uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        id: cached
        with:
          path: ${{ runner.temp }}/ios-app
          key: ${{ steps.native.outputs.key }}

      # Why a build of this app and no host client: the header of
      # tests/tooling/realAppNotExpoGo.test.ts (#627).
      #
      # Release, not Debug: it bundles the JS into the app, so there is no
      # Metro to start, no packager URL to reach, no deep link and no
      # dev menu to be on top in the first place.
      - name: Build the app
        if: steps.cached.outputs.cache-hit != 'true'
        env:
          # Read at module scope by every screen that names it (`app/game.tsx`,
          # `app/(online)/game.tsx`, `context/GameContext.tsx`), so it zeroes
          # every AI/result delay any of them has (`AI_DELAY`,
          # `AI_EXCHANGE_DELAY`, `RESULT_DELAY`, `GAME_OVER_DELAY`) across all
          # four flows this job drives, not only exchange-phase.yaml's. What
          # that ticket needed from it is the offline exchange overlay holding
          # open past the ~8.2s a real device's single tap-and-wait command
          # takes to return (#915), instead of its real ~5.2s — but every flow
          # here now runs at this pace. Never read outside a build this
          # harness itself produced (`scripts/assertNotE2EFast.js`).
          EXPO_PUBLIC_E2E_FAST: "1"
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          # Named from app.json rather than fixed here, so renaming the app
          # does not silently start driving a stale build.
          #
          # Matched by the shell rather than by `ls`: this step runs under
          # `bash -eo pipefail`, where a failed `ls` in a bare assignment kills
          # the step on the spot and the message below never prints — the
          # cause is then a raw "No such file or directory" instead of the one
          # sentence saying what was expected.
          workspace=""
          for candidate in ios/*.xcworkspace; do
            [ -d "$candidate" ] && { workspace="$candidate"; break; }
          done
          [ -n "$workspace" ] || { echo "::error::expo prebuild produced no ios/*.xcworkspace."; exit 1; }
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building scheme $scheme"
          # One slice, for the machine this actually runs on. Release defaults
          # ONLY_ACTIVE_ARCH to NO and so compiles every valid architecture:
          # on an Apple-silicon runner half the build is an x86_64 slice
          # nothing here can execute, and this step is 45% of the job. Asking
          # for the active architecture says that in the setting that controls
          # it, and stays right on a runner of either kind — where naming an
          # architecture would hand the other one a binary its simulator
          # cannot load. Measured: 794s to 533s.
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          app=""
          for candidate in "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/"*.app; do
            [ -d "$candidate" ] && { app="$candidate"; break; }
          done
          [ -n "$app" ] || { echo "::error::xcodebuild produced no .app."; exit 1; }
          cp "$app/main.jsbundle" "$RUNNER_TEMP/xcode.jsbundle"
          mkdir -p "$RUNNER_TEMP/ios-app"
          cp -R "$app" "$RUNNER_TEMP/ios-app/"

      - uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        if: steps.cached.outputs.cache-hit != 'true'
        with:
          path: ${{ runner.temp }}/ios-app
          key: ${{ steps.native.outputs.key }}

      - name: Bundle the JS into the app
        env:
          EXPO_PUBLIC_E2E_FAST: "1"
        run: |
          cached=""
          for candidate in "$RUNNER_TEMP"/ios-app/*.app; do
            [ -d "$candidate" ] && { cached="$candidate"; break; }
          done
          [ -n "$cached" ] || { echo "::error::No .app was built or restored."; exit 1; }
          # Where Xcode built it: hermesc writes its input's path into the bytecode.
          products="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator"
          app="$products/$(basename "$cached")"
          mkdir -p "$products"
          rm -rf "$app"
          cp -R "$cached" "$app"
          tools/ci/rebundle-ios-app.sh "$app"
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"
          # The id the flows are driven with comes from the built app itself,
          # not from app.json: a prebuild that renamed the bundle would
          # otherwise leave Maestro asking the simulator for an app that is
          # not there, which reads as "the app never launched".
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          echo "Built $app ($id)"

      # What makes a restored app trustworthy: rebundling reproduces Xcode's own bundle byte for byte.
      - name: The rebundled JS is the bundle Xcode built
        if: steps.cached.outputs.cache-hit != 'true'
        run: cmp "$RUNNER_TEMP/xcode.jsbundle" "$APP_BUNDLE/main.jsbundle"

      - name: The bundle carries the test-only flag
        run: node scripts/e2eBuildMark.mjs --present "$APP_BUNDLE"

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Install the app on the simulator
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"

      - name: Install Maestro
        run: |
          # This is the tool that decides what "the app rendered" means, and
          # unpinned it was the only thing in either job that could change
          # between two runs of the same commit. Raise it deliberately, and
          # read the changelog when you do (#701).
          export MAESTRO_VERSION=2.10.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # Checked rather than echoed. A tag that does not resolve leaves the
          # installer's own `exit` returning the status of the echo before it,
          # which is 0 with nothing installed - so the pin has to be read back
          # off the binary that arrived.
          "$HOME/.maestro/bin/maestro" --version 2>&1 | tee /dev/stderr | grep -q "$MAESTRO_VERSION"

      # Both flows, named rather than globbed: the order is the thing being
      # relied on. `clearState` makes each start from the same place, so either
      # order has to work — but a directory glob would also pick up a flow added
      # later and run it here without anyone deciding to.
      #
      # `MAESTRO_APP_ID` names the app the flows drive; they have no default.
      - name: Run the flows
        env:
          # Maestro installs its own XCUITest runner onto the simulator before
          # the first step. On a shared macOS runner that install fails outright
          # about a third of the time — measured: three of eight dispatches on
          # 2026-08-31, one of them burning the full five minutes below, which
          # is what says it was never coming up rather than coming up late.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        # Named rather than left to Maestro to resolve: run 33428373840 was the
        # first with `--device` and the first with no "iOS driver not ready in time".
        run: |
          maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" \
            .maestro/smoke.yaml .maestro/offline-game.yaml .maestro/exchange-phase.yaml \
            .maestro/rematch-prompt.yaml

      # `inputs.force-upload-debug`, never `github.event.inputs.`: the latter reads a
      # boolean as the string "false", which is truthy, and uploads on every run.
      - name: Upload Maestro debug output
        if: failure() || inputs.force-upload-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug-ios
          path: ~/.maestro/tests/
          if-no-files-found: ignore

name: iOS UI (Maestro)

# A ticket whose work needs a device run dispatches it on its own branch (`tools/loop/guard-bash.mjs`);
# branches restore the native build `ios-app-cache.yml` saves on main, and twice a week main runs
# this, which reads that cache before GitHub evicts it at 7 days unread. Never on `push` or
# `pull_request` (owner, 2026-09-24).
#
# `macos-latest` is free on this repo's standard runners (the repo went
# public in #277), ships Xcode and iOS simulators preinstalled, and an iOS
# Simulator is a process on the host rather than a virtualised device — no
# KVM step, no emulator boot poll, none of #186's "Timeout waiting for
# emulator to boot". That is the whole reason this job exists alongside
# `maestro.yml` instead of just fixing the Android one.
on:
  workflow_dispatch:
    inputs:
      force-upload-debug:
        description: "Upload maestro-debug-ios even on a passing run, for #823's per-step command windows (no logcat, so analyze-maestro-run.mjs can't read it)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1,4"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read
  issues: write

jobs:
  flows:
    name: Drive the app on a real iOS simulator (${{ matrix.shard }})
    runs-on: macos-latest
    # A cancelled job skips every `if: failure()` step below, so an overrun costs the artefacts
    # that would say what happened.
    timeout-minutes: 45
    strategy:
      # Each shard's flows are diagnosed from its own artefacts; one red shard must not cancel the rest.
      fail-fast: false
      # Balanced by run 36765362324's minutes per flow; each shard also pays ~2 of driver startup
      # per maestro invocation. Every flow is in one shard (`tests/tooling/iosShards.test.ts`).
      matrix:
        include:
          - shard: rematch-prompt # 7.0
            flows: .maestro/rematch-prompt.yaml
          - shard: offline-game # 6.5
            flows: .maestro/offline-game.yaml
          - shard: exchange-phase # 5.3
            flows: .maestro/exchange-phase.yaml
          - shard: smoke-and-felt # 2.4, then felt-opaque 1.7 in its own invocation
            flows: .maestro/smoke.yaml
            felt: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # `macos-latest` ships a fixed set of pre-created simulators rather
      # than a fresh AVD per run, so the device to drive has to be found
      # rather than declared. Which one, and why, is in
      # `tools/ci/pick-simulator.mjs`, where it can be run and tested.
      #
      # Booted first and waited on only before the install: a first boot on a fresh runner
      # spends 1.5-8 minutes in data migration, and the Maestro driver launched into a device
      # still settling from it is what timed out.
      - name: Find and boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node tools/ci/pick-simulator.mjs)
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Every other device down, so exactly one simulator is booted while
          # the flows run. Maestro resolves an iOS target through the simulator
          # runtime rather than by UDID alone, and run 33418358705's log has
          # `xcodebuild: WARNING: Using the first of multiple matching
          # destinations` listing this one UDID twice, once as arm64 and once
          # as x86_64, followed by ~300 refused connections to the driver's
          # port. Maestro's own docs name ambiguous simulator targeting as a
          # cause of exactly that. `--device` below says which device; this
          # says there is nothing else running to be ambiguous with.
          xcrun simctl shutdown all 2>/dev/null || true
          # `shutdown` returns while a device can still be "Shutting Down", and `boot` in that
          # state fails outright rather than queueing.
          for _ in $(seq 1 30); do
            xcrun simctl list devices | grep -q "(Booted)\|(Shutting Down)" || break
            sleep 2
          done
          xcrun simctl boot "$udid"

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: 24

      # Started in the background, so it runs beside the fingerprint and restore below. The .app it
      # writes into is a stand-in: hermesc embeds only its input's directory, which stays Xcode's.
      - name: Start bundling the JS
        env:
          EXPO_PUBLIC_E2E_FAST: "1"
        run: |
          products="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator"
          echo "JS_BUNDLE=$products/js.app" >> "$GITHUB_ENV"
          mkdir -p "$products/js.app"
          nohup bash -c 'tools/ci/rebundle-ios-app.sh "$1" > "$RUNNER_TEMP/bundle.log" 2>&1; echo $? > "$RUNNER_TEMP/bundle.status"' \
            _ "$products/js.app" > /dev/null 2>&1 &

      - name: Restore the app
        id: native
        uses: ./.github/actions/ios-app

      - name: Bundle the JS into the app
        run: |
          for _ in $(seq 1 300); do
            [ -s "$RUNNER_TEMP/bundle.status" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/bundle.log"
          [ "$(cat "$RUNNER_TEMP/bundle.status" 2>/dev/null)" = 0 ] || { echo "::error::Bundling the JS failed or never finished."; exit 1; }
          cached=""
          for candidate in "$RUNNER_TEMP"/ios-app/*.app; do
            [ -d "$candidate" ] && { cached="$candidate"; break; }
          done
          [ -n "$cached" ] || { echo "::error::No .app was restored."; exit 1; }
          app="$(dirname "$JS_BUNDLE")/$(basename "$cached")"
          rm -rf "$app"
          cp -R "$cached" "$app"
          cp -R "$JS_BUNDLE/." "$app/"
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"
          # The id the flows are driven with comes from the built app itself,
          # not from app.json: a prebuild that renamed the bundle would
          # otherwise leave Maestro asking the simulator for an app that is
          # not there, which reads as "the app never launched".
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          echo "Built $app ($id)"

      # What makes a restored app trustworthy: rebundling reproduces Xcode's own bundle byte for byte.
      - name: The rebundled JS is the bundle Xcode built
        if: steps.native.outputs.cache-hit != 'true'
        run: cmp "$RUNNER_TEMP/xcode.jsbundle" "$APP_BUNDLE/main.jsbundle"

      - name: The bundle carries the test-only flag
        run: node scripts/e2eBuildMark.mjs --present "$APP_BUNDLE"

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Install the app on the simulator
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"

      - name: Install Maestro
        run: |
          # This is the tool that decides what "the app rendered" means, and
          # unpinned it was the only thing in either job that could change
          # between two runs of the same commit. Raise it deliberately, and
          # read the changelog when you do (#701).
          export MAESTRO_VERSION=2.10.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # Checked rather than echoed. A tag that does not resolve leaves the
          # installer's own `exit` returning the status of the echo before it,
          # which is 0 with nothing installed - so the pin has to be read back
          # off the binary that arrived.
          "$HOME/.maestro/bin/maestro" --version 2>&1 | tee /dev/stderr | grep -q "$MAESTRO_VERSION"

      # `MAESTRO_APP_ID` names the app the flows drive; they have no default.
      - name: Run the flows
        env:
          # Maestro installs its own XCUITest runner onto the simulator before
          # the first step. On a shared macOS runner that install fails outright
          # about a third of the time — measured: three of eight dispatches on
          # 2026-08-31, one of them burning the full five minutes below, which
          # is what says it was never coming up rather than coming up late.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          FLOWS: ${{ matrix.flows }}
        # Named rather than left to Maestro to resolve: run 33428373840 was the
        # first with `--device` and the first with no "iOS driver not ready in time".
        run: maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" $FLOWS

      # takeScreenshot writes to ~/.maestro/tests/<run>/felt-opaque/takeScreenshot/.
      - name: Photograph the felt
        if: ${{ !cancelled() && matrix.felt }}
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" .maestro/felt-opaque.yaml

      - name: The felt shows no black band and no black frame
        if: ${{ !cancelled() && matrix.felt }}
        run: |
          mkdir -p "$RUNNER_TEMP/felt"
          for shot in felt-first felt-settled; do
            found=$(find "$HOME/.maestro/tests" -path "*/felt-opaque/*" -name "$shot.png" 2>/dev/null | sort | tail -1)
            [ -n "$found" ] || { echo "::error::The felt flow wrote no $shot.png."; exit 1; }
            cp "$found" "$RUNNER_TEMP/felt/$shot.png"
          done
          node tools/ci/feltPixels.mjs "$RUNNER_TEMP/felt/felt-first.png" "$RUNNER_TEMP/felt/felt-settled.png"

      - name: Upload the felt screenshots
        if: ${{ !cancelled() && matrix.felt }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: felt-ios
          path: ${{ runner.temp }}/felt/
          if-no-files-found: ignore

      # A simulator app's crash report lands in the host's own DiagnosticReports. Not gated on
      # failure: an app that died mid-flow can still pass the flows (see maestro.yml's crash step).
      - name: Fail if the app died of a native crash
        if: always()
        run: |
          [ -n "$APP_ID" ] || exit 0
          node tools/ci/find-native-crash.mjs ios "$APP_ID" --copy-to "$RUNNER_TEMP/crash-reports" \
            "$HOME/Library/Logs/DiagnosticReports"

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-reports-ios-${{ matrix.shard }}
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore

      # `inputs.force-upload-debug`, never `github.event.inputs.`: the latter reads a
      # boolean as the string "false", which is truthy, and uploads on every run.
      - name: Upload Maestro debug output
        if: failure() || inputs.force-upload-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug-ios-${{ matrix.shard }}
          path: ~/.maestro/tests/
          if-no-files-found: ignore

  ios:
    name: Drive the app on a real iOS simulator
    needs: flows
    # `always()`, so a skipped or cancelled shard reaches the check below and turns it red.
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every shard ran and passed
        env:
          SHARDS: ${{ needs.flows.result }}
        run: |
          echo "The shards' result: $SHARDS"
          [ "$SHARDS" = success ]

      # `cancelled()` is the timeout: it skips every `failure()` step.
      - name: Report a red scheduled run to the tracker
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/ci/report-device-run.sh ios.yml

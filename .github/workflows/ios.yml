name: iOS UI (Maestro)

# A ticket whose work needs a device run dispatches it on its own branch (`tools/loop/guard-bash.mjs`);
# branches restore the native build `ios-app-cache.yml` saves on main, and twice a week main runs
# this, which reads that cache before GitHub evicts it at 7 days unread. Never on `push` or
# `pull_request` (owner, 2026-09-24).
#
# `macos-latest` is free on this repo's standard runners (the repo went
# public in #277), ships Xcode and iOS simulators preinstalled, and an iOS
# Simulator is a process on the host rather than a virtualised device — no
# KVM step, no emulator boot poll, none of #186's "Timeout waiting for
# emulator to boot". That is the whole reason this job exists alongside
# `maestro.yml` instead of just fixing the Android one.
on:
  workflow_dispatch:
    inputs:
      force-upload-debug:
        description: "Upload maestro-debug-ios even on a passing run, for #823's per-step command windows (no logcat, so analyze-maestro-run.mjs can't read it)"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "17 4 * * 1,4"

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  app:
    name: Restore the app and bundle its JS
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Install dependencies
        uses: ./.github/actions/install
        with:
          node-version: 24

      # Started in the background, so it runs beside the fingerprint and restore below. The .app it
      # writes into is a stand-in: hermesc embeds only its input's directory, which stays Xcode's.
      - name: Start bundling the JS
        env:
          EXPO_PUBLIC_E2E_FAST: "1"
        run: |
          products="$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator"
          echo "JS_BUNDLE=$products/js.app" >> "$GITHUB_ENV"
          mkdir -p "$products/js.app"
          (
            status=0
            tools/ci/rebundle-ios-app.sh "$products/js.app" > "$RUNNER_TEMP/bundle.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/bundle.status"
          ) > /dev/null 2>&1 &

      - name: Restore the app
        id: native
        uses: ./.github/actions/ios-app

      - name: Say how to fill the cache
        if: failure() && steps.native.outputs.key != '' && steps.native.outputs.cache-hit != 'true'
        env:
          KEY: ${{ steps.native.outputs.key }}
        run: |
          echo "::error::No native build for $KEY is in the cache, and this workflow never builds one." \
            "Dispatch ios-app-cache.yml on this branch, then this workflow again."
          exit 1

      - name: Bundle the JS into the app
        run: |
          for _ in $(seq 1 300); do
            [ -s "$RUNNER_TEMP/bundle.status" ] && break
            sleep 2
          done
          cat "$RUNNER_TEMP/bundle.log"
          [ "$(cat "$RUNNER_TEMP/bundle.status" 2>/dev/null)" = 0 ] || { echo "::error::Bundling the JS failed or never finished."; exit 1; }
          cached=""
          for candidate in "$RUNNER_TEMP"/ios-app/*.app; do
            [ -d "$candidate" ] && { cached="$candidate"; break; }
          done
          [ -n "$cached" ] || { echo "::error::No .app was restored."; exit 1; }
          app="$(dirname "$JS_BUNDLE")/$(basename "$cached")"
          rm -rf "$app"
          cp -R "$cached" "$app"
          cp -R "$JS_BUNDLE/." "$app/"
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"

      - name: The bundle carries the test-only flag
        run: node scripts/e2eBuildMark.mjs --present "$APP_BUNDLE"

      # Tarred, because an artifact keeps neither the executable bit nor the symlinks an .app has.
      - name: Pack the app
        run: tar -czf "$RUNNER_TEMP/app.tgz" -C "$(dirname "$APP_BUNDLE")" "$(basename "$APP_BUNDLE")"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ios-app
          path: ${{ runner.temp }}/app.tgz
          compression-level: 0
          overwrite: true
          if-no-files-found: error

  flows:
    name: Drive the app on a real iOS simulator (${{ matrix.shard }})
    needs: app
    runs-on: macos-latest
    # A cancelled job skips every `if: failure()` step below, so an overrun costs the artefacts
    # that would say what happened.
    timeout-minutes: 45
    strategy:
      # Each shard's flows are diagnosed from its own artefacts; one red shard must not cancel the rest.
      fail-fast: false
      # Every flow is in one shard (`tests/tooling/iosShards.test.ts`).
      matrix:
        include:
          - shard: rematch-prompt
            flows: .maestro/rematch-prompt.yaml
          - shard: offline-game
            flows: .maestro/offline-game.yaml
          - shard: exchange-phase
            flows: .maestro/exchange-phase.yaml
          - shard: smoke-and-felt
            flows: .maestro/smoke.yaml .maestro/rotate-after-cover.yaml
            felt: true

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      # In the background, as is the Spotlight step below; `Maestro is installed and Spotlight
      # indexing is off` waits for both.
      - name: Start installing Maestro
        run: |
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          (
            status=0
            {
              # This is the tool that decides what "the app rendered" means, and
              # unpinned it was the only thing in either job that could change
              # between two runs of the same commit. Raise it deliberately, and
              # read the changelog when you do (#701).
              export MAESTRO_VERSION=2.10.0
              curl -Ls "https://get.maestro.mobile.dev" | bash
              # Checked rather than echoed. A tag that does not resolve leaves the
              # installer's own `exit` returning the status of the echo before it,
              # which is 0 with nothing installed - so the pin has to be read back
              # off the binary that arrived.
              "$HOME/.maestro/bin/maestro" --version 2>&1 | tee /dev/stderr | grep -q "$MAESTRO_VERSION"
            } > "$RUNNER_TEMP/maestro.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/maestro.status"
          ) > /dev/null 2>&1 &

      - name: Start turning off the runner's Spotlight indexing
        run: |
          (
            status=0
            sudo mdutil -a -i off > "$RUNNER_TEMP/spotlight.log" 2>&1 || status=$?
            echo "$status" > "$RUNNER_TEMP/spotlight.status"
          ) > /dev/null 2>&1 &

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24

      # `macos-latest` ships a fixed set of pre-created simulators rather
      # than a fresh AVD per run, so the device to drive has to be found
      # rather than declared. Which one, and why, is in
      # `tools/ci/pick-simulator.mjs`, where it can be run and tested.
      #
      # Booted first and waited on only before the install: a first boot on a fresh runner
      # spends 1.5-8 minutes in data migration, and the Maestro driver launched into a device
      # still settling from it is what timed out.
      - name: Find and boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node tools/ci/pick-simulator.mjs)
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Every other device down, so exactly one simulator is booted while
          # the flows run. Maestro resolves an iOS target through the simulator
          # runtime rather than by UDID alone, and run 33418358705's log has
          # `xcodebuild: WARNING: Using the first of multiple matching
          # destinations` listing this one UDID twice, once as arm64 and once
          # as x86_64, followed by ~300 refused connections to the driver's
          # port. Maestro's own docs name ambiguous simulator targeting as a
          # cause of exactly that. `--device` below says which device; this
          # says there is nothing else running to be ambiguous with.
          xcrun simctl shutdown all 2>/dev/null || true
          # `shutdown` returns while a device can still be "Shutting Down", and `boot` in that
          # state fails outright rather than queueing.
          for _ in $(seq 1 30); do
            xcrun simctl list devices | grep -q "(Booted)\|(Shutting Down)" || break
            sleep 2
          done
          xcrun simctl boot "$udid"

      - name: Sample the runner's load
        run: |
          mkdir -p "$HOME/.maestro/tests"
          sysctl hw.ncpu hw.memsize > "$HOME/.maestro/tests/runner-top.log"
          nohup top -l 0 -s 5 -n 15 -o cpu -stats pid,command,cpu,rsize,state >> "$HOME/.maestro/tests/runner-top.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/top.pids"
          nohup top -l 0 -s 30 -n 15 -o rsize -stats pid,command,cpu,rsize,state > "$HOME/.maestro/tests/runner-mem.log" 2>&1 &
          echo $! >> "$RUNNER_TEMP/top.pids"

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ios-app
          path: ${{ runner.temp }}/packed

      - name: Unpack the app
        run: |
          mkdir -p "$RUNNER_TEMP/app"
          tar -xzf "$RUNNER_TEMP/packed/app.tgz" -C "$RUNNER_TEMP/app"
          app=""
          for candidate in "$RUNNER_TEMP"/app/*.app; do
            [ -d "$candidate" ] && { app="$candidate"; break; }
          done
          [ -n "$app" ] || { echo "::error::The app job's artifact holds no .app."; exit 1; }
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"
          # The id the flows are driven with comes from the built app itself,
          # not from app.json: a prebuild that renamed the bundle would
          # otherwise leave Maestro asking the simulator for an app that is
          # not there, which reads as "the app never launched".
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          echo "Driving $app ($id)"

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID" -b

      # A booted simulator's widget and poster extensions alone hold about 7 GB of a 7 GB runner, so
      # the flows page, and a tap synthesized while the runner is that starved is lost (#1378 B).
      # No flow uses any of these. A daemon may be idle now, so it need only be known to launchd;
      # every one, and every extension running now, must be gone before the app is installed.
      - name: Stop the simulator services no flow needs
        env:
          SERVICES: >-
            com.apple.apsd com.apple.chronod com.apple.PosterBoard com.apple.siriactionsd
            com.apple.mediaanalysisd com.apple.photoanalysisd com.apple.healthd com.apple.healthappd
            com.apple.intelligenceplatformd com.apple.mobileassetd com.apple.fitnessintelligenced
            com.apple.fitnesscoachingd com.apple.amsengagementd com.apple.suggestd com.apple.email.maild
            com.apple.icloudmailagent com.apple.remindd com.apple.nanotimekitcompaniond com.apple.homed
            com.apple.weatherd com.apple.ScreenTimeAgent com.apple.siriinferenced
          EXTENSIONS: 'simruntime/.*\.appex/'
        run: |
          pid_of() { printf '%s\n' "$listed" | awk -v label="$1" '$3 == label && $1 != "-" { print $1 }'; }
          listed=$(xcrun simctl spawn "$SIMULATOR_UDID" launchctl list)
          pids=""
          for label in $SERVICES; do
            printf '%s\n' "$listed" | awk -v label="$label" '$3 == label { found = 1 } END { exit !found }' ||
              { echo "::error::The simulator has no $label to stop."; exit 1; }
            pids="$pids $(pid_of "$label")"
          done
          extensions=$(pgrep -f "$EXTENSIONS" | tr '\n' ' ')
          [ -n "$extensions" ] || { echo "::error::The simulator runs no app extension to stop."; exit 1; }
          pids="$pids $extensions"
          stoppers=""
          for label in $SERVICES; do
            (
              xcrun simctl spawn "$SIMULATOR_UDID" launchctl disable "system/$label"
              xcrun simctl spawn "$SIMULATOR_UDID" launchctl bootout "system/$label" || :
            ) &
            stoppers="$stoppers $!"
          done
          for stopper in $stoppers; do wait "$stopper"; done
          pkill -f "$EXTENSIONS" || :
          for _ in $(seq 1 30); do
            alive=""
            for pid in $pids; do kill -0 "$pid" 2> /dev/null && alive="$alive $pid"; done
            listed=$(xcrun simctl spawn "$SIMULATOR_UDID" launchctl list)
            for label in $SERVICES; do [ -z "$(pid_of "$label")" ] || alive="$alive $label"; done
            [ -z "$alive" ] && { echo "Stopped$pids."; exit 0; }
            sleep 1
          done
          for pid in $alive; do ps -o pid=,command= -p "$pid" 2> /dev/null || :; done
          echo "::error::Still running after being stopped:$alive"
          exit 1

      - name: List the simulator's services
        run: |
          xcrun simctl spawn "$SIMULATOR_UDID" launchctl list > "$HOME/.maestro/tests/sim-launchctl.txt" 2>&1 || :
          ps -axo pid,rss,pcpu,command | grep -F simruntime > "$HOME/.maestro/tests/sim-ps.txt" || :

      - name: Install the app on the simulator
        id: install
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"

      - name: Maestro is installed and Spotlight indexing is off
        run: |
          for task in maestro spotlight; do
            for _ in $(seq 1 150); do
              [ -s "$RUNNER_TEMP/$task.status" ] && break
              sleep 2
            done
            cat "$RUNNER_TEMP/$task.log"
            [ "$(cat "$RUNNER_TEMP/$task.status" 2>/dev/null)" = 0 ] || { echo "::error::The $task step failed or never finished."; exit 1; }
          done

      # The warm-up drives only XCTest's input path on a fresh simulator (#1378 B), so a second
      # attempt on a rebooted one, with a fresh driver, hides nothing in the app. The flows get none.
      - name: Warm up the simulator's input
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          for attempt in 1 2; do
            maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" .maestro/_warmup.yaml && exit 0
            [ "$attempt" = 2 ] && break
            echo "::warning::Warm-up attempt $attempt failed; rebooting the simulator for a fresh driver."
            pkill -f "xcodebuild.*maestro-driver" || :
            xcrun simctl shutdown "$SIMULATOR_UDID"
            for _ in $(seq 1 30); do
              xcrun simctl list devices | grep "$SIMULATOR_UDID" | grep -q "Shutting Down" || break
              sleep 2
            done
            xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          done
          echo "::error::The warm-up failed twice."
          exit 1

      # `MAESTRO_APP_ID` names the app the flows drive; they have no default.
      - name: Run the flows
        env:
          # Maestro installs its own XCUITest runner onto the simulator before
          # the first step. On a shared macOS runner that install fails outright
          # about a third of the time — measured: three of eight dispatches on
          # 2026-08-31, one of them burning the full five minutes below, which
          # is what says it was never coming up rather than coming up late.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
          FLOWS: ${{ matrix.flows }}
        # Named rather than left to Maestro to resolve: run 33428373840 was the
        # first with `--device` and the first with no "iOS driver not ready in time".
        run: maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" $FLOWS

      # takeScreenshot writes to ~/.maestro/tests/<run>/felt-opaque/takeScreenshot/.
      - name: Photograph the felt
        if: ${{ !cancelled() && matrix.felt && steps.install.outcome == 'success' }}
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" .maestro/felt-opaque.yaml

      - name: The felt shows no black band and no black frame
        if: ${{ !cancelled() && matrix.felt && steps.install.outcome == 'success' }}
        run: |
          mkdir -p "$RUNNER_TEMP/felt"
          for shot in felt-first felt-settled; do
            found=$(find "$HOME/.maestro/tests" -path "*/felt-opaque/*" -name "$shot.png" 2>/dev/null | sort | tail -1)
            [ -n "$found" ] || { echo "::error::The felt flow wrote no $shot.png."; exit 1; }
            cp "$found" "$RUNNER_TEMP/felt/$shot.png"
          done
          node tools/ci/feltPixels.mjs "$RUNNER_TEMP/felt/felt-first.png" "$RUNNER_TEMP/felt/felt-settled.png"

      - name: Rotated card edges are anti-aliased
        if: ${{ !cancelled() && matrix.felt && steps.install.outcome == 'success' }}
        run: node tools/ci/edgePixels.mjs "$RUNNER_TEMP/felt/felt-settled.png"

      - name: Upload the felt screenshots
        if: ${{ !cancelled() && matrix.felt && steps.install.outcome == 'success' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: felt-ios
          path: ${{ runner.temp }}/felt/
          if-no-files-found: ignore

      # A simulator app's crash report lands in the host's own DiagnosticReports. Not gated on
      # failure: an app that died mid-flow can still pass the flows (see maestro.yml's crash step).
      - name: Fail if the app died of a native crash
        if: always()
        run: |
          [ -n "$APP_ID" ] || exit 0
          node tools/ci/find-native-crash.mjs ios "$APP_ID" --copy-to "$RUNNER_TEMP/crash-reports" \
            "$HOME/Library/Logs/DiagnosticReports"

      - name: Upload crash reports
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: crash-reports-ios-${{ matrix.shard }}
          path: ${{ runner.temp }}/crash-reports/
          if-no-files-found: ignore

      # `inputs.force-upload-debug`, never `github.event.inputs.`: the latter reads a
      # boolean as the string "false", which is truthy, and uploads on every run.
      - name: Upload Maestro debug output
        if: failure() || inputs.force-upload-debug
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: maestro-debug-ios-${{ matrix.shard }}
          path: ~/.maestro/tests/
          if-no-files-found: ignore

      - name: Stop sampling the runner's load
        if: always()
        run: |
          kill $(cat "$RUNNER_TEMP/top.pids") 2> /dev/null || :

  ios:
    name: Drive the app on a real iOS simulator
    needs: [app, flows]
    # `always()`, so a skipped or cancelled job reaches the check below and turns it red.
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Every shard ran and passed
        env:
          RESULTS: ${{ needs.app.result }} ${{ needs.flows.result }}
        run: |
          echo "The app job's and the shards' results: $RESULTS"
          [ "$RESULTS" = "success success" ]

      - name: The run finished within its wall budget
        env:
          GH_TOKEN: ${{ github.token }}
        run: node tools/ci/ios-wall.mjs "Drive the app on a real iOS simulator"

      # `cancelled()` is a cancelled run: it skips every `failure()` step.
      - name: Report a red scheduled run to the tracker
        if: (failure() || cancelled()) && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: bash tools/ci/report-device-run.sh ios.yml

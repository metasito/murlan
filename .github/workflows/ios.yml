name: iOS UI (Maestro)

# On demand only (`workflow_dispatch`) — not on `push`, not on a schedule,
# and not on `pull_request` either; see the paragraph below. `maestro.yml`'s
# own header explains why a flaky device job on every push is worse than no job.
#
# `macos-latest` is free on this repo's standard runners (the repo went
# public in #277), ships Xcode and iOS simulators preinstalled, and an iOS
# Simulator is a process on the host rather than a virtualised device — no
# KVM step, no emulator boot poll, none of #186's "Timeout waiting for
# emulator to boot". That is the whole reason this job exists alongside
# `maestro.yml` instead of just fixing the Android one.
# Disabled on pull requests until its smoke flow passes on `main`: it was red when that call
# was made, and a check that is always red teaches every reader that red is fine — it also
# gates nothing, because ci.yml is the gate and `land.ts` merges past it.
#
# It then went green on 2026-08-26 and the trigger was never restored, so nothing dispatched
# it for five days while the flow went stale. It is red again today, on #620. #354 owns
# bringing `pull_request` back, and must not until #620 passes twice running.
on:
  workflow_dispatch:

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  ios:
    name: Drive the app on a real iOS simulator
    runs-on: macos-latest
    # Generous on purpose, and the same as maestro.yml's: this job compiles the
    # app before it drives it, and then runs offline-game.yaml as well as
    # smoke.yaml — offline-game is a full hand, 16 minutes on a developer
    # machine. A measured run is 23. Hitting the cap
    # cancels the job, and a cancelled job skips every `if: failure()` step
    # below, so an overrun costs the artefacts that would say what happened.
    timeout-minutes: 100

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Expo Go cannot host this suite. Its dev-menu window sits above the
      # app's own and takes the touch: run 33397453801's simulator log has the
      # tap on "Salta il tutorial" dispatched `to window: <EXDevMenuWindow>`,
      # which then resigns key — the tap is spent dismissing an invisible
      # window and the app never sees it. Across every Android and iOS run
      # this repo has ever recorded, the only taps that landed were on Expo
      # Go's own native dialogs; a `back` **key** works, because keys go to
      # the app rather than through window hit-testing (#627).
      #
      # Release, not Debug: it bundles the JS into the app, so there is no
      # Metro to start, no packager URL to reach, no deep link and no
      # dev menu to be on top in the first place.
      - name: Build the app
        run: |
          npx expo prebuild --platform ios --no-install
          pod install --project-directory=ios
          # Named from app.json rather than fixed here, so renaming the app
          # does not silently start driving a stale build.
          #
          # Matched by the shell rather than by `ls`: this step runs under
          # `bash -eo pipefail`, where a failed `ls` in a bare assignment kills
          # the step on the spot and the message below never prints — the
          # cause is then a raw "No such file or directory" instead of the one
          # sentence saying what was expected.
          workspace=""
          for candidate in ios/*.xcworkspace; do
            [ -d "$candidate" ] && { workspace="$candidate"; break; }
          done
          [ -n "$workspace" ] || { echo "::error::expo prebuild produced no ios/*.xcworkspace."; exit 1; }
          scheme=$(basename "$workspace" .xcworkspace)
          echo "Building scheme $scheme"
          # One slice, for the machine this actually runs on. Release defaults
          # ONLY_ACTIVE_ARCH to NO and so compiles every valid architecture:
          # on an Apple-silicon runner half the build is an x86_64 slice
          # nothing here can execute, and this step is 45% of the job. Asking
          # for the active architecture says that in the setting that controls
          # it, and stays right on a runner of either kind — where naming an
          # architecture would hand the other one a binary its simulator
          # cannot load. Measured: 794s to 533s.
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          app=""
          for candidate in "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/"*.app; do
            [ -d "$candidate" ] && { app="$candidate"; break; }
          done
          [ -n "$app" ] || { echo "::error::xcodebuild produced no .app."; exit 1; }
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"
          # The id the flows are driven with comes from the built app itself,
          # not from app.json: a prebuild that renamed the bundle would
          # otherwise leave Maestro asking the simulator for an app that is
          # not there, which reads as "the app never launched".
          id=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          echo "Built $app ($id)"

      # `macos-latest` ships a fixed set of pre-created simulators rather
      # than a fresh AVD per run, so the device to drive has to be found
      # rather than declared. Picks the highest-versioned iOS runtime the
      # image has — the same "don't hardcode a model" reasoning maestro.yml
      # applies to the Expo Go SDK below.
      #
      # The iPhone within it is chosen by name rather than taken as simctl
      # happens to order them, so a runner image that reorders its device list
      # cannot silently change which device the flows ran on.
      #
      # The SE stays excluded, for a smaller reason than the one that used to
      # be written here: the flows no longer tap the hand by percentage of the
      # screen (#661 made them name the card), so its 16:9 shape is no longer
      # disqualifying — it is simply a device nothing has ever driven these
      # flows on.
      - name: Find and boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const { devices } = JSON.parse(s);
              const usable = (d) => /^iPhone/.test(d.name) && !/\bSE\b/.test(d.name);
              const version = (r) => (r.match(/iOS-(\d+)-(\d+)/) || []).slice(1).map(Number);
              const runtimes = Object.keys(devices)
                .filter((r) => /iOS/i.test(r) && devices[r].some(usable))
                .sort((a, b) => {
                  const [aMaj, aMin] = version(a);
                  const [bMaj, bMin] = version(b);
                  return aMaj - bMaj || aMin - bMin;
                });
              if (runtimes.length === 0) {
                console.error("::error::No iOS runtime with a full-screen iPhone on this runner.");
                process.exit(1);
              }
              const runtime = runtimes[runtimes.length - 1];
              const iphones = devices[runtime]
                .filter(usable)
                .sort((a, b) => a.name.localeCompare(b.name, "en", { numeric: true }));
              const iphone = iphones[iphones.length - 1];
              console.error(`Using ${iphone.name} on ${runtime}`);
              process.stdout.write(iphone.udid);
            });
          ')
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          # Every other device down, so exactly one simulator is booted while
          # the flows run. Maestro resolves an iOS target through the simulator
          # runtime rather than by UDID alone, and run 33418358705's log has
          # `xcodebuild: WARNING: Using the first of multiple matching
          # destinations` listing this one UDID twice, once as arm64 and once
          # as x86_64, followed by ~300 refused connections to the driver's
          # port. Maestro's own docs name ambiguous simulator targeting as a
          # cause of exactly that. `--device` below says which device; this
          # says there is nothing else running to be ambiguous with.
          xcrun simctl shutdown all 2>/dev/null || true
          # `shutdown` returns while a device can still be "Shutting Down", and `erase` in that
          # state fails outright rather than queueing — so the wait belongs with the shutdown,
          # not with the boot.
          for _ in $(seq 1 30); do
            xcrun simctl list devices | grep -q "(Booted)\|(Shutting Down)" || break
            sleep 2
          done
          # Erased before anything is put on it. These simulators are the
          # image's own and are reused between jobs, so whatever the last run
          # left behind is still there — including a half-installed Maestro
          # XCTest runner, which is how a job spends its whole
          # MAESTRO_DRIVER_STARTUP_TIMEOUT and then reports "iOS driver not
          # ready in time". Raising that timeout to 5 minutes did not help,
          # because the runner was never coming up rather than coming up late.
          xcrun simctl erase "$udid"
          # `bootstatus -b` boots the device if it is not already booted and
          # then waits. A bare `simctl boot` on a device the image left booted
          # exits non-zero instead, taking the step with it.
          xcrun simctl bootstatus "$udid" -b

      - name: Install the app on the simulator
        run: xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"

      - name: Install Maestro
        run: |
          # Pinned, because this is the tool that decides what "the app
          # rendered" means and it was the only thing in either job that could
          # change between two runs of the same commit. 2.7.0 rewrote the iOS
          # hierarchy retrieval ("direct snapshot traversal") and arrived here
          # with no commit to bisect against; #685 was chased against a moving
          # driver for a day because of it. Raise this deliberately, and read
          # the changelog when you do (#701).
          export MAESTRO_VERSION=2.10.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          # Stated in the log, so a run's own record says what drove it.
          "$HOME/.maestro/bin/maestro" --version

      # Both flows, named rather than globbed: the order is the thing being
      # relied on. `clearState` makes each start from the same place, so either
      # order has to work — but a directory glob would also pick up a flow added
      # later and run it here without anyone deciding to.
      #
      # `MAESTRO_APP_ID` is what tells the flows they are driving the app
      # itself: given one, they skip the Expo Go launch dance entirely.
      - name: Run the flows
        env:
          # Maestro installs its own XCUITest runner onto the simulator before
          # the first step. On a shared macOS runner that install fails outright
          # about a third of the time — measured: three of eight dispatches on
          # 2026-08-31, one of them burning the full five minutes below, which
          # is what says it was never coming up rather than coming up late.
          # Erasing the device first (above) helps and does not settle it.
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          # Retried once, and only when the driver never started — the same
          # shape `maestro.yml` uses for an emulator that never boots (#186,
          # #647). A flow that ran and failed is a result about the branch and
          # is never retried: re-running it would turn a real red into a
          # coin flip, which is the failure mode that judgement exists to
          # avoid.
          # Named rather than left to Maestro to resolve. The driver failed to
          # start in three of eight dispatches while nothing said which device
          # to drive; run 33428373840 is the first with this flag and the first
          # whose log has no "iOS driver not ready in time" at all. That is one
          # run, so the retry below stays as the tripwire that measures whether
          # it holds.
          run_flows() {
            maestro --device "$SIMULATOR_UDID" test -e MAESTRO_APP_ID="$APP_ID" \
              .maestro/smoke.yaml .maestro/offline-game.yaml 2>&1 | tee "$RUNNER_TEMP/maestro-$1.log"
            return "${PIPESTATUS[0]}"
          }
          if run_flows first; then exit 0; fi
          grep -q "iOS driver not ready in time" "$RUNNER_TEMP/maestro-first.log" || {
            echo "::error::The flows ran and failed. That is a result about this branch, not the runner."
            exit 1
          }
          echo "::warning::Maestro's driver never started; erasing the device and trying once more."
          xcrun simctl shutdown "$SIMULATOR_UDID" 2>/dev/null || true
          xcrun simctl erase "$SIMULATOR_UDID"
          xcrun simctl bootstatus "$SIMULATOR_UDID" -b
          xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"
          run_flows second

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug-ios
          path: ~/.maestro/tests/
          if-no-files-found: ignore

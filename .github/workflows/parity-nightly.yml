# The mockup-parity specs, off the pull request path: they measure pixels and onsets against the
# mockups, report into the tracker, and gate nothing (docs/agents/suites.md).
name: Mockup parity

on:
  schedule:
    - cron: "29 3 * * *"
  workflow_dispatch:

concurrency:
  group: parity-nightly-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  issues: write

jobs:
  parity:
    name: Mockup parity specs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: /tmp/metro-cache
          key: metro-${{ hashFiles('package-lock.json', 'patches/**', 'metro.config.js', 'babel.config.js') }}
      - name: Playwright version
        id: pw
        run: echo "version=$(node -p "require('@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-shell-${{ steps.pw.outputs.version }}
      - name: Install Playwright's browser
        run: npx playwright install --only-shell chromium

      - name: Mockup parity specs
        timeout-minutes: 50
        run: npx playwright test --config tests/e2e/playwright.parity.config.ts

      - name: Keep the Playwright report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-report
          path: tests/e2e/playwright-report/
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0

      - name: Build the mockup side-by-side page
        if: always()
        run: node scripts/mockupParityPage.mjs tests/e2e/playwright-report mockup-parity

      - name: Keep the mockup side-by-side page
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mockup-parity
          path: mockup-parity/
          if-no-files-found: error
          retention-days: 30
          compression-level: 0

      - name: Report the failure to the tracker
        if: failure() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The nightly mockup-parity run failed. [Run]($RUN_URL)"
            echo
            echo "The side-by-side page is the run's \`mockup-parity\` artifact. Locally:"
            echo '```'
            echo "npx playwright test --config tests/e2e/playwright.parity.config.ts"
            echo '```'
          } > parity-failure.md
          title="The nightly mockup-parity run failed"
          gh label create parity --color BFD4F2 --description "Nightly mockup-parity report" 2>/dev/null || true
          bash tools/ci/report-to-tracker.sh "$title" parity-failure.md parity

      - name: Close the failure issue once a run passes
        if: success() && github.event_name == 'schedule'
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="The nightly mockup-parity run failed"
          gh issue list --label parity --state open --limit 20 --json number,title \
            --jq "map(select(.title == \"$title\")) | .[].number" | while read -r n; do
            gh issue comment "$n" --body "The nightly mockup-parity run passed. [Run]($RUN_URL)"
            gh issue close "$n"
          done

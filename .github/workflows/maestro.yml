name: Android UI (Maestro)

# On demand only.
#
# Not because the job does not work - it does, and smoke.yaml passes on a
# runner - but because the emulator underneath it does not boot reliably
# (#186). Three runs ended on "Timeout waiting for emulator to boot", one of
# them on stock settings, on a commit that had passed minutes earlier. On a
# `push` trigger each of those is a red main for a reason nobody can act on,
# which is the exact thing this trigger has always existed to prevent.
#
# Turn it back on by restoring `push: branches: [main]` once #186 is settled.
#
# Everything a developer's own machine supplies by hand, this supplies
# explicitly, because the first runs of this job found each one missing in
# turn (#35): Expo Go is not on a stock system image, the guest cannot reach
# the dev server on 10.0.2.2, and a dev server serving an EAS-linked project
# will not hand out a signed manifest without an Expo account.
on:
  workflow_dispatch:

concurrency:
  group: maestro-${{ github.ref }}
  # Kept off main: superseding a main run would destroy the only evidence that
  # merged code was ever driven on a device. Matters again the moment the push
  # trigger comes back.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: Drive the app on a real Android emulator
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # KVM is present on the standard Linux runner but not exposed to the
      # user by default; without it the emulator falls back to software
      # emulation and is far too slow to finish a hand.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The flows drive the app through Expo Go against a dev server, the same
      # way they do locally. Started in the background here and reached from
      # the emulator at 10.0.2.2 — the flows' own default, so nothing needs
      # overriding.
      - name: Start the Expo dev server
        run: |
          # nohup + disowned: a plain `cmd &` can be reaped when the step's own
          # shell exits, and the next step would then find nothing listening.
          # --offline because app.json carries an EAS projectId: Expo Go asks a
          # linked project for a *signed* manifest, signing wants an
          # authenticated account, and a runner has none - so the request 500s
          # with "Input is required, but 'npx expo' is in non-interactive mode"
          # and the device shows only "Something went wrong". Offline serves the
          # same manifest unsigned, which Expo Go accepts. The alternative is an
          # EXPO_TOKEN secret, which buys nothing here: none of this needs an
          # account.
          nohup npx expo start --offline --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/status | grep -q "packager-status:running"; then
              echo "Metro is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Metro never came up on 8081."
          cat "$RUNNER_TEMP/metro.log"
          exit 1

      # Metro bundles this app on demand, and the first request for it is the
      # device's. That put a cold bundle of the whole app on a two-core runner
      # inside the 60s the flows allow for the app to appear, with an emulator
      # competing for the same cores. Asking for it here builds it while
      # nothing else is running, so the device is served a cache hit.
      - name: Build the bundle before the emulator competes for the CPU
        run: |
          curl -s -o "$RUNNER_TEMP/manifest.json" -H 'expo-platform: android' -H 'accept: multipart/mixed,application/expo+json,application/json' http://127.0.0.1:8081/
          bundle=$(node -e '
            const body = require("fs").readFileSync(process.env.RUNNER_TEMP + "/manifest.json", "utf8");
            const json = body.slice(body.indexOf("{"), body.lastIndexOf("}") + 1);
            let url;
            try {
              url = JSON.parse(json).launchAsset?.url;
            } catch {
              url = null;
            }
            if (!url) {
              console.error("::error::No launchAsset in the dev server manifest.");
              process.exit(1);
            }
            process.stdout.write(url);
          ')
          echo "Warming $bundle"
          curl -sf -o /dev/null -w 'bundle: %{http_code} in %{time_total}s' "$bundle"
          echo

      # The flows drive Expo Go (`appId: host.exp.exponent`), which a stock
      # google_apis system image does not carry. Locally `expo start --android`
      # installs it on first connect (docs/TESTING.md §5); nothing on a runner
      # does, so the emulator boots fine and every flow fails on "Package
      # host.exp.exponent is not installed".
      #
      # Resolved from the SDK this project pins rather than hardcoded: Expo Go
      # carries one SDK at a time, so the newest client is the wrong one the
      # moment it moves ahead of us.
      - name: Fetch the Expo Go client for this project's SDK
        run: |
          url=$(curl -sf https://api.expo.dev/v2/versions/latest | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const major = require("./package.json").dependencies.expo.replace(/^\D*/, "").split(".")[0];
              const sdk = `${major}.0.0`;
              const url = JSON.parse(s).data.sdkVersions?.[sdk]?.androidClientUrl;
              if (!url) {
                console.error(`::error::No Expo Go Android client published for SDK ${sdk}.`);
                process.exit(1);
              }
              process.stdout.write(url);
            });
          ')
          echo "Expo Go client: $url"
          curl -Lsf -o "$RUNNER_TEMP/expo-go.apk" "$url"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # api-level and target match the AVD documented in docs/TESTING.md §5, so
      # a failure here and a failure locally mean the same thing.
      - name: Run the flows
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
          # Left on. #35 names this as the first knob to try for a struggling
          # emulator and it was tried, but it is the wrong one: Reanimated reads
          # the system scales as a reduced-motion signal and disables animations
          # of its own accord - it says so in Metro's log - and the game table
          # then never arrives. What the ANRs actually needed was
          # hide_error_dialogs, below. Driving real worklets on a real UI thread
          # is the reason this layer exists.
          disable-animations: false
          # Deliberately stock. Raising cores and memory was aimed at
          # offline-game, which is not run here (#185), and did not save it.
          #
          # The boot itself is intermittently slow on a runner - three runs have
          # ended on "Timeout waiting for emulator to boot", including one on
          # these very defaults, so it is the runner rather than anything
          # configured here. The action's own cap is 600s and each of those runs
          # spent all of it; this gives it half as long again. Unverified: it
          # cannot be proven except by hitting the flake again. #186.
          emulator-boot-timeout: 900
          script: |
            # The flows select on Italian copy, the same way
            # tests/e2e/playwright.config.ts pins locale: "it-IT" and for the
            # same reason: a runner's emulator comes up en-US, so the app
            # renders "QUICK GUIDE" where the flow waits for "GUIDA RAPIDA" -
            # on screen, correct, and failing every assertion.
            #
            # The property needs root to set and a restart to take effect, and
            # it has to be a real reboot: `stop; start` brings the framework
            # back with System UI wedged on a two-core runner, and the app then
            # ANRs instead of rendering - the hierarchy at the point of failure
            # held the ANR dialog and nothing else. A reboot comes up clean.
            #
            # Every line here runs as its own `sh -c`: no construct may span
            # lines, and no variable survives to the next one.
            #
            # sys.boot_completed comes back long before the framework is serving:
            # the install below failed first on "Can't find service: package" and
            # then on "Cannot access system provider: 'settings'". Waiting on the
            # providers themselves, plus a stopped boot animation, waits for the
            # thing those errors are really about instead of naming them one at a
            # time.
            adb root
            adb wait-for-device
            adb shell setprop persist.sys.locale it-IT
            adb unroot
            adb wait-for-device
            adb reboot
            adb wait-for-device
            until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do sleep 2; done
            until adb shell "getprop init.svc.bootanim | grep -q stopped && cmd package list packages > /dev/null 2>&1 && cmd settings list system > /dev/null 2>&1"; do sleep 2; done
            adb shell getprop persist.sys.locale | tr -d '\r' | grep -qx it-IT || { echo "::error::Device locale is not it-IT; the flows select on Italian copy."; exit 1; }
            # System UI ANRs on this runner while the app is loading, and its
            # dialog then sits over everything: the app is running fine behind it
            # - its own Reanimated warnings reach Metro - but the hierarchy holds
            # the dialog and nothing else, so every assertion fails. This hides
            # the system dialog only; an app that genuinely hangs still fails.
            adb shell settings put global hide_error_dialogs 1
            adb install -r "$RUNNER_TEMP/expo-go.apk"
            # Expo Go reports a failed manifest fetch as nothing but "Something
            # went wrong" on the device, which cannot tell a dead dev server
            # from one answering with an error. Asking the same question from
            # the host turns that into a status code.
            curl -sf -o /dev/null -w 'metro /status: %{http_code}' http://127.0.0.1:8081/status || echo "::warning::Metro is no longer answering on 8081."
            echo
            curl -s -o "$RUNNER_TEMP/manifest.out" -w 'manifest: %{http_code}' -H 'expo-platform: android' -H 'expo-runtime-version: exposdk:54.0.0' -H 'accept: multipart/mixed,application/expo+json,application/json' http://127.0.0.1:8081/
            echo
            head -c 1200 "$RUNNER_TEMP/manifest.out"
            echo
            # The flows reach the dev server over this forward, on 127.0.0.1.
            # They do not take an address from the command line: `-e` is applied
            # before a flow's own `env:` block, so the flag loses to it silently
            # and every run went to 10.0.2.2 regardless of what was passed here.
            # That address does not reach the dev server from this emulator -
            # Metro's log records no request at all over it.
            # The flows select on Italian copy, the same way
            # tests/e2e/playwright.config.ts pins locale: "it-IT" and for the
            # same reason. A runner's emulator comes up en-US, so the app
            # renders "QUICK GUIDE" where the flow waits for "GUIDA RAPIDA" -
            # on screen, correct, and failing every assertion. Root is needed
            # to set the property, and Maestro cannot attach through a root
            # adbd, so this drops back down before the flows run.
            adb reverse tcp:8081 tcp:8081
            # smoke only. offline-game.yaml passes locally - a real hand driven to
            # the result screen in 16m - and on a runner it reaches the table and
            # then dies there with no assertion message at all, which is the
            # emulator going down rather than the app being wrong. More memory,
            # more cores and a longer wait all changed nothing. #185, and
            # docs/TESTING.md §5 predicted it before any of this ran.
            maestro test .maestro/smoke.yaml

      # Recordings, logs and screenshots from a failed flow are the only way to
      # tell a real regression from an emulator that fell over. Metro's own log
      # goes with them: a flow that dies loading the app failed on a request
      # this is the only record of.
      - name: Collect Metro's log alongside them
        if: failure()
        run: |
          mkdir -p "$HOME/.maestro/tests"
          cp "$RUNNER_TEMP/metro.log" "$HOME/.maestro/tests/metro.log" || true

      - name: Upload Maestro debug output
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore

name: Android UI (Maestro)

# On demand only.
#
# Not because the job does not work - it does, and smoke.yaml passes on a
# runner - but because the emulator underneath it does not boot reliably
# (#186). Three runs ended on "Timeout waiting for emulator to boot", one of
# them on stock settings, on a commit that had passed minutes earlier. On a
# `push` trigger each of those is a red main for a reason nobody can act on,
# which is the exact thing this trigger has always existed to prevent.
#
# Do not turn it back on for #186 alone. As of 2026-08-31 this job is red every run on #627 —
# a Maestro tap never reaches a Pressable on the tutorial screen, so the flows cannot get past
# it — and restoring a trigger now would put a known-red device job on every merge, which is
# the thing this stop-gap exists to prevent. #354 owns the trigger and wants `pull_request`,
# not `push`; it needs #627 fixed and #186's boot flake either retried clean or made an
# actionable failure first.
#
# Everything a developer's own machine supplies by hand, this supplies
# explicitly, because the first runs of this job found each one missing in
# turn (#35): Expo Go is not on a stock system image, the guest cannot reach
# the dev server on 10.0.2.2, and a dev server serving an EAS-linked project
# will not hand out a signed manifest without an Expo account.
on:
  workflow_dispatch:
    inputs:
      emulator-boot-timeout:
        # The retry below only fires when the device never came up, which on a
        # healthy runner it always does. Lowering this is the only way to make
        # that branch run on demand instead of waiting for the flake.
        description: Seconds to allow for the emulator to boot (lower it to exercise the retry)
        required: false
        default: "900"

concurrency:
  group: maestro-${{ github.ref }}
  # Kept off main: superseding a main run would destroy the only evidence that
  # merged code was ever driven on a device. Matters again the moment the push
  # trigger comes back.
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  android:
    name: Drive the app on a real Android emulator
    runs-on: ubuntu-latest
    # Two boot waits fit inside this, which is the point: at 900s each, plus
    # ~2 min of setup before the first, a double timeout lands near 32 min and
    # one timeout followed by a slow-but-successful retry near 40. A job that
    # overruns is cancelled rather than failed, which loses the verdict and both
    # artefacts - so the retry must not be what pushes it over.
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      # KVM is present on the standard Linux runner but not exposed to the
      # user by default; without it the emulator falls back to software
      # emulation and is far too slow to finish a hand.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      # The flows drive the app through Expo Go against a dev server, the same
      # way they do locally. Started in the background here and reached from
      # the emulator at 10.0.2.2 — the flows' own default, so nothing needs
      # overriding.
      - name: Start the Expo dev server
        run: |
          # nohup + disowned: a plain `cmd &` can be reaped when the step's own
          # shell exits, and the next step would then find nothing listening.
          # --offline because app.json carries an EAS projectId: Expo Go asks a
          # linked project for a *signed* manifest, signing wants an
          # authenticated account, and a runner has none - so the request 500s
          # with "Input is required, but 'npx expo' is in non-interactive mode"
          # and the device shows only "Something went wrong". Offline serves the
          # same manifest unsigned, which Expo Go accepts. The alternative is an
          # EXPO_TOKEN secret, which buys nothing here: none of this needs an
          # account.
          nohup npx expo start --offline --port 8081 > "$RUNNER_TEMP/metro.log" 2>&1 &
          disown
          for i in $(seq 1 60); do
            if curl -sf http://127.0.0.1:8081/status | grep -q "packager-status:running"; then
              echo "Metro is up."
              exit 0
            fi
            sleep 2
          done
          echo "::error::Metro never came up on 8081."
          cat "$RUNNER_TEMP/metro.log"
          exit 1

      # Metro bundles this app on demand, and the first request for it is the
      # device's. That put a cold bundle of the whole app on a two-core runner
      # inside the 60s the flows allow for the app to appear, with an emulator
      # competing for the same cores. Asking for it here builds it while
      # nothing else is running, so the device is served a cache hit.
      - name: Build the bundle before the emulator competes for the CPU
        run: |
          curl -s -o "$RUNNER_TEMP/manifest.json" -H 'expo-platform: android' -H 'accept: multipart/mixed,application/expo+json,application/json' http://127.0.0.1:8081/
          bundle=$(node -e '
            const body = require("fs").readFileSync(process.env.RUNNER_TEMP + "/manifest.json", "utf8");
            const json = body.slice(body.indexOf("{"), body.lastIndexOf("}") + 1);
            let url;
            try {
              url = JSON.parse(json).launchAsset?.url;
            } catch {
              url = null;
            }
            if (!url) {
              console.error("::error::No launchAsset in the dev server manifest.");
              process.exit(1);
            }
            process.stdout.write(url);
          ')
          echo "Warming $bundle"
          curl -sf -o /dev/null -w 'bundle: %{http_code} in %{time_total}s' "$bundle"
          echo

      # The flows drive Expo Go (`appId: host.exp.exponent`), which a stock
      # google_apis system image does not carry. Locally `expo start --android`
      # installs it on first connect (docs/TESTING.md §5); nothing on a runner
      # does, so the emulator boots fine and every flow fails on "Package
      # host.exp.exponent is not installed".
      #
      # Resolved from the SDK this project pins rather than hardcoded: Expo Go
      # carries one SDK at a time, so the newest client is the wrong one the
      # moment it moves ahead of us.
      - name: Fetch the Expo Go client for this project's SDK
        run: |
          url=$(curl -sf https://api.expo.dev/v2/versions/latest | node -e '
            let s = "";
            process.stdin.on("data", (d) => (s += d)).on("end", () => {
              const major = require("./package.json").dependencies.expo.replace(/^\D*/, "").split(".")[0];
              const sdk = `${major}.0.0`;
              const url = JSON.parse(s).data.sdkVersions?.[sdk]?.androidClientUrl;
              if (!url) {
                console.error(`::error::No Expo Go Android client published for SDK ${sdk}.`);
                process.exit(1);
              }
              process.stdout.write(url);
            });
          ')
          echo "Expo Go client: $url"
          curl -Lsf -o "$RUNNER_TEMP/expo-go.apk" "$url"

      - name: Install Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      # api-level and target match the AVD documented in docs/TESTING.md §5, so
      # a failure here and a failure locally mean the same thing.
      # A boot timeout is the runner's environment; a failing flow is a real
      # answer about the diff. Retrying both would double a genuine red to
      # arrive at the same red, so the retry fires only for a boot that never
      # happened - which the marker written inside the action distinguishes.
      #
      # The step itself lives in .github/actions/drive-android-flows so that
      # running it twice does not mean two copies of its configuration.
      - name: Run the flows
        id: flows
        continue-on-error: true
        uses: ./.github/actions/drive-android-flows
        with:
          emulator-boot-timeout: ${{ inputs.emulator-boot-timeout || '900' }}

      - name: Which kind of failure that was
        id: kind
        if: steps.flows.outcome == 'failure'
        run: |
          if [ -f "$RUNNER_TEMP/emulator-booted" ]; then
            echo "started=true" >> "$GITHUB_OUTPUT"
            echo "The device came up and the flows ran; the flows themselves failed."
          else
            echo "started=false" >> "$GITHUB_OUTPUT"
            echo "::warning::The device never got as far as the flows, so this run says nothing about the diff. Retrying once - #186."
          fi

      # The retry asks for the same AVD on the same port inside the same job. A
      # first emulator that outlived its own timeout still holds 5554, and the
      # action's own teardown swallows the error when it cannot reach it - so
      # the second attempt would fail to bind and poll the corpse for another
      # 900s, guaranteeing the double-timeout verdict from a single flake.
      - name: Make sure nothing from the first attempt still holds the port
        if: steps.flows.outcome == 'failure' && steps.kind.outputs.started == 'false'
        run: |
          pkill -f 'emulator -port 5554' || true
          adb kill-server || true

      - name: Retry, and only when the flows never started
        id: retry
        if: steps.flows.outcome == 'failure' && steps.kind.outputs.started == 'false'
        continue-on-error: true
        uses: ./.github/actions/drive-android-flows
        with:
          emulator-boot-timeout: ${{ inputs.emulator-boot-timeout || '900' }}

      # `continue-on-error` above keeps the job alive long enough to tell those
      # two apart, which means the job's verdict is no longer its own - it has
      # to be stated here. Before the artefact steps below, because their
      # `if: failure()` is what uploads them.
      - name: The run's real verdict
        run: |
          if [ "${{ steps.flows.outcome }}" = "success" ] || [ "${{ steps.retry.outcome }}" = "success" ]; then
            exit 0
          fi
          if [ "${{ steps.retry.outcome }}" = "failure" ] && [ ! -f "$RUNNER_TEMP/emulator-booted" ]; then
            echo "::error::The device failed to come up twice. That is the runner and not this branch - #186."
            exit 1
          fi
          echo "::error::The flows ran on a device that came up, so this is a result about the diff."
          exit 1

      # An app that dies mid-flow does not fail the step it died on. Maestro's
      # next assertion still matches the hierarchy it had already read, so it
      # passes, and the failure surfaces a step later against whatever is on
      # screen by then - once, the emulator's own launcher. The step name is
      # then actively misleading, and the only honest record is the tombstone,
      # twenty minutes into an artefact nobody downloads. So the run says it
      # itself (#629). Not gated on failure: a crash that did not manage to
      # fail the run is worth knowing about more, not less.
      - name: Say if the app died rather than failed
        id: crash
        if: always()
        run: |
          # Every command here is `|| true`-ed or pipelined on purpose. This step
          # runs under `bash -e`, and a grep that matches nothing exits non-zero:
          # a step that dies here emits no warning at all, which is the failure
          # this one exists to prevent, in its own implementation.
          tombstone=$(grep -rl ">>> host.exp.exponent" "$HOME/.maestro/tests" 2>/dev/null | head -1 || true)
          [ -n "$tombstone" ] || exit 0
          echo "found=true" >> "$GITHUB_OUTPUT"
          # Scoped to the block the file was selected by. A bare match would take
          # the first fatal signal anywhere in the logcat, which can belong to
          # another process on the emulator and would be reported as ours.
          signal=$(grep -A6 ">>> host.exp.exponent" "$tombstone" | grep -m1 -o "signal [0-9]* ([A-Z]*)" || echo "an unknown signal")
          echo "::warning::The app died of a native crash during this run ($signal). Maestro asserts against a stale hierarchy afterwards, so the step that failed is not where the problem is - read the screenshot beside it. Tombstone: ${tombstone#$HOME/.maestro/tests/}. #629"

      # Recordings, logs and screenshots from a failed flow are the only way to
      # tell a real regression from an emulator that fell over. Metro's own log
      # goes with them: a flow that dies loading the app failed on a request
      # this is the only record of.
      - name: Collect Metro's log alongside them
        if: failure() || steps.crash.outputs.found == 'true'
        run: |
          mkdir -p "$HOME/.maestro/tests"
          cp "$RUNNER_TEMP/metro.log" "$HOME/.maestro/tests/metro.log" || true

      - name: Upload Maestro debug output
        if: failure() || steps.crash.outputs.found == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: maestro-debug
          path: ~/.maestro/tests/
          if-no-files-found: ignore

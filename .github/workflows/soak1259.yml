# [RESEARCH-1259] never merged. Builds react-native-audio-api + turbo-haptics on RN 0.86 in Release
# and soaks one fresh AudioBufferSourceNode per effect for 31 minutes (upstream issue #1263).
name: Soak 1259 (audio engine)

on:
  push:
    branches: [research/1259-probe]
  workflow_dispatch:

concurrency:
  group: soak1259-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SOAK_SECONDS: "1860"

jobs:
  android:
    name: android-${{ matrix.arm }}
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        arm: [full, effects]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Generate the native project
        id: prebuild
        run: |
          npx expo prebuild --platform android --no-install
          want=$(sed -n 's/^ndkVersion = "\(.*\)"$/\1/p' node_modules/react-native/gradle/libs.versions.toml)
          have=$(ls "$ANDROID_HOME/ndk" | grep "^${want%%.*}\." | sort -V | tail -1)
          [ -n "$have" ] || { echo "::error::No NDK ${want%%.*}.x under $ANDROID_HOME/ndk to build with."; exit 1; }
          sed -i "1i ext.ndkVersion = \"$have\"" android/build.gradle
          echo "Building with NDK $have (Expo pins $want)"

      - name: The generated project carries the plugin options
        run: |
          grep -n "disableAudioapiFFmpeg=true" android/gradle.properties
          grep -n "disableAudioapiStaticExternalLibs=true" android/gradle.properties
          grep -n 'usesCleartextTraffic="true"' android/app/src/main/AndroidManifest.xml

      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: "17"

      - name: Bundle the JS
        run: ./android/gradlew -p android createBundleReleaseJsAndAssets -PreactNativeArchitectures=x86_64

      - name: Build the app
        run: |
          ./android/gradlew -p android assembleRelease -PreactNativeArchitectures=x86_64 -x lintVitalRelease
          apk=$(ls android/app/build/outputs/apk/release/*.apk | head -1)
          [ -n "$apk" ] || { echo "::error::assembleRelease produced no APK."; exit 1; }
          aapt=$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort | tail -1)
          id=$("$aapt" dump packagename "$apk")
          echo "APP_APK=$GITHUB_WORKSPACE/$apk" >> "$GITHUB_ENV"
          echo "APP_ID=$id" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/soak"
          unzip -l "$apk" | grep -E "libreact-native-audio-api|libturbohaptics|libav" > "$RUNNER_TEMP/soak/apk-native-libs.txt" || true
          cat "$RUNNER_TEMP/soak/apk-native-libs.txt"

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start the collector
        run: |
          nohup node scripts/collector1259.mjs "soak-android-${{ matrix.arm }}.ndjson" > "$RUNNER_TEMP/soak/collector.log" 2>&1 &
          for _ in $(seq 1 20); do curl -s http://127.0.0.1:5099/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5099/

      - name: Soak on the emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          profile: pixel_6
          emulator-options: -no-window -no-boot-anim -gpu swangle_indirect -camera-back none
          disable-animations: false
          emulator-boot-timeout: 900
          script: |
            timeout 300 adb wait-for-device
            i=0; until adb shell "getprop init.svc.bootanim | grep -q stopped && cmd package list packages > /dev/null 2>&1 && cmd settings list system > /dev/null 2>&1"; do i=$((i+1)); [ $i -lt 150 ] || { echo "::error::The framework never began serving."; exit 1; }; sleep 2; done
            adb shell settings put global hide_error_dialogs 1
            nohup adb logcat -v time -b all > "$RUNNER_TEMP/soak/logcat.txt" 2>&1 & true
            adb shell dumpsys media.audio_flinger > "$RUNNER_TEMP/soak/audio-flinger-start.txt" 2>&1 || true
            timeout 300 adb install -r "$APP_APK"
            adb shell "am start -W -a android.intent.action.VIEW -d 'murlan://soak1259?arm=${{ matrix.arm }}&host=10.0.2.2' $APP_ID"
            sleep 30
            adb shell dumpsys meminfo "$APP_ID" > "$RUNNER_TEMP/soak/meminfo-start.txt" 2>&1 || true
            adb exec-out screencap -p > "$RUNNER_TEMP/soak/screen-start.png" || true
            nohup sh -c 'while true; do date -u +%H:%M:%S; adb shell dumpsys meminfo "$APP_ID" | grep -E "Native Heap|TOTAL PSS|TOTAL RSS"; sleep 60; done' > "$RUNNER_TEMP/soak/meminfo-series.txt" 2>&1 & true
            sleep "$SOAK_SECONDS"
            adb shell dumpsys meminfo "$APP_ID" > "$RUNNER_TEMP/soak/meminfo-end.txt" 2>&1 || true
            adb shell dumpsys media.audio_flinger > "$RUNNER_TEMP/soak/audio-flinger-end.txt" 2>&1 || true
            adb exec-out screencap -p > "$RUNNER_TEMP/soak/screen-end.png" || true
            adb shell pidof "$APP_ID" > "$RUNNER_TEMP/soak/pid-end.txt" 2>&1 || echo "app not running at the end" > "$RUNNER_TEMP/soak/pid-end.txt"

      - name: Upload the soak record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak1259-android-${{ matrix.arm }}
          path: |
            scripts/soak-android-${{ matrix.arm }}.ndjson
            ${{ runner.temp }}/soak/
          if-no-files-found: warn

  ios-sim-full:
    runs-on: macos-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 24
          cache: npm

      - name: Find and boot an iPhone simulator
        run: |
          udid=$(xcrun simctl list devices available -j | node tools/ci/pick-simulator.mjs)
          echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
          xcrun simctl shutdown all 2>/dev/null || true
          for _ in $(seq 1 30); do
            xcrun simctl list devices | grep -q "(Booted)\|(Shutting Down)" || break
            sleep 2
          done
          xcrun simctl boot "$udid"

      - name: Install dependencies
        run: npm ci

      - name: Build the app
        run: |
          npx expo prebuild --platform ios --no-install
          grep -n "DISABLE_AUDIOAPI_FFMPEG\|DISABLE_AUDIOAPI_STATIC_EXTERNAL_LIBS" ios/Podfile
          pod install --project-directory=ios
          workspace=$(ls -d ios/*.xcworkspace | head -1)
          [ -n "$workspace" ] || { echo "::error::expo prebuild produced no ios/*.xcworkspace."; exit 1; }
          scheme=$(basename "$workspace" .xcworkspace)
          xcodebuild \
            -workspace "$workspace" \
            -scheme "$scheme" \
            -configuration Release \
            -sdk iphonesimulator \
            -derivedDataPath "$RUNNER_TEMP/DerivedData" \
            ONLY_ACTIVE_ARCH=YES \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            build
          app=$(ls -d "$RUNNER_TEMP/DerivedData/Build/Products/Release-iphonesimulator/"*.app | head -1)
          [ -n "$app" ] || { echo "::error::xcodebuild produced no .app."; exit 1; }
          echo "APP_BUNDLE=$app" >> "$GITHUB_ENV"
          echo "APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$app/Info.plist")" >> "$GITHUB_ENV"
          echo "APP_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$app/Info.plist")" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/soak"
          { ls "$app/Frameworks" || true; /usr/libexec/PlistBuddy -c 'Print :UIBackgroundModes' "$app/Info.plist" || true; } > "$RUNNER_TEMP/soak/app-contents.txt" 2>&1

      - name: Wait for the simulator to finish booting
        run: xcrun simctl bootstatus "$SIMULATOR_UDID"

      - name: Install the app and start the recorders
        run: |
          xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"
          nohup node scripts/collector1259.mjs soak-ios-full.ndjson > "$RUNNER_TEMP/soak/collector.log" 2>&1 &
          nohup xcrun simctl spawn "$SIMULATOR_UDID" log stream --level debug --predicate "process == \"$APP_EXE\"" > "$RUNNER_TEMP/soak/ios-app.log" 2>&1 &
          for _ in $(seq 1 20); do curl -s http://127.0.0.1:5099/ >/dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:5099/

      - name: Install Maestro
        run: |
          export MAESTRO_VERSION=2.10.0
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          "$HOME/.maestro/bin/maestro" --version 2>&1 | grep -q "$MAESTRO_VERSION"

      # iOS asks before following a custom-scheme link; Maestro answers the prompt.
      - name: Open the soak by its deep link
        env:
          MAESTRO_DRIVER_STARTUP_TIMEOUT: "300000"
        run: |
          cat > "$RUNNER_TEMP/open-soak.yaml" <<EOF
          appId: $APP_ID
          ---
          - openLink: "murlan://soak1259?arm=full&host=localhost"
          - tapOn:
              text: "Open"
              optional: true
          - extendedWaitUntil:
              visible: "SOAK1259"
              timeout: 120000
          EOF
          maestro --device "$SIMULATOR_UDID" test "$RUNNER_TEMP/open-soak.yaml"

      - name: Soak
        run: |
          sleep 20
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/soak/screen-start.png" || true
          end=$(( $(date +%s) + SOAK_SECONDS ))
          while [ "$(date +%s)" -lt "$end" ]; do
            pid=$(pgrep -x "$APP_EXE" | head -1)
            echo "$(date -u +%H:%M:%S) pid=${pid:-none} rss_kb=$( [ -n "$pid" ] && ps -o rss= -p "$pid" | tr -d ' ')" >> "$RUNNER_TEMP/soak/host-rss.txt"
            sleep 60
          done
          xcrun simctl io "$SIMULATOR_UDID" screenshot "$RUNNER_TEMP/soak/screen-end.png" || true

      - name: Collect crash reports
        if: always()
        run: cp "$HOME/Library/Logs/DiagnosticReports/"*"$APP_EXE"* "$RUNNER_TEMP/soak/" 2>/dev/null || true

      - name: Upload the soak record
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: soak1259-ios-full
          path: |
            scripts/soak-ios-full.ndjson
            ${{ runner.temp }}/soak/
          if-no-files-found: warn

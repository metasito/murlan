name: iOS Release bench build (sideload)

# A Release .ipa with the diagnostics bench compiled in: every device gate reads this build (docs/agents/device-runs.md).
on:
  workflow_dispatch:

concurrency:
  group: ios-bench-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  build:
    name: Build the unsigned Release bench .ipa
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/install
      - name: Build the app, or restore it
        id: native
        uses: ./.github/actions/ios-app
        with:
          sdk: device
          flavour: diagnostics
      - name: Package the .ipa
        env:
          APP: ${{ steps.native.outputs.app }}
        run: |
          mkdir -p "$RUNNER_TEMP/ipa/Payload"
          cp -R "$APP" "$RUNNER_TEMP/ipa/Payload/"
          (cd "$RUNNER_TEMP/ipa" && zip -qry murlan-bench.ipa Payload && rm -rf Payload)
          echo "bench-${{ github.sha }}" > "$RUNNER_TEMP/ipa/fingerprint.txt"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: murlan-ios-bench
          path: ${{ runner.temp }}/ipa/
          if-no-files-found: error
          retention-days: 30

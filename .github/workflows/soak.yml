# Plays real hands of Murlan through real sockets and checks that the clients
# and the server still agree. Deliberately NOT on `pull_request`: a soak is a
# search, so a run that finds something is a run that fails, and gating every
# pull request on a search would make `main` red for a defect the pull request
# did not introduce. It runs nightly and on demand, and earns its way into the
# critical path only after it has been quiet for a while.
name: Soak

on:
  schedule:
    # Not on the hour. GitHub's scheduler is best-effort and queues hardest at
    # :00, where every other repo's nightly also asks: the first run this
    # workflow ever had was asked for at 03:00 and dispatched at 08:37.
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      minutes:
        description: How long each seed plays for
        default: "5"
      seeds:
        description: Space-separated seeds to run
        default: "1 7 31"

concurrency:
  group: soak-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  # A nightly nobody is watching reports into the tracker, not into a run log.
  issues: write

jobs:
  soak:
    name: Play the game
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_soak
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_soak
      SESSION_SECRET: ci-soak-secret-not-used-in-production

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Play
        # Through `env`, never spliced into the script: `${{ }}` is substituted
        # as literal text before bash parses the line, so a dispatch input
        # holding shell syntax would run as shell syntax on the runner.
        env:
          MINUTES: ${{ inputs.minutes || '5' }}
          SEEDS: ${{ inputs.seeds || '1 7 31' }}
        run: |
          set -o pipefail
          failed=0
          for seed in $SEEDS; do
            echo "::group::seed $seed"
            npm run soak --silent -- --seats 4 --minutes "$MINUTES" --seed "$seed" \
              2>&1 | tee -a soak.log || failed=1
            echo "::endgroup::"
          done
          exit $failed

      # Nobody is watching a 03:00 run. GitHub's own notification for a failed
      # schedule goes to whoever last touched this file and is one unread email
      # among many; the queue is where work is actually seen, so that is where
      # a failure goes. One open issue at a time, because a soak that starts
      # failing every night must not file an issue every night.
      - name: Report the failure to the tracker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          grep -aE '^soak: (FAILED|[0-9]+ rounds)|^  \[|^  drop\+rejoin' soak.log 2>/dev/null \
            | tail -40 > found.txt || true
          # An empty grep is the case worth spelling out: the job died before
          # the harness said anything, so the run log is the only evidence.
          [ -s found.txt ] || echo "No violation was printed — the job itself failed." > found.txt
          {
            echo "The soak failed. [Run]($RUN_URL)"
            echo
            echo '```'
            cat found.txt
            echo '```'
          } > soak-failure.md
          open=$(gh issue list --label soak --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file soak-failure.md
          else
            gh issue create --title "The soak found something" \
              --label soak --label bug --label needs-triage --body-file soak-failure.md
          fi

  # tests/matchTerminates.test.ts (#770) — headless, no Postgres, no sockets.
  # CI runs it on a fixed seed band (1..200) every push, which is deliberately
  # never widened there: a check that scans new ground on every run is a check
  # that can go red for a commit that touched nothing relevant. This job moves
  # MURLAN_MATCH_SOAK_START forward by one band's width per UTC day instead —
  # every day searches ground the last one hadn't, none twice, and neither
  # band grows the deterministic band CI depends on.
  offline-match-soak:
    name: Play offline matches headless
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Choose today's band
        env:
          MURLAN_MATCH_SOAK_SEEDS: "20000"
        run: |
          start=$(( $(date -u +%s) / 86400 * MURLAN_MATCH_SOAK_SEEDS + 1 ))
          echo "band: $start..$(( start + MURLAN_MATCH_SOAK_SEEDS - 1 ))"
          # $GITHUB_ENV, not `export`: each step's `run:` is its own shell, so
          # a plain export here would not reach the "Play" step below.
          echo "MURLAN_MATCH_SOAK_START=$start" >> "$GITHUB_ENV"
          echo "MURLAN_MATCH_SOAK_SEEDS=$MURLAN_MATCH_SOAK_SEEDS" >> "$GITHUB_ENV"

      - name: Play
        run: node --test tests/matchTerminates.test.ts

      - name: Report the failure to the tracker
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          {
            echo "The offline-match soak (#770) found something. [Run]($RUN_URL)"
            echo
            echo "Re-run locally with the same band:"
            echo '```'
            echo "MURLAN_MATCH_SOAK_START=$MURLAN_MATCH_SOAK_START MURLAN_MATCH_SOAK_SEEDS=$MURLAN_MATCH_SOAK_SEEDS node --test tests/matchTerminates.test.ts"
            echo '```'
          } > offline-soak-failure.md
          open=$(gh issue list --label soak --state open --limit 1 --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --body-file offline-soak-failure.md
          else
            gh issue create --title "The offline-match soak found something" \
              --label soak --label bug --label needs-triage --body-file offline-soak-failure.md
          fi

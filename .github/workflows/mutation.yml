# Mutates lib/game and server/game (stryker.config.mjs) and files every mutant no node test notices.
# A measurement, never a gate: for the same reason as soak.yml's header, it runs weekly and on
# demand, never on push or pull_request. Survivors never fail the run; a Stryker error does.
name: Mutation

on:
  schedule:
    - cron: "47 2 * * 0"
  workflow_dispatch:

concurrency:
  group: mutation-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  shards:
    name: List the shards
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.list.outputs.matrix }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install
      - id: list
        run: echo "matrix=$(node tools/ci/mutation.mjs shards)" >> "$GITHUB_OUTPUT"

  mutate:
    name: Mutate ${{ matrix.mutate }}
    needs: shards
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJSON(needs.shards.outputs.matrix) }}
    # Integration tests in EXTRA_TESTS (stryker.config.mjs) skip without a database, which would leave
    # replays.ts and the table glue unmeasured.
    services:
      postgres:
        image: mirror.gcr.io/library/postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: murlan_test
        ports:
          - 5432:5432
        # The job must not start testing before Postgres accepts connections.
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/murlan_test
      SESSION_SECRET: ci-test-secret-not-used-in-production
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: ./.github/actions/install

      - name: Restore the last run's results
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ matrix.slug }}-${{ github.run_id }}
          restore-keys: mutation-${{ matrix.slug }}-

      - name: Mutate
        env:
          MUTATE: ${{ matrix.mutate }}
        run: npx stryker run --mutate "$MUTATE" --incremental

      - name: Keep the results for next week
        if: always()
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: reports/stryker-incremental.json
          key: mutation-${{ matrix.slug }}-${{ github.run_id }}

      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: mutation-${{ matrix.slug }}
          path: reports/mutation/mutation.json
          if-no-files-found: warn

  report:
    name: Report the survivors to the tracker
    needs: [shards, mutate]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: .node-version
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: mutation-*
          path: shards

      - name: Report the survivors to the tracker
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          MUTATION_SHARDS: ${{ needs.shards.outputs.matrix }}
        run: |
          status=0
          node tools/ci/mutation.mjs report shards mutation-report.md "$RUN_URL" || status=$?
          [ -s mutation-report.md ] || echo "The mutation report itself failed. [Run]($RUN_URL)" > mutation-report.md
          bash tools/ci/report-to-tracker.sh "Mutation testing: surviving mutants" mutation-report.md mutation
          for part in mutation-report.part-*.md; do
            [ -e "$part" ] || continue
            bash tools/ci/report-to-tracker.sh "Mutation testing: surviving mutants" "$part" mutation
          done
          exit "$status"

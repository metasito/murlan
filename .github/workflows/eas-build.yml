name: EAS Build (manual)

# Builds consume paid EAS credits, and the `submit` credentials in eas.json
# are still placeholders (see eas.json: appleId/ascAppId/serviceAccountKeyPath).
# This workflow only ever builds, never submits, and only ever runs when a
# human explicitly triggers it — never on push or pull_request.
on:
  workflow_dispatch:
    inputs:
      profile:
        description: "eas.json build profile"
        required: true
        default: development
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: "Target platform"
        required: true
        default: all
        type: choice
        options:
          - ios
          - android
          - all

jobs:
  build:
    name: EAS Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Setup EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Build
        run: eas build --platform ${{ inputs.platform }} --profile ${{ inputs.profile }} --non-interactive --no-wait

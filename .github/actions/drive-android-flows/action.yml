name: Drive the Maestro flows on an Android emulator
description: >
  Boots the emulator, installs the app, and runs the flows. Lives here rather
  than inline so `maestro.yml` can invoke it twice - once, and again only when
  the emulator never booted (#186) - without a second copy of this
  configuration to drift out of step with the first.

inputs:
  emulator-boot-timeout:
    description: >
      Seconds to wait for the emulator to boot. Lowering it is the only way to
      make the boot fail on demand, which is how the retry path in `maestro.yml`
      is exercised on a real runner rather than argued from reading.
    required: false
    default: "900"

runs:
  using: composite
  steps:
    - name: Run the flows
      uses: reactivecircus/android-emulator-runner@v2
      with:
        api-level: 34
        target: google_apis
        arch: x86_64
        profile: pixel_6
        emulator-options: -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect -camera-back none
        # Left on. #35 names this as the first knob to try for a struggling
        # emulator and it was tried, but it is the wrong one: Reanimated reads
        # the system scales as a reduced-motion signal and disables animations
        # of its own accord, and the game table then never arrives. What the
        # ANRs actually needed was
        # hide_error_dialogs, below. Driving real worklets on a real UI thread
        # is the reason this layer exists.
        disable-animations: false
        # Deliberately stock, and now on evidence rather than assumption.
        # Memory was the standing explanation for #185 and it is measured
        # false: 152 samples across run 33448536219 put the worst available
        # host memory at 10.5 GB of 16 while the game table rendered. CPU is
        # the half that is not clean - `loadavg` peaks at 8.35 on four vCPUs -
        # so if these knobs are ever raised, that is the number to argue from.
        #
        # The boot itself is intermittently slow on a runner - three runs have
        # ended on "Timeout waiting for emulator to boot", including one on
        # these very defaults, so it is the runner rather than anything
        # configured here. The action's own cap is 600s and each of those runs
        # spent all of it; this gives it half as long again. Unverified: it
        # cannot be proven except by hitting the flake again. #186.
        emulator-boot-timeout: ${{ inputs.emulator-boot-timeout }}
        script: |
          # $RUNNER_TEMP outlives an attempt, and this action runs twice in one
          # job. A marker left by the first attempt would be read as a claim
          # about the second — a device that failed to boot on the retry
          # answered for by the first attempt's "the device came up", which is
          # the wrong cause under the right verdict.
          rm -f "$RUNNER_TEMP/emulator-booted" "$RUNNER_TEMP/app-launched"
          # The flows select on Italian copy, the same way
          # tests/e2e/playwright.config.ts pins locale: "it-IT" and for the
          # same reason: a runner's emulator comes up en-US, so the app
          # renders "QUICK GUIDE" where the flow waits for "GUIDA RAPIDA" -
          # on screen, correct, and failing every assertion.
          #
          # The property needs root to set and a restart to take effect, and
          # it has to be a real reboot: `stop; start` brings the framework
          # back with System UI wedged on a two-core runner, and the app then
          # ANRs instead of rendering - the hierarchy at the point of failure
          # held the ANR dialog and nothing else. A reboot comes up clean.
          #
          # Every line here runs as its own `sh -c`: no construct may span
          # lines, and no variable survives to the next one.
          #
          # sys.boot_completed comes back long before the framework is serving:
          # the install below failed first on "Can't find service: package" and
          # then on "Cannot access system provider: 'settings'". Waiting on the
          # providers themselves, plus a stopped boot animation, waits for the
          # thing those errors are really about instead of naming them one at a
          # time.
          # Every wait below is bounded. A device that never comes back from the
          # reboot would otherwise hang until the job's own cap, and a job that
          # runs out of time is *cancelled* rather than failed - so `failure()`
          # is false, and the verdict step and both artefact uploads are all
          # skipped, in exactly the case they exist to explain.
          adb root
          timeout 300 adb wait-for-device
          adb shell setprop persist.sys.locale it-IT
          adb unroot
          timeout 300 adb wait-for-device
          adb reboot
          timeout 300 adb wait-for-device
          i=0; until [ "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1" ]; do i=$((i+1)); [ $i -lt 150 ] || { echo "::error::sys.boot_completed never reached 1."; exit 1; }; sleep 2; done
          i=0; until adb shell "getprop init.svc.bootanim | grep -q stopped && cmd package list packages > /dev/null 2>&1 && cmd settings list system > /dev/null 2>&1"; do i=$((i+1)); [ $i -lt 150 ] || { echo "::error::The framework never began serving package and settings."; exit 1; }; sleep 2; done
          adb shell getprop persist.sys.locale | tr -d '\r' | grep -qx it-IT || { echo "::error::Device locale is not it-IT; the flows select on Italian copy."; exit 1; }
          # System UI ANRs on this runner while the app is loading, and its
          # dialog then sits over everything: the app is running fine behind it
          # - its own Reanimated warnings reach logcat - but the hierarchy holds
          # the dialog and nothing else, so every assertion fails. This hides
          # the system dialog only; an app that genuinely hangs still fails.
          adb shell settings put global hide_error_dialogs 1
          # Collected as it happens, not at the end. Maestro pulls the logcat
          # when a flow finishes, and the failure this is here to explain kills
          # the emulator - so the pull hits "device offline" and the run's only
          # record of its own death is the one line the emulator managed to
          # print to the job log (#185). A stream that started earlier survives
          # the device it was reading.
          #
          # The host vitals answer the question the logcat cannot: whether the
          # runner ran out of CPU or memory at that moment, or whether both
          # were calm and the fault is the graphics pipe. Two years of comments
          # in this file assert the former without ever having measured it.
          #
          # Both are `nohup`ed because every line here is its own `sh -c`,
          # which exits immediately; the child is reparented and keeps writing.
          # Neither may fail the step - an instrument is not a verdict.
          nohup adb logcat -v time -b all > "$RUNNER_TEMP/logcat.txt" 2>&1 & true
          nohup sh -c 'while true; do date -u +%H:%M:%S; cat /proc/loadavg; free -m | head -2; sleep 5; done' > "$RUNNER_TEMP/host-vitals.txt" 2>&1 & true
          adb install -r "$APP_APK"
          # Everything above this line is the device coming up: the boot, the
          # reboot, the locale and the install. Its absence is what tells
          # `maestro.yml` the device itself never arrived (#186).
          touch "$RUNNER_TEMP/emulator-booted"
          # A device that came up is not yet an app that runs. The app has
          # started, died within five seconds and left the launcher holding the
          # foreground for the whole deadline, and the flows then failed against
          # a screen the app never drew — reported as a verdict on the branch,
          # because the only boundary was the one above (#647). So the app is
          # taken to a usable state here, where failing is still retryable.
          timeout 120 adb shell monkey -p "$APP_ID" -c android.intent.category.LAUNCHER 1
          # Resumed for ten consecutive seconds, not merely resumed once: the
          # process that dies takes several seconds to do it, and a single poll
          # lands inside that window as often as outside it.
          i=0; held=0; until [ $held -ge 10 ]; do if adb shell dumpsys activity activities | grep -q "topResumedActivity.*$APP_ID"; then held=$((held+1)); else held=0; fi; i=$((i+1)); [ $i -lt 180 ] || { echo "::error::The app never held the foreground for ten seconds; it did not reach a usable state."; exit 1; }; sleep 1; done
          # The app is up, so from here a failure is a result about the branch.
          touch "$RUNNER_TEMP/app-launched"
          # `--device` names the emulator rather than leaving Maestro to resolve
          # it, which on the iOS side was the difference between a driver that
          # started and one that failed to in three dispatches of eight.
          # `MAESTRO_APP_ID` is what tells the flows they are driving the app
          # itself: given one, they skip the Expo Go launch dance entirely.
          maestro --device emulator-5554 test -e MAESTRO_APP_ID="$APP_ID" .maestro/smoke.yaml .maestro/offline-game.yaml .maestro/exchange-phase.yaml .maestro/rematch-prompt.yaml

name: Build the iOS diagnostics release, install it and start the collector
description: >
  The device-run setup `audio-soak.yml` and `render-spike.yml` share: a booted iPhone simulator, a
  release build with the bench compiled in, the collector writing into `out-dir`, and Maestro. Sets
  SIMULATOR_UDID, APP_BUNDLE, APP_ID and APP_EXE.

inputs:
  out-dir:
    description: Directory the collector's record and the run's files go in.
    required: true
  record:
    description: File name of the collector's ndjson inside out-dir.
    required: true

runs:
  using: composite
  steps:
    - name: Find and boot an iPhone simulator
      shell: bash -e {0}
      run: |
        udid=$(xcrun simctl list devices available -j | node tools/ci/pick-simulator.mjs)
        echo "SIMULATOR_UDID=$udid" >> "$GITHUB_ENV"
        xcrun simctl boot "$udid"
    - name: Build a diagnostics release for the simulator, or restore it
      id: native
      uses: ./.github/actions/ios-app
      with:
        flavour: diagnostics
    - name: Name the app
      shell: bash -e {0}
      env:
        APP: ${{ steps.native.outputs.app }}
        OUT_DIR: ${{ inputs.out-dir }}
      run: |
        echo "APP_BUNDLE=$APP" >> "$GITHUB_ENV"
        echo "APP_ID=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" >> "$GITHUB_ENV"
        echo "APP_EXE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Info.plist")" >> "$GITHUB_ENV"
        mkdir -p "$OUT_DIR"
    - name: Install the app and start the collector
      shell: bash -e {0}
      env:
        OUT_DIR: ${{ inputs.out-dir }}
        RECORD: ${{ inputs.record }}
      run: |
        xcrun simctl bootstatus "$SIMULATOR_UDID"
        xcrun simctl install "$SIMULATOR_UDID" "$APP_BUNDLE"
        nohup node scripts/diagnostics-collector.mjs "$OUT_DIR/$RECORD" > "$OUT_DIR/collector.log" 2>&1 &
        for _ in $(seq 1 20); do curl -sf http://127.0.0.1:5099/ >/dev/null && break; sleep 1; done
        curl -sf http://127.0.0.1:5099/
    - name: Install Maestro
      shell: bash -e {0}
      run: |
        bash tools/ci/install-maestro.sh
        echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

name: Install dependencies
description: >
  Node from `.node-version`, and node_modules restored whole when the lockfile and patches match;
  `npm ci` only on a miss. setup-node's own npm cache keeps ~/.npm, so `npm ci`
  still spent ~20 s unpacking it into every job.

inputs:
  node-version:
    description: Overrides `.node-version`, for the job that must run production's Node.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - id: node
      uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
      # setup-node reads node-version-file only when node-version is empty.
      with:
        node-version: ${{ inputs.node-version }}
        node-version-file: .node-version
        package-manager-cache: false
    - id: modules
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: node_modules
        # patch-package rewrites node_modules at postinstall, so the patches are an input too.
        key: node-modules-${{ runner.os }}-node${{ steps.node.outputs.node-version }}-${{ hashFiles('package-lock.json', 'patches/**') }}
    - if: steps.modules.outputs.cache-hit != 'true'
      shell: bash
      run: npm ci
